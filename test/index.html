const seeded = n => () => (n = n * 16807 % 2147483647) / 2147483647;
function speck(g, r, n, cols, w, h, sw = 1, sh = 1){ for(let i = 0; i < n; i++){ g.fillStyle = cols[i % cols.length]; g.fillRect(Math.floor(r() * w), Math.floor(r() * h), sw, sh); } }
const TOWN_TEX = {
  road(g, w, h){ const r = seeded(7); g.fillStyle = '#3d3e42'; g.fillRect(0, 0, w, h); speck(g, r, 300, ['#35363a', '#47484c', '#2f3034', '#4d4e52'], w, h); speck(g, r, 5, ['#2a2b2e'], w, h, 6, 1); speck(g, r, 4, ['#2a2b2e'], w, h, 1, 5); },
  lot(g, w, h){ const r = seeded(17); g.fillStyle = '#4b4c4f'; g.fillRect(0, 0, w, h); speck(g, r, 300, ['#434447', '#55565a', '#3c3d40'], w, h); speck(g, r, 3, ['#36373a'], w, h, 7, 1); },
  walk(g, w, h){ const r = seeded(11); g.fillStyle = '#9b988f'; g.fillRect(0, 0, w, h); speck(g, r, 200, ['#8f8c83', '#a6a39a', '#87847b'], w, h); g.fillStyle = '#6f6c65'; g.fillRect(0, 0, w, 1); g.fillRect(0, 0, 1, h); g.fillRect(0, 16, w, 1); g.fillRect(16, 0, 1, h); },
  grass(g, w, h){ const r = seeded(3); g.fillStyle = '#56633d'; g.fillRect(0, 0, w, h); speck(g, r, 380, ['#4a5834', '#627040', '#6b6a3a', '#445030', '#5c6a3c'], w, h); speck(g, r, 22, ['#b8672a', '#c98a2e', '#8a4a22', '#d0a040'], w, h); },
  brick(g, w, h){ g.fillStyle = '#8c7868'; g.fillRect(0, 0, w, h); const cols = ['#9a4e3a', '#8c4634', '#a4573f', '#7e3f30', '#93503a']; let i = 0; for(let y = 0; y < h; y += 4) for(let x = (y / 4 % 2) * -4; x < w; x += 8){ g.fillStyle = cols[(i++ * 7 + y) % cols.length]; g.fillRect(x, y, 7, 3); } },
  siding(g, w, h){ const r = seeded(23); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speck(g, r, 60, ['#eee', '#f6f6f6', '#e4e4e4'], w, h, 3, 1); g.fillStyle = 'rgba(0,0,0,.3)'; for(let y = 0; y < h; y += 8) g.fillRect(0, y, w, 1); g.fillStyle = 'rgba(0,0,0,.1)'; for(let y = 1; y < h; y += 8) g.fillRect(0, y, w, 1); },
  roof(g, w, h){ const r = seeded(29); g.fillStyle = '#4c3e38'; g.fillRect(0, 0, w, h); speck(g, r, 200, ['#42352f', '#574840', '#3a2e2a'], w, h, 3, 2); g.fillStyle = 'rgba(0,0,0,.35)'; for(let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1); },
  hedge(g, w, h){ const r = seeded(31); g.fillStyle = '#3c4f2c'; g.fillRect(0, 0, w, h); speck(g, r, 380, ['#2e3e22', '#4a5e34', '#566a3a', '#263420'], w, h, 2, 2); },
  leafy(g, w, h){ const r = seeded(37); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speck(g, r, 300, ['#d8d8d8', '#b8b8b8', '#f0f0f0', '#9c9c9c'], w, h, 2, 2); },
  water(g, w, h){ const r = seeded(43); g.fillStyle = '#4a5a62'; g.fillRect(0, 0, w, h); speck(g, r, 60, ['#566870', '#3e4e56', '#62747a'], w, h, 5, 1); },
  panel(g, w, h){ const r = seeded(47); g.fillStyle = '#b6b2a6'; g.fillRect(0, 0, w, h); speck(g, r, 160, ['#aca89c', '#c0bcb0', '#a29e92'], w, h, 2, 1); g.fillStyle = '#8a867c'; g.fillRect(0, 0, w, 1); g.fillRect(0, 0, 1, h); },
  gymfloor(g, w, h){ const r = seeded(53); g.fillStyle = '#b8894e'; g.fillRect(0, 0, w, h); speck(g, r, 90, ['#b08046', '#c09258', '#a87a42'], w, h, 8, 1); g.fillStyle = 'rgba(60,34,10,.35)'; for(let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1); for(let i = 0; i < 16; i++) g.fillRect(Math.floor(r() * w), Math.floor(r() * 8) * 4, 1, 4); },
  block(g, w, h){ const r = seeded(59); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speck(g, r, 80, ['#f0f0f0', '#e6e6e6'], w, h, 2, 1); g.fillStyle = 'rgba(0,0,0,.2)'; for(let y = 0; y < h; y += 8){ g.fillRect(0, y, w, 1); for(let x = (y / 8 % 2) * 8; x < w; x += 16) g.fillRect(x, y, 1, 8); } },
  bark(g, w, h){ const r = seeded(41); g.fillStyle = '#4a3c30'; g.fillRect(0, 0, w, h); speck(g, r, 120, ['#3c3026', '#584838', '#32281f'], w, h, 1, 5); },
};
function townTex(T, kind, rx = 1, ry = 1){ return psxTex(T, 32, 32, (g, w, h) => TOWN_TEX[kind](g, w, h), rx, ry); }
function TM(T, kind, rx, ry, color){ return psxMat(T, { map:townTex(T, kind, rx, ry), ...(color != null ? { color } : {}) }); }
// 文字の入った板（貼り紙・看板）
function textTex(T, lines, bg, fg, w = 48, h = 32){
  return psxTex(T, w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; const lh = H / lines.length; g.font = `bold ${Math.floor(Math.min(lh * .78, W / Math.max(...lines.map(l => l.length)) * 1.5))}px sans-serif`; lines.forEach((l, i) => g.fillText(l, W / 2, lh * (i + .55))); });
}
// 地面に落ちる影（朝の低い日なので、物の片側に伸びる）
function shade(T, w, d, dx = 0, dz = 0, a = .34){ const m = flat(T, w, d, new T.MeshBasicMaterial({ color:0x0a0c10, transparent:true, opacity:a, depthWrite:false }), dx, .1, dz); m.renderOrder = 1; return m; }
// 曇りがちな朝の空：上は灰青、地平線は白っぽい
function skyTex(T, night){
  const c = document.createElement('canvas'); c.width = 4; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
  if(night){ gr.addColorStop(0, '#05070d'); gr.addColorStop(.5, '#0b1020'); gr.addColorStop(.64, '#1a1c2a'); gr.addColorStop(1, '#0b0f18'); }
  else { gr.addColorStop(0, '#6f8194'); gr.addColorStop(.45, '#9aa6ae'); gr.addColorStop(.62, '#c4c2b4'); gr.addColorStop(1, '#b4b6ae'); }
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; return t;
}
// 地面：芝の上に、道・歩道・駐車場を帯で敷く。[種類, 中心x, 中心z, 幅, 奥行き]。遠くは木立と屋根で埋める
function townGround(T, scene, c){
  if(c.base === 'water') scene.add(flat(T, 400, 400, TM(T, 'water', 100, 100), 0, -9, 0)); else scene.add(flat(T, 260, 260, TM(T, 'grass', 130, 130), 0, -.12, 0));
  (c.ground || []).forEach(([kind, x, z, w, d], i) => {
    if(kind === 'curb') scene.add(box(T, w, .14, d, M(T, 0x8f8c84), x, .07, z));
    else scene.add(flat(T, w, d, TM(T, kind, w / 2, d / 2), x, i * .008, z));
  });
  const r = seeded(c.seed || 13), cols = [0x8a5a34, 0x9a7a3a, 0x6a4a34, 0x5a5a3c, 0x7a6038];
  for(let i = 0; i < 26; i++){
    const far = i < 18, x = far ? -62 + i * 7.2 + r() * 3 : (i % 2 ? -1 : 1) * (30 + r() * 10), z = far ? -(c.back || 30) - r() * 10 : -24 + (i - 18) * 6;
    const m = new T.Mesh(new T.IcosahedronGeometry(3.2 + r() * 2.4, 0), psxMat(T, { color:cols[i % cols.length], flatShading:true }));
    m.position.set(x, 4.4 + r() * 2, z); scene.add(m, box(T, .6, 5, .6, M(T, 0x3a3028), x, 2.5, z));
    if(far && i % 3 === 1) scene.add(box(T, 8, 3.4, 5, M(T, [0xa8a498, 0x8c949a, 0xb0a48c][i % 3]), x + 3.4, 1.7, z + 7), box(T, 8.6, 1.2, 5.6, M(T, 0x463a34), x + 3.4, 4, z + 7));
  }
}

    g += cur ? `<circle cx="${x}" cy="${y}" r="12" class="m-here"/><circle cx="${x}" cy="${y}" r="3.2" fill="#b0281b"/>` : `<circle cx="${x}" cy="${y}" r="2.8" fill="${known ? '#22190f' : '#f3e8cc'}" stroke="#22190f" stroke-width=".9"/>`;
    g += `<text x="${lx}" y="${ly}" class="m-label${cur ? ' m-label-here' : ''}">${sp.short || sp.name}${cur ? '（現在地）' : ''}</text>`;
  }
  // 方位記号・題字枠
  const rose = [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<path d="M0,${a % 90 === 0 ? -13 : -7} L2.2,0 L0,2 L-2.2,0Z" transform="rotate(${a})" class="${a === 0 ? 'm-rose-n' : 'm-rose'}"/>`).join('');
  g += `<g transform="translate(${M.rose[0]} ${M.rose[1]})"><circle r="9" class="m-rose-ring"/>${rose}<text y="-16" class="m-rose-t">N</text></g>`;
  g += `<g transform="translate(${M.legend[0]} ${M.legend[1]})"><rect width="104" height="32" class="m-legend"/><rect x="2.5" y="2.5" width="99" height="27" class="m-legend-in"/><text x="52" y="14" class="m-title">${M.title}</text><text x="52" y="24" class="m-small">${M.sub}</text></g>`;
  g += `<line x1="${M.w / 3}" y1="0" x2="${M.w / 3}" y2="${M.h}" class="m-fold"/><line x1="${M.w * 2 / 3}" y1="0" x2="${M.w * 2 / 3}" y2="${M.h}" class="m-fold"/><line x1="0" y1="${M.h / 2}" x2="${M.w}" y2="${M.h / 2}" class="m-fold"/>`;
  g += `<rect width="${M.w}" height="${M.h}" filter="url(#m-grain)" opacity=".35" pointer-events="none"/><rect width="${M.w}" height="${M.h}" fill="url(#m-burn)" pointer-events="none"/>`;
  return `<div class="map${mapZoom ? ' zoom' : ''}"><div class="map-tools"><button id="mapZoom">${mapZoom ? '縮小' : '拡大'}</button></div><div class="map-scroll" id="mapScroll"><svg viewBox="0 0 ${M.w} ${M.h}" role="img" aria-label="${M.title}"><defs>${defs}</defs>${g}</svg></div>`
    + `<p>${M.note || '赤い丸が現在地。点線の細い道は、庭を抜ける道。'}</p></div>`;
}

function planOf(s){
  const P = PLANS[s.place];
  if(!P || s.book === 'monster') return null;
  const p = paraOf(s);
  const e = PLAN_PARA[s.para];
  // 部屋の決まっていない段落（その場所の通りや拠点での出来事）は拠点の部屋
  const room = p.hub || p.encounter ? P.hub : e && e.plan === s.place ? e.room : !e && !PARA_CAMS[s.para] ? P.hub : null;
  return room ? { plan:s.place, room, floor:P.rooms[room].floor } : null;
}
// その階から別の階へ行くときに使う階段の部屋
function stairsOf(P, from, to){ const m = P.stairsTo[from] || {}; return m[to] || Object.values(m)[0]; }

// 扉どうしをたどる道順（同じ階の中）
function planDoors(plan, floor){
  const P = PLANS[plan];
  return P.doors.map(([a, b, x, z, w = 1.2]) => ({ a, b, x, z, w })).filter(d => P.rooms[d.a].floor === floor && (d.b[0] === '@' || P.rooms[d.b].floor === floor));
}
// 道順で通る部屋（館内図の色分けに使う）
function planRouteRooms(plan, floor, from, to){
  const doors = planDoors(plan, floor), prev = { [from]:null }, q = [from];
  while(q.length){ const r = q.shift(); if(r === to) break; for(const d of doors){ const n = d.a === r ? d.b : d.b === r ? d.a : null; if(n && n[0] !== '@' && !(n in prev)){ prev[n] = r; q.push(n); } } }
  const out = []; for(let n = to; n && n in prev; n = prev[n]) out.unshift(n); return out;
}
function planRoute(plan, floor, from, to){
  const doors = planDoors(plan, floor);
  const prev = { [from]:null }, q = [from];
  while(q.length){
    const r = q.shift();
    if(r === to) break;
    for(const d of doors){
      const n = d.a === r ? d.b : d.b === r ? d.a : null;
      if(n && !(n in prev)){ prev[n] = { r, d }; if(n[0] !== '@') q.push(n); else if(n === to){ q.length = 0; break; } }
    }
  }
  if(!(to in prev)) return null;
  const pts = [];
  for(let n = to; prev[n]; n = prev[n].r) pts.unshift([prev[n].d.x, prev[n].d.z]);
  return pts;
}
function roomAt(plan, floor, x, z){
  const R = PLANS[plan].rooms;
  return Object.keys(R).find(k => R[k].floor === floor && x >= R[k].rect[0] && x <= R[k].rect[2] && z >= R[k].rect[1] && z <= R[k].rect[3]);
}

// 見取り図から1つの階を組み立てる。壁は扉のところだけ開ける。部屋ごとの壁を内側に寄せて、隣の部屋の壁と重ならないようにする
function buildPlanFloor(T, scene, plan, floor){
  const P = PLANS[plan];
  const O = P.outdoor;
  scene.background = new T.Color(O ? O.bg : 0x020304);
  scene.fog = O ? new T.Fog(O.fogC || O.bg, O.fog[0], O.fog[1]) : new T.Fog(0x020304, 8, 30);
  let water = null;
  if(O && O.ground) scene.add(flat(T, 160, 160, psxMat(T, { color:new T.Color(O.ground) }), 10, -.02, 10));
  if(O && O.water){ water = flat(T, 160, 160, psxMat(T, { color:0x0e1a20 }), 0, -.6, 0); scene.add(water); }
  const doors = P.doors.map(([a, b, x, z, w = 1.2]) => ({ a, b, x, z, w }));
  const lamps = [], walls = [];
  for(const [id, r] of Object.entries(P.rooms)){
    if(r.floor !== floor) continue;
    const [x0, z0, x1, z1] = r.rect, w = x1 - x0, d = z1 - z0, h = r.h, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    const fl = FLOORS[r.floorT || 'tile'];
    scene.add(flat(T, w, d, psxMat(T, { map:tileTex(T, fl[0], fl[1], Math.max(1, w / 2), Math.max(1, d / 2)) }), cx, 0, cz));
    if(!r.open) scene.add(box(T, w, .1, d, M(T, 0x101214), cx, h + .05, cz));
    if(O && O.water) scene.add(box(T, w, .6, d, M(T, 0x2a2a28), cx, -.31, cz)); // 岸壁・桟橋の厚み
    const wl = WALLS[r.wall || 'gray'];
    const wm = psxMat(T, { map:wallTex(T, wl[0], wl[1], 1, 1) });
    const t = .12, inset = t / 2;
    // 4つの辺。扉の位置で区切る
    const edges = [
      { horiz:true, at:z0 + inset, from:x0, to:x1, line:z0 }, { horiz:true, at:z1 - inset, from:x0, to:x1, line:z1 },
      { horiz:false, at:x0 + inset, from:z0, to:z1, line:x0 }, { horiz:false, at:x1 - inset, from:z0, to:z1, line:x1 },
    ];
    ['z0', 'z1', 'x0', 'x1'].forEach((k, i) => { if((r.noWall || []).includes(k)) edges[i].skip = true; });
    for(const e of edges){
      if(e.skip) continue;
      const gaps = doors.filter(dr => (dr.a === id || dr.b === id) && (e.horiz ? Math.abs(dr.z - e.line) < .01 && dr.x > e.from && dr.x < e.to : Math.abs(dr.x - e.line) < .01 && dr.z > e.from && dr.z < e.to))
        .map(dr => [(e.horiz ? dr.x : dr.z) - dr.w / 2, (e.horiz ? dr.x : dr.z) + dr.w / 2, dr]).sort((p, q) => p[0] - q[0]);
      let cur = e.from;
      const seg = (a, b, y0, y1) => {
        if(b - a < .02 || y1 - y0 < .02) return;
        const len = b - a, mid = (a + b) / 2;
        const wall = e.horiz ? box(T, len, y1 - y0, t, wm, mid, (y0 + y1) / 2, e.at) : box(T, t, y1 - y0, len, wm, e.at, (y0 + y1) / 2, mid);
        scene.add(wall); walls.push(wall);
      };
      for(const [ga, gb, dr] of gaps){
        seg(cur, ga, 0, h);
        seg(ga, gb, Math.min(h, 2.3), h); // 扉の上の壁
        if(dr.b === '@street' && plan !== 'mansion'){ // 正面のガラス戸
          const glass = new T.MeshBasicMaterial({ color:0x6a8090, transparent:true, opacity:.25 });
          const pane = e.horiz ? box(T, gb - ga, 2.3, .03, glass, (ga + gb) / 2, 1.15, e.at) : box(T, .03, 2.3, gb - ga, glass, e.at, 1.15, (ga + gb) / 2);
          pane.userData.pass = true; scene.add(pane); // 開く戸なので通れる
        }
        cur = gb;
      }
      seg(cur, e.to, 0, h);
    }
    addProps(T, scene, r.props);
    for(const [lx, lz] of (r.lamps || [])){
      if(r.open){ // 屋外は街灯
        scene.add(box(T, .14, 4.6, .14, M(T, 0x222428), lx, 2.3, lz));
        const head = glow(T, .5, .12, .3, 0xffd8a0, lx, 4.6, lz); scene.add(head);
        const l = new T.PointLight(0xffd8a0, 3, 17, 1.3); l.position.set(lx, 4.4, lz); scene.add(l);
        lamps.push({ tube:head, fl:flicker(l, 3, .04), gen:false });
        continue;
      }
      const col = r.light === 'warm' ? 0xffc880 : 0xd8e4ec, base = r.light === 'dim' ? 1 : 1.9;
      const tube = glow(T, r.light === 'warm' ? .16 : 1.2, .05, r.light === 'warm' ? .16 : .24, col, lx, h - .06, lz); scene.add(tube);
      const l = new T.PointLight(col, base, Math.max(w, d) * 1.1 + 2, 1.5); l.position.set(lx, h - .4, lz); scene.add(l);
      lamps.push({ tube, fl:flicker(l, base, r.light === 'warm' ? .02 : .05), gen:!!r.gen });
    }
  }
  scene.add(new T.AmbientLight(0x1c2433, 1.5));
  if(O){ const moon = new T.DirectionalLight(0x8fa0c0, 1.1); moon.position.set(-4, 10, 3); scene.add(moon); scene.add(new T.AmbientLight(0x2a3448, 1.2)); }
  const extra = PLAN_EXTRAS[plan] ? PLAN_EXTRAS[plan](T, scene, floor) : null;
  // 停電後は非常灯（赤）
  const fr = Object.values(P.rooms).filter(r => r.floor === floor);
  const ex = (Math.min(...fr.map(r => r.rect[0])) + Math.max(...fr.map(r => r.rect[2]))) / 2, ez = (Math.min(...fr.map(r => r.rect[1])) + Math.max(...fr.map(r => r.rect[3]))) / 2;
  const emer = new T.PointLight(0xff3020, 0, 40, 1.1); emer.position.set(ex, 2.6, ez); if(!O) scene.add(emer);
  // 正面玄関の外で回る赤色灯
  const siren = P.siren && P.siren.floor === floor ? new T.SpotLight(0xff1a10, 3, 24, .5, .6, 1.2) : null;
  if(siren){ siren.position.set(...P.siren.pos); scene.add(siren, siren.target); }
  const upd = (t, st) => {
    lamps.forEach(({ tube, fl, gen }) => { const on = gen || !st.blackout; const f = fl(on); tube.material.color.setScalar(on ? .25 + .7 * f : .06); });
    emer.intensity = st.blackout ? 1.6 + Math.sin(t * 3) * .3 : 0;
    if(water) water.position.y = -.6 + Math.sin(t * .7) * .03;
    if(extra) extra(t, st);
    for(const n of scene.userData.npcs || []) npcStep(n, t, st);
    if(siren){ const a = t * 2.6, [sx, sz] = P.siren.center; siren.target.position.set(sx + Math.cos(a) * 8, .3, sz + Math.sin(a) * 5); }
  };
  upd.walls = walls;
  return upd;
}

// 見取り図に載らない飾り。返す関数は毎コマ呼ばれる
const PLAN_EXTRAS = {
  shotengai(T, scene, floor){
    if(floor !== '地上') return null;
    const fire = new T.PointLight(0xff7020, 1.8, 8, 1.6); fire.position.set(6.4, 1.4, 14.6); scene.add(fire);
    const signs = [];
    [[-.1, 4, 0xff4060], [-.1, 15, 0x40c0ff], [-.1, 24, 0xffc040], [-.1, 36, 0xff4060], [10.1, 22, 0x40c0ff], [10.1, 29.6, 0xffc040]].forEach(([x, z, c]) => {
      const sg = glow(T, .1, .5, 2.4, c, x, 3.2, z); scene.add(sg); signs.push(sg);
    });
    return (t, st) => { fire.intensity = 1.4 + Math.random() * .8; signs.forEach((sg, i) => sg.visible = !st.blackout && (Math.random() > .04 || i % 2)); };
  },
  gas(T, scene){
    const pillar = M(T, 0xc8c8c0);
    [[8.6, 4.6], [15.4, 4.6], [8.6, 9.4], [15.4, 9.4]].forEach(([x, z]) => scene.add(box(T, .3, 3.6, .3, pillar, x, 1.8, z)));
    scene.add(box(T, 8, .5, 6.4, M(T, 0xb02020), 12, 3.85, 7));
    const pads = []; [10.5, 13.5].forEach(x => { const p = glow(T, 1.8, .04, 1, 0xf0f0e8, x, 3.59, 7); scene.add(p); pads.push(p); });
    const canopy = new T.PointLight(0xf0f0e0, 3, 12, 1.3); canopy.position.set(12, 3.2, 7); scene.add(canopy);
    const fl = flicker(canopy, 3, .03);
    return (t, st) => { const on = !st.blackout && !st.gasDark; fl(on); pads.forEach(p => p.visible = on); };
  },
  port(T, scene){
    scene.add(box(T, 17, 3, 15, M(T, 0x141414), -9.8, -1.55, 7)); // 船体
    const tower = new T.Group(); tower.add(box(T, 1.6, 6, 1.6, M(T, 0xd8d8d0), 0, 3, 0), box(T, 1.8, .8, 1.8, M(T, 0x8a2020), 0, 6.4, 0));
    tower.position.set(8, 0, -19); scene.add(tower);
    const beam = new T.SpotLight(0xffffe0, 3, 40, .25, .5, 1); beam.position.set(8, 6.6, -19); scene.add(beam, beam.target);
    const boat = new T.Group(); boat.add(box(T, 1.4, .6, 3.4, M(T, 0xd8d0c0), 0, 0, 0), box(T, .9, .6, 1, M(T, 0x3a4a5a), 0, .55, .4));
    boat.position.set(4, -.4, -3); scene.add(boat);
    return (t, st) => {
      const a = t * .8; beam.target.position.set(8 + Math.cos(a) * 20, 0, -19 + Math.sin(a) * 20);
      boat.visible = !st.boatGone; boat.position.y = -.4 + Math.sin(t * 1.3) * .06; boat.rotation.z = Math.sin(t * .9) * .05;
    };
  },
};

// 館内図（旧作ホラー風）。行った部屋だけ色が付き、今いる部屋が光る
let planFloorView = null;
function planMapSvg(s, plan, taps = null, risks = {}){
  const P = PLANS[plan], here = planOf(s);
  const floor = planFloorView && P.floors.includes(planFloorView) ? planFloorView : here ? here.floor : P.rooms[P.hub].floor;
  const seen = new Set(s.rooms || []);
  const rooms = Object.entries(P.rooms).filter(([, r]) => r.floor === floor);
  const xs = rooms.flatMap(([, r]) => [r.rect[0], r.rect[2]]), zs = rooms.flatMap(([, r]) => [r.rect[1], r.rect[3]]);
  const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1, minZ = Math.min(...zs) - 1, maxZ = Math.max(...zs) + 1.5;
  const S = 12, W = (maxX - minX) * S, H = (maxZ - minZ) * S;
  const X = x => ((x - minX) * S).toFixed(1), Z = z => ((z - minZ) * S).toFixed(1);
  let g = '';
  for(const [id, r] of rooms){
    const [x0, z0, x1, z1] = r.rect, key = `${plan}:${id}`;
    const isHere = here && here.room === id, known = seen.has(key);
    g += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * S}" height="${(z1 - z0) * S}" class="pm-room${known ? ' known' : ''}${isHere ? ' here' : ''}${r.cams ? '' : ' nocam'}${taps && taps[id] ? ' pick' : ''}"${taps && taps[id] ? ` data-spot="${taps[id]}"` : ''}/>`;
    if(known || isHere || (taps && taps[id]) || risks[id] || bookOf(s).spots) g += `<text x="${X((x0 + x1) / 2)}" y="${Z((z0 + z1) / 2)}" class="pm-name">${r.name}</text>`;
    if(r.cams && known) g += `<text x="${+X(x1) - 5}" y="${+Z(z0) + 11}" class="pm-cam">●</text>`;
  }
  for(const d of P.doors.map(([a, b, x, z, w = 1.2, label = '']) => ({ a, b, x, z, w, label })).filter(d => P.rooms[d.a].floor === floor)){
    const horiz = Object.values(P.rooms).some(r => r.floor === floor && (Math.abs(r.rect[1] - d.z) < .01 || Math.abs(r.rect[3] - d.z) < .01) && d.x > r.rect[0] && d.x < r.rect[2]);
    g += horiz ? `<rect x="${X(d.x - d.w / 2)}" y="${Z(d.z) - 2}" width="${d.w * S}" height="4" class="pm-door"/>` : `<rect x="${X(d.x) - 2}" y="${Z(d.z - d.w / 2)}" width="4" height="${d.w * S}" class="pm-door"/>`;
    if(d.b[0] === '@' && d.label) g += `<text x="${X(d.x)}" y="${+Z(d.z) + (horiz ? 14 : 4)}" class="pm-exit">${d.label}</text>`;
  }
  const tabs = P.floors.map(f => `<button data-floor="${f}" class="${f === floor ? 'on' : ''}">${f}</button>`).join('');
  return `<div class="planmap"><div class="pm-head"><b>${P.name}</b><span class="pm-tabs">${tabs}</span></div>`
    + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${P.name} ${floor}">${g}</svg>`
    + `<p>${taps ? '金色の枠の部屋を押すと、そこへ移る。' : ''}色の付いた部屋は行ったことのある部屋。光っているのが今いる部屋。● は監視カメラのある部屋。</p></div>`;
}

// 話の中で出ていく人・倒れる人が、いまどうなっているか（'in' その場にいる / 'gone' 出ていった / 'down' 倒れている）
function npcState(para, s, w){
  const f = n => flag(s, w, n);
  return {
    cell:f('cell_shot') ? 'down' : f('cell_released') ? 'gone' : 'in',
    sailor:f('sailor_free') ? 'gone' : 'in',
    boss:f('boss_dead') ? 'down' : 'in',
    gardener:+para === 407 || s.flags?.gardenerDown ? 'down' : 'in',
    riders:+para === 147 || s.flags?.trainOpen ? 'gone' : 'in',
  };
}
// 映っている最中に変わったら、動きを見せる（扉が開く・走って出ていく・倒れる）。
// 組み立てた直後と、手を戻したときは、動きを見せずにその状態にする
function npcStep(n, t, st){
  const want = st.npc?.[n.name] || 'in', g = n.g, f = g.userData.fig, [hx, hz, hr] = n.home;
  const dt = Math.min(.1, Math.max(0, t - (n.t ?? t))); n.t = t;
  if(want !== n.state){
    const jump = n.state === null || want === 'in';
    n.state = want; n.rest = false; n.k = jump ? 1 : 0; n.d = jump ? 1e9 : 0;
    g.visible = true; g.position.set(hx, 0, hz); g.rotation.y = hr;
    if(f){ g.userData.pose(); f.userData.shadow.visible = true; f.userData.spd = 0; }
    if(want === 'in') n.rest = true;
  }
  if(n.rest) return;
  n.k = Math.min(1, n.k + dt / .5);
  if(n.gate){ g.rotation.y = hr - (want === 'gone' ? 1.5 * n.k * n.k * (3 - 2 * n.k) : 0); n.rest = n.k >= 1; return; }

  else { const to = st.plan && st.plan.plan === b.plan ? st.plan.floor : P.rooms[door?.[0]]?.floor; const sr = stairsOf(P, b.floor, to); if(!sr) return; dest = b.nav.fix(P.rooms[sr].stand); }
  Cut.exitMs = planWalk(b.nav.path(youXZ(), dest), true);
  Cut.exitStart = performance.now();
  Cut.arrive = { from:st.place !== b.plan ? b.plan : null };
}
function planArrive(st){
  const b = Cut.built, P = PLANS[b.plan];
  const prevParts = (Cut.prevKey || '').split(':');
  const prev = prevParts.length > 2 && prevParts[prevParts.length - 2] === st.you ? Cut.prevKey : '';
  let startRoom, startPt;
  const fromCam = prev.split(':')[0];
  const samePlan = prev.startsWith(`plan:${b.plan}:`), prevFloor = samePlan ? prev.split(':')[2] : null;
  const fromPlace = prev.startsWith('plan:') ? (samePlan ? null : prev.split(':')[1]) : fromCam;
  const exit = samePlan ? null : (P.exitFor[fromCam] || P.exitTo?.[fromPlace] || (prev ? '@street' : null));
  const door = exit && P.doors.find(d => d[1] === exit);
  if(door && P.rooms[door[0]].floor === b.floor){ startRoom = door[0]; startPt = [door[2], door[3]]; }
  else if(prev){ startRoom = stairsOf(P, b.floor, prevFloor || P.rooms[door?.[0]]?.floor); if(startRoom) startPt = b.nav.fix(P.rooms[startRoom].stand); }
  if(!startRoom){ Cut.walk = null; return; }
  const pts = b.nav.path(startPt, planBase(st, b));
  if(Cut.youObj){
    Cut.youObj.position.x = startPt[0]; Cut.youObj.position.z = startPt[1];
    const p = pathAt(pts, .05); if(p[2] || p[3]) Cut.youObj.rotation.y = Math.atan2(p[2], p[3]);
  }
  planWalk(pts, false, { arrive:true });
}

// 見張り役：主人公のいる部屋のカメラに切り替える。カメラのない部屋なら、今のカメラのまま
const LOSE_MS = 700;   // 見失ってから切り替えるまで
const DWELL_MS = 1300; // 一度切り替えたら、これだけは同じカメラを映す（ぱたぱた替えない）
function canSee(b, eye, x, z){
  const T = THREE;
  for(const y of [1.5, .9]){
    const p = new T.Vector3(x, y, z), v = p.clone().project(eye.obj);
    if(v.z > 1 || Math.abs(v.x) > .96 || Math.abs(v.y) > .96) continue;
    const from = eye.obj.position, dir = p.clone().sub(from), dist = dir.length();
    const hit = new T.Raycaster(from, dir.normalize(), .05, dist - .25).intersectObjects(b.walls, false);
    if(!hit.length) return true;
  }
  return false;
}
// 頭から足まで画面に収まっているか（端で切れて頭だけ映るカメラは選ばない）
function wholeIn(eye, x, z){
  return [1.75, .05].every(y => { const v = new THREE.Vector3(x, y, z).project(eye.obj); return v.z <= 1 && Math.abs(v.x) <= .9 && Math.abs(v.y) <= .94; });
}
function planDirector(){
  const b = Cut.built, R = PLANS[b.plan].rooms, now = performance.now();
  const [x, z] = youXZ();
  const room = roomAt(b.plan, b.floor, x, z) || b.target;
  const r = R[room];
  const hiding = !!Cut.actors.hiding;
  const shown = Cut.youObj && Cut.youObj.visible;
  const curEye = b.eyes.find(e => e.cam === Cut.curCam);
  let cam = Cut.curCam;
  const canCut = !Cut.curCam || now - (Cut.camAt || 0) >= DWELL_MS;
  if(hiding && r?.hideCam){ if(canCut) cam = r.hideCam; }
  else if(shown){
    const seenNow = curEye && !curEye.hide && canSee(b, curEye, x, z) && wholeIn(curEye, x, z);
    if(seenNow) Cut.lostAt = 0;
    else {
      if(!Cut.lostAt) Cut.lostAt = now;
      if(!Cut.curCam || ((curEye?.hide || now - Cut.lostAt > LOSE_MS) && canCut)){
        const dist = e => Math.hypot(e.cam.pos[0] - x, e.cam.pos[2] - z) + (wholeIn(e, x, z) ? 0 : 1000) + (roomAt(b.plan, b.floor, e.cam.pos[0], e.cam.pos[2]) === room ? 0 : 10); // 同じ部屋のカメラを優先
        const cands = b.eyes.filter(e => !e.hide && canSee(b, e, x, z) && (e !== curEye || wholeIn(e, x, z))).sort((p, q) => dist(p) - dist(q));
        // 切れていても今のカメラに映っているなら、ほかも切れている限り替えない（行ったり来たりしないように）
        if(cands.length && (wholeIn(cands[0], x, z) || !curEye || curEye.hide || !canSee(b, curEye, x, z))){ cam = cands[0].cam; Cut.lostAt = 0; }
        else if(!Cut.curCam || curEye?.hide){ const any = Object.values(R).find(q => q.floor === b.floor && q.cams) || R[PLANS[b.plan].hub]; cam = any.cams[0]; }
      }
    }
  }
  if(!cam){ const any = Object.values(R).find(q => q.floor === b.floor && q.cams) || R[PLANS[b.plan].hub]; cam = any.cams[0]; }
  const eye = b.eyes.find(e => e.cam === cam);
  const visible = shown && eye && (eye.hide || canSee(b, eye, x, z));
  // 見張り役に分かるのは、映っているかどうかだけ
  const target = visible || !shown ? Cut.mainTarget : `捜索中：${Cut.who}`;
  document.getElementById('camTarget').textContent = target;
  if(cam === Cut.curCam) return;
  const first = !Cut.curCam;
  Cut.curCam = cam; Cut.camAt = now;
  b.camera.position.set(...cam.pos); b.camera.lookAt(...cam.look); b.camera.fov = cam.fov || 70; b.camera.updateProjectionMatrix();
  document.getElementById('camName').textContent = `CAM-${cam.no}　${PLANS[b.plan].name.replace('ハロウベイ', '')} ${cam.name}`;
  if(!first) cutStatic(300);
}

// 主人公が物陰に隠れたら、見張り役はその裏を映すカメラに切り替える（なければ見失う）
function applyHideCam(hiding){
  const b = Cut.built, cam = Cut.camera, wrap = document.getElementById('cutscene');
  const prev = Cut.hidShown;
  Cut.hidShown = hiding;
  const name = document.getElementById('camName'), target = document.getElementById('camTarget');
  if(hiding && b.hideView === 'cam'){
    cam.position.set(...b.hideCam.pos); cam.lookAt(...b.hideCam.look);
    name.textContent = `CAM-${b.hideCam.no}　${b.hideCam.name}`;
  } else {
    cam.position.copy(Cut.mainPos); cam.quaternion.copy(Cut.mainQuat);
    name.textContent = Cut.mainName;
  }
  target.textContent = hiding && b.hideView === 'none' ? `捜索中：${Cut.who}` : Cut.mainTarget;
  if(prev !== null && b.hideView === 'cam') cutStatic(420);
}

// 前の場面の部品と画像を片付ける（カメラを切り替えるたびに溜まらないように）
function disposeScene(sc){
  sc.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach(m => { if(m.map) m.map.dispose(); m.dispose(); });
  });
}

function buildPlace(st){
  const T = THREE;
  if(Cut.scene) disposeScene(Cut.scene);
  if(!Cut.renderer){
    Cut.renderer = new T.WebGLRenderer({ canvas:document.getElementById('cutcanvas'), antialias:false });
    Cut.renderer.setPixelRatio(1);
    Cut.renderer.setSize(RES_W, RES_H, false);
  }
  const scene = new T.Scene();
  const def = CAM_DEFS[st.cam];
  const built = st.plan ? planBuilt(T, scene, st.plan) : def ? (def.room ? buildRoom(T, scene, def.room) : buildOut(T, scene, def.out)) : PLACE_SCENES[st.place](T, scene);
  Cut.scene = scene; Cut.camera = built.camera; Cut.update = built.update; Cut.built = built;
  Cut.mainPos = built.camera.position.clone(); Cut.mainQuat = built.camera.quaternion.clone(); Cut.hidShown = null;
  Cut.actors = makeActors(T, scene, built, st);
  if(built.plan){ planArrive(st); Cut.arrive = null; }
  if(Cut.arrive){
    Cut.actors.enterFrom = (Cut.arrive.from && built.exits?.[Cut.arrive.from]) || built.enter || built.door || null;
    Cut.actors.enterStart = performance.now();
    Cut.arrive = null;
  }
  Cut.start = performance.now(); Cut.last = 0;
  cancelAnimationFrame(Cut.raf);
  const wrap = document.getElementById('cutscene'), timeEl = document.getElementById('camTime');
  const loop = now => {
    Cut.raf = requestAnimationFrame(loop);
    if(document.hidden || now - Cut.last < 1000 / FPS) return;
    Cut.last = now;
    const t = (now - Cut.start) / 1000;
    const secs = Cut.clockBase * 60 + Math.floor((now - Cut.clockAt) / 1000);
    const hh = Math.floor(secs / 3600), mm = Math.floor(secs / 60) % 60, ss = secs % 60;
    timeEl.textContent = `11/08　${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    wrap.classList.toggle('glitch', Math.random() < (Cut.state.encounter ? 0.35 : 0.03));
    Cut.update(t, Cut.state);
    Cut.actors.update(t, Cut.state);
    if(Cut.built.plan) planDirector(); else if(!!Cut.actors.hiding !== Cut.hidShown) applyHideCam(!!Cut.actors.hiding);
    Cut.renderer.render(Cut.scene, Cut.camera);
    drawOsd(now);
  };
  Cut.raf = requestAnimationFrame(loop);
}

// 監視カメラの画面の文字。映像と同じ 320×180 に描いて引き伸ばすので、文字も荒くにじむ
function drawOsd(now){
  const c = document.getElementById('osd'); if(!c) return;
  const g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const txt = id => document.getElementById(id).textContent;
  const sk = (now - (Cut.staticAt || -1e9)) / (Cut.staticMs || 1);
  if(sk < 1) drawStatic(g, W, H, sk);
  const put = (text, x, y, align, color, max) => {
    let size = 10;
    g.font = `${size}px "MS Gothic", "Osaka-mono", monospace`;
    while(size > 7 && g.measureText(text).width > max){ size--; g.font = `${size}px "MS Gothic", "Osaka-mono", monospace`; }
    g.textAlign = align; g.textBaseline = 'alphabetic';
    g.lineWidth = 2; g.strokeStyle = 'rgba(0,0,0,.85)'; g.strokeText(text, x, y);
    g.fillStyle = 'rgba(255,60,60,.35)'; g.fillText(text, x - 1, y); // 色のにじみ
    g.fillStyle = color; g.fillText(text, x, y);
  };
  put(txt('camName'), 6, 13, 'left', '#e8f0e0', W - 52);
  if(Math.floor(now / 500) % 2) put('● REC', W - 32, 13, 'right', '#ff4a3a', 44);
  put(txt('camTime'), W - 6, H - 6, 'right', '#e8f0e0', 110);
  put(txt('camTarget'), 6, H - 6, 'left', '#e8f0e0', W - 124);
}

// カメラを切り替えた瞬間の砂嵐：はじめは画面いっぱい、あとは帯が下へ流れて消える
function drawStatic(g, W, H, k){
  const img = g.createImageData(W, H), d = img.data;
  const full = k < .6, band = ((k - .6) / .4) * (H + 30) - 15;
  for(let y = 0; y < H; y++){
    const inBand = !full && Math.abs(y - band) < 12, streak = full && Math.random() < .08;
    if(!full && !inBand && Math.random() > .25) continue;
    for(let x = 0; x < W; x += 2){
      if(!full && !inBand && Math.random() > .12) continue;
      const v = streak ? 200 + Math.random() * 55 : Math.random() * 235, a = full ? 255 : inBand ? 220 : 150;
      for(let i = (y * W + x) * 4, e = i + 8; i < e; i += 4){ d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    }
  }
  g.putImageData(img, 0, 0);
}

// 頂点を粗い格子に吸い付かせる（ポリゴンがカクカク揺れる）材質
function psxMat(T, params){
  const m = new T.MeshLambertMaterial(params);
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * vec2(120.0, 68.0) + 0.5) / vec2(120.0, 68.0) * gl_Position.w;');
  };
  return m;
}
function psxTex(T, w, h, draw, rx = 1, ry = 1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.magFilter = t.minFilter = T.NearestFilter;
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
function box(T, w, h, d, mat, x, y, z){ const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; }
function flat(T, w, d, mat, x, y, z, rot = 0){ const m = new T.Mesh(new T.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, y, z); return m; }
function glow(T, w, h, d, color, x, y, z){ return box(T, w, h, d, new T.MeshBasicMaterial({ color }), x, y, z); }
const tileTex = (T, a, b, rx, ry) => psxTex(T, 16, 16, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h); g.fillStyle = b; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8);
  g.fillStyle = 'rgba(0,0,0,.25)'; for(let i = 0; i < 18; i++) g.fillRect((i * 7) % 16, (i * 11) % 16, 1, 1);
}, rx, ry);
const wallTex = (T, a, b, rx, ry) => psxTex(T, 16, 16, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h); g.fillStyle = b; g.fillRect(0, 11, w, 5);
  g.fillStyle = 'rgba(0,0,0,.22)'; for(let i = 0; i < 10; i++) g.fillRect((i * 5) % 16, (i * 3) % 11, 1, 2);
}, rx, ry);
// ちらつく明かり
function flicker(light, base, rate = .07){
  let f = 1;
  return (on = true) => {
    if(Math.random() < rate) f = Math.random() < .5 ? .05 : .45; else f += (1 - f) * .5;
    light.intensity = on ? base * f : 0;
    return f;
  };
}

// ===== 人物：旧作ホラー風の頭身（約8頭身）の、関節付きの人形。荒い映像でも誰だか分かるよう、服の柄・帽子・足元の影を付ける =====
function texCanvas(T, w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
  const t = new T.CanvasTexture(c); t.magFilter = t.minFilter = T.NearestFilter; return t;
}
// 面ごとに明るさが変わる（角ばって見える）材質
function fmat(T, p){ const m = psxMat(T, p); m.flatShading = true; return m; }
function faceTex(T, o){
  return texCanvas(T, 16, 16, g => {
    const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    R(o.skin, 0, 0, 16, 16);
    R('rgba(0,0,0,.16)', 0, 4, 1, 12); R('rgba(0,0,0,.16)', 15, 4, 1, 12); R('rgba(0,0,0,.14)', 0, 14, 16, 2);
    R(o.hair, 0, 0, 16, o.hairH || 4);
    if(o.zombie){
      R('#0d0606', 3, 6, 4, 4); R('#0d0606', 9, 6, 4, 4);                 // 落ちくぼんだ目
      R('#d0d0a8', 5, 8, 1, 1); R('#d0d0a8', 10, 7, 1, 1);
      R('rgba(40,50,30,.5)', 1, 5, 3, 2); R('rgba(40,50,30,.5)', 11, 10, 3, 2);
      R('#8a0c0c', 4, 12, 8, 4); R('#8a0c0c', 3, 10, 2, 5); R('#8a0c0c', 11, 13, 2, 3); // 口のまわりの血
      R('#2a0404', 5, 11, 6, 3); R('#b8b090', 6, 11, 4, 1);               // 開いた口と歯
    } else {
      R(o.hair, 3, 6, 4, 1); R(o.hair, 9, 6, 4, 1);                       // 眉
      R('#1a1010', 4, 7, 2, 2); R('#1a1010', 10, 7, 2, 2);                // 目
      R('rgba(0,0,0,.2)', 7, 8, 2, 3);                                    // 鼻の影
      R('rgba(100,30,30,.7)', 6, 12, 4, 1);                               // 口
    }
  });
}
// 頭の横。前側（flip で左右を返す）に顔、後ろ側に髪、まんなかに耳
function sideTex(T, o, flip){
  return texCanvas(T, 16, 16, g => {
    const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(flip ? 16 - x - w : x, y, w, h); };
    R(o.skin, 0, 0, 16, 16);
    R('rgba(0,0,0,.14)', 0, 14, 16, 2);
    R(o.hair, 0, 0, 16, (o.hairH || 4) + 1); R(o.hair, 9, 0, 7, 11);
    R('rgba(0,0,0,.3)', 6, 7, 2, 3);
    if(o.zombie){ R('#8a0c0c', 0, 11, 4, 4); R('rgba(40,50,30,.5)', 3, 6, 3, 3); }
  });
}
function clothTex(T, o){
  return texCanvas(T, 16, 16, g => {
    g.fillStyle = o.base; g.fillRect(0, 0, 16, 16);
    if(o.detail) o.detail(g);
    if(o.torn){ g.fillStyle = o.skin; [[1, 11, 3, 5], [12, 5, 4, 3], [7, 14, 3, 2]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h)); }
    if(o.blood){
      g.fillStyle = 'rgba(115,10,10,.9)'; [[3, 4, 4, 3], [9, 8, 5, 4], [6, 12, 3, 4], [11, 1, 3, 2]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
      g.fillStyle = 'rgba(60,0,0,.9)'; g.fillRect(4, 6, 2, 7); g.fillRect(10, 11, 1, 5);
    }
  });
}
// 胴に巻く服の絵。R(色, 横, 縦, 幅, 高さ) の「横」は胸のまんなかからの位置（＋が本人の左）。胸の正面は −4〜3、背中は ±20〜24
function wrapTex(T, h, draw){
  return texCanvas(T, 48, h, g => {
    const R = (color, x, y, w, hh) => { g.fillStyle = color; const px = ((44 + x) % 48 + 48) % 48; g.fillRect(px, y, w, hh); if(px + w > 48) g.fillRect(px - 48, y, w, hh); };
    draw(R, g);
  });
}
function limb(T, rt, rb, h, mat){ const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, 6), mat); m.position.y = -h / 2; return m; }
function at(m, x, y, z){ m.position.set(x, y, z); return m; }

function humanoid(T, o){
  const g = new T.Group();
  const hex = c => typeof c === 'string' ? parseInt(c.slice(1), 16) : c;
  const skin = fmat(T, { color:hex(o.skinColor) });
  const sleeve = fmat(T, { color:hex(o.sleeve) });
  const pants = fmat(T, { map:clothTex(T, o.pants) });
  const shoe = fmat(T, { color:hex(o.shoe ?? 0x1a1a1a) });
  const hand = o.hand ? fmat(T, { color:hex(o.hand) }) : skin;
  const six = (rt, rb, h, mats) => new T.Mesh(new T.CylinderGeometry(rt, rb, h, 6, 1, false, Math.PI / 6), mats);
  const HIP = .92;
  // 上半身は腰を軸に動く。胸は腹より広く、前後は薄い
  const body = new T.Group(); body.position.y = HIP; g.add(body);
  body.add(box(T, .34, .16, .21, pants, 0, .03, 0));
  const belly = at(six(.18, .17, .22, [fmat(T, { map:o.low }), sleeve, sleeve]), 0, .19, 0); belly.scale.z = .68; body.add(belly);
  const chest = new T.Group(); chest.position.y = .27; body.add(chest);
  const torso = at(six(.225, .18, .33, [fmat(T, { map:o.top }), sleeve, sleeve]), 0, .165, 0); torso.scale.z = .66; chest.add(torso);
  const slope = at(six(.1, .225, .06, sleeve), 0, .36, 0); slope.scale.z = .66; chest.add(slope);
  if(o.skirt){ // 白衣・病院着のすそ
    const sk = at(new T.Mesh(new T.CylinderGeometry(.19, .245, .5, 6, 1, true, Math.PI / 6), fmat(T, { map:o.skirt, side:T.DoubleSide })), 0, -.1, 0); sk.scale.z = .72; body.add(sk);
  }
  if(o.holster) body.add(box(T, .06, .17, .11, fmat(T, { color:0x0b0b0e }), -.2, 0, .01));
  // 首と頭（頭は身長の約8分の1）
  const neck = new T.Group(); neck.position.y = .385; chest.add(neck);
  neck.add(at(new T.Mesh(new T.CylinderGeometry(.055, .065, .09, 6), skin), 0, .035, 0));
  const hair = fmat(T, { color:hex(o.hairColor) });
  neck.add(at(new T.Mesh(new T.BoxGeometry(.19, .23, .21), [fmat(T, { map:sideTex(T, o.face, false) }), fmat(T, { map:sideTex(T, o.face, true) }), hair, skin, fmat(T, { map:faceTex(T, o.face) }), hair]), 0, .19, .01));
  if(o.cap){ // 制帽：上・帯・つば・記章
    const cap = fmat(T, { color:hex(o.cap) }), dark = fmat(T, { color:0x07090f });
    neck.add(at(new T.Mesh(new T.CylinderGeometry(.128, .108, .075, 8), cap), 0, .345, 0), at(new T.Mesh(new T.CylinderGeometry(.11, .11, .03, 8), dark), 0, .3, 0));
    neck.add(box(T, .17, .016, .1, dark, 0, .29, .145), box(T, .035, .035, .012, new T.MeshBasicMaterial({ color:0xd8b84a }), 0, .34, .118));
  } else if(!o.bald) neck.add(box(T, .2, .07, .22, hair, 0, .285, 0));
  // 腕：肩・肘・手
  const arm = side => {
    const sh = new T.Group(); sh.position.set(side * .265, .3, 0); sh.rotation.z = side * .06; chest.add(sh);

//   room.json … 部屋の設定（ホスト・開いているか・追い抜ける幅）
//   own/<本>.json … その本をロックしている人。ファイルを作れた人がロックした人（同時に押しても、先に届いたほうだけが通る）
//   m/<端末>.json … その端末の分をまとめたもの（進み具合・書いた話・返信・答え・絵文字・既読）。書くのは、その端末だけ

// 書く・消す。GitHub は、同じリポジトリへ何人かが同時に書くと（別々のファイルでも）、1人だけを通して、ほかを断る（409）。断られたら、少し待って、最新を見てから、もう一度書く
// build(今あるファイル) が、書く中身を返す。null を返したら、やめる（412 を返す。ロックが、もうほかの人のものだった、など）
const ghWait = i => new Promise(z => setTimeout(z, 250 + Math.random() * 700 * (i + 1)));
const ghDecode = meta => { try { return JSON.parse(decodeURIComponent(escape(atob(String(meta.content).replace(/\s/g, ''))))); } catch(e){ return null; } };
async function ghWrite(path, build, opt = {}){
  const api = opt.api || ghApi;
  for(let i = 0; i < 6; i++){
    const g = await api(path);
    if(!g.ok && g.status !== 404) return { status:g.status };
    const meta = g.ok ? await g.json() : null, body = build(meta);
    if(!body) return { status:412, meta };
    const r = await api(path, { method:'PUT', keepalive:opt.keepalive, body:JSON.stringify({ ...body, ...(meta ? { sha:meta.sha } : {}) }) });
    if(r.ok) return { status:200, sha:(await r.json()).content.sha };
    if(r.status !== 409 && r.status !== 422) return { status:r.status };
    await ghWait(i);
  }
  return { status:409 };
}
async function ghDelete(path, message){
  for(let i = 0; i < 6; i++){
    const g = await ghApi(path);
    if(g.status === 404) return { status:200 };
    if(!g.ok) return { status:g.status };
    const r = await ghApi(path, { method:'DELETE', body:JSON.stringify({ message, sha:(await g.json()).sha }) });
    if(r.ok) return { status:200 };
    if(r.status !== 409 && r.status !== 422) return { status:r.status };
    await ghWait(i);
  }
  return { status:409 };
}

const repoSeen = { dirs:{}, files:{} }; // dirs[名前] = その入れ物の印　files[道] = { sha, data }
// 自分の分（まだ書いていない分も入っている）
let myFile = store.get('my-file', null) || {}, myDirty = store.get('my-dirty', false), mySha = null, myT = 0, myDue = 0, myBusy = false, myBeat = 0;

// 自分の分を書く。hard は、話やロックのように早く届けたいもの
function myTouch(kind){
  myDirty = true; myFile.rev = (myFile.rev || 0) + 1; mySave();
  liveSend();

  const now = Date.now(), ms = liveOn() ? (kind === 'fast' ? 60000 : kind === 'soft' ? 300000 : 180000) : kind === 'fast' ? 4000 : kind === 'soft' ? 90000 : 45000;
  if(myDue > now && (kind === 'soft' || myDue < now + 5000)) return; // もうすぐ書く予定があるなら、延ばさない
  const wait = ms + Math.random() * 2500;

async function myFlush(keepalive){
  if(!room || !ghReady() || myBusy || !myDirty) return;
  // 送る時刻を決めてあって、まだその前なら、その時刻まで書かない（書いた時刻が、リポジトリの履歴に残るため）
  const hold = sendAfter();
  if(hold){ clearTimeout(myT); myDue = hold; myT = setTimeout(myFlush, hold - Date.now() + 1000); return; }
  myBusy = true; myDue = 0;
  const path = repoBase() + 'm/' + DEV + '.json';

    myFile.name = store.get('fb-name', '').slice(0, 30); myFile.at = Date.now();
    const text = JSON.stringify(myFile);
    const r = await ghWrite(path, () => ({ message:'部屋 ' + room + '：' + (myFile.name || DEV) + ' の分', content:b64(text) }), { keepalive });
    if(r.status !== 200) throw r.status;

// リポジトリを読みに行く：入れ物の印が変わった所だけ、中を読む
async function repoSync(){
  const base = repoBase(), list = async path => { const r = await ghApi(path); if(r.status === 404) return null; if(!r.ok) throw r.status; return r.json(); };
  const top = await list(base.slice(0, -1));
  if(!top){ repoSeen.files = {}; repoSeen.dirs = {}; return; }
  const read = async (path, sha) => { const cur = repoSeen.files[path]; if(cur && cur.sha === sha) return; const r = await ghApi(path, { raw:true }); if(!r.ok) throw r.status; let data = null; try { data = JSON.parse(await r.text()); } catch(e){} repoSeen.files[path] = { sha, data }; };
  const want = new Set();
  for(const f of top){
    if(f.type === 'file' && (f.name === 'room.json' || f.name === 'claude.json')){ want.add(base + f.name); await read(base + f.name, f.sha); }
    else if(f.type === 'dir' && (f.name === 'm' || f.name === 'own')){
      if(repoSeen.dirs[f.name] && repoSeen.dirs[f.name].sha === f.sha){ repoSeen.dirs[f.name].paths.forEach(p => want.add(p)); continue; }
      const kids = (await list(base + f.name)) || [], paths = [];

      repoSeen.dirs[f.name] = { sha:f.sha, paths };
    }
  }
  for(const p of Object.keys(repoSeen.files)) if(!want.has(p)) delete repoSeen.files[p];
  for(const d of ['m', 'own']) if(!top.some(f => f.type === 'dir' && f.name === d)) delete repoSeen.dirs[d];
  // 採用されたものを読む
  const bk = await list('book'), of = (bk || []).find(f => f.name === 'overlay.json');
  if(of && of.sha !== overlaySha && !CUSTOM){ const r = await ghApi('book/overlay.json', { raw:true }); if(r.ok){ try { const o = clean(JSON.parse(await r.text())); overlay = { base:(o && o.base) || null, keys:(o && o.keys) || {}, items:(o && o.items) || {} }; overlaySha = of.sha; store.set('overlay', overlay); } catch(e){} } }

// 読んだものと自分の分から、部屋の中身を組み立てる
function repoDoc(){

  if(!cfg || !cfg.data || cfg.data.deleted) return null;
  const doc = { v:2, open:cfg.data.open === true, gap:cfg.data.gap || 0, host:cfg.data.host, own:{}, members:{}, items:{}, stats:{} }, mem = {};
  for(const [p, f] of Object.entries(repoSeen.files)){

    if(!m || !f.data || typeof f.data !== 'object') continue;

  }
  for(const [dev, f] of Object.entries(liveFiles)) if(dev !== DEV && (!mem[dev] || (f.rev || 0) >= (mem[dev].rev || 0))) mem[dev] = f;
  mem[DEV] = Object.assign({}, mem[DEV], myFile, { name:store.get('fb-name', '').slice(0, 30), at:myBeat || (mem[DEV] && mem[DEV].at) || Date.now() });

  for(const [dev, f] of Object.entries(mem)){
    doc.members[dev] = { name:String(f.name || ''), at:Number(f.at) || 0 };
    for(const c of CHAR_IDS){ // 本の進み具合は、その本をロックしている人の分だけを信じる（誰もロックしていなければ、いちばん新しいもの）
      const o = doc.own[c], cur = Number(doc['at_' + c]) || 0, at = Number(f['at_' + c]) || 0;
      if(typeof f['p_' + c] !== 'string' || (o ? o.dev !== dev : at <= cur)) continue;
      doc['p_' + c] = f['p_' + c]; doc['w_' + c] = f['w_' + c]; doc['at_' + c] = at;
    }
    for(const [k, it] of Object.entries(obj(f.items))) if(segOk(k) && k.startsWith(dev + '-') && it && typeof it === 'object') doc.items[k] = { ...it, re:{}, votes:{}, seen:{}, rx:{} };
    for(const [k, v] of Object.entries(obj(f.stats))) if(segOk(k)) doc.stats[k] = v;
  }
  for(const [dev, f] of Object.entries(mem)){
    for(const [k, rs] of Object.entries(obj(f.re))) if(doc.items[k]) for(const [rid, r] of Object.entries(obj(rs))) if(segOk(rid) && rid.startsWith(dev + '-')) doc.items[k].re[rid] = r;
    for(const [k, v] of Object.entries(obj(f.votes))) if(doc.items[k]) doc.items[k].votes[dev] = v;
    for(const k of Object.keys(obj(f.seen))) if(doc.items[k]) doc.items[k].seen[dev] = 1;
    for(const [k, es] of Object.entries(obj(f.rx))) if(doc.items[k]) for(const e of Object.keys(obj(es))) if(/^e\d$/.test(e)) (doc.items[k].rx[e] = doc.items[k].rx[e] || {})[dev] = 1;

  for(const [k, v] of Object.entries(obj(cl && cl.data && cl.data.items))) if(doc.items[k] && v && typeof v === 'object'){ if(typeof v.reply === 'string') doc.items[k].reply = v.reply.slice(0, 2000); if(v.done === true) doc.items[k].done = true; }
  return doc;
}
// ホストが、部屋の設定を書く
async function repoConfig(change){

  let next = null;
  const r = await ghWrite(path, meta => { if(!meta) return null; next = { ...(ghDecode(meta) || {}), ...change, updated:Date.now() }; return { message:'部屋 ' + room + ' の設定', content:b64(JSON.stringify(next)) }; });

// ===== 速い道：ホストがこのページを開いているあいだは、端末どうしを直接つなぐ（PeerJS。相手を見つけるところだけ、公開の仲介サーバーを使う） =====
// 渡すのは、リポジトリに書くのと同じ「自分の分」。ホストが受け取って、ほかの人へ回す。つながらなければ、リポジトリ経由だけで動く

let peer = null, hostConn = null, peerOn = false, peerLib = null, peerRetryT = 0, liveT = 0, liveGotT = 0, liveChT = 0;
const hostConns = new Map(), liveFiles = {}; // hostConns：つないできた相手 → その端末の名前　liveFiles：じかに受け取った、端末ごとの分
const liveOn = () => peerOn && (isHost() ? hostConns.size > 0 : !!hostConn);

function liveChanged(){ if(liveOn()) liveAll({ t:'changed' }); }
function liveGot(dev, data){
  if(!segOk(dev) || dev === DEV || !data || typeof data !== 'object' || Array.isArray(data) || JSON.stringify(data).length > 900000) return false;

    s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; s.integrity = 'sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR'; s.crossOrigin = 'anonymous';

const peerShow = () => { if(roomPanel && !typing()) render(); };
function peerRetry(ms){ clearTimeout(peerRetryT); peerRetryT = setTimeout(peerStart, ms); }

// じかに受け取った分で、画面を組み直す（リポジトリは読みに行かない）

}
const GUIDE_MD = '# Joining the Living Dead の部屋の記録\n\nこのリポジトリには、ゲーム「Joining the Living Dead」の部屋の中身が入る。部屋に入っている人の端末が、自動で書いている。\n\n'

// 変えた行だけを、前と後で並べる
function lineChanges(a, c){
  const x = a.split('\n'), y = c.split('\n'), n = x.length, m = y.length;
  const L = Array.from({ length:n + 1 }, () => new Array(m + 1).fill(0));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0, del = [], add = [];
  const flush = () => { if(del.length || add.length) out.push({ before:del.join('\n'), after:add.join('\n') }); del = []; add = []; };
  while(i < n || j < m){
    if(i < n && j < m && x[i] === y[j]){ flush(); i++; j++; }
    else if(j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) add.push(y[j++]);
    else del.push(x[i++]);
  }
  flush();
  return out.filter(ch => ch.before.trim() || ch.after.trim());
}

function shrinkImage(file, done){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 900 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    done(cv.toDataURL('image/jpeg', .55));
  }; im.onerror = () => { fbNote = 'その画像は、読めませんでした。'; render(); }; im.src = rd.result; };
  rd.readAsDataURL(file);
}

    if(fbe && fbe.kind === 'choice' && fbe.orig === orig){ btn.replaceWith(choiceEditor(!!changed || gone || off || !!d.cond[orig])); return; }
    if(changed){ const mark = btn.textContent.startsWith('▶ ') ? '▶ ' : ''; btn.textContent = mark + changed; }
    btn.classList.toggle('draft', (!!changed && !d.ok.labels.has(orig)) || (gone && !d.ok.del.has(orig)) || (off && !d.ok.off.has(orig))); btn.classList.toggle('gone', gone); btn.classList.toggle('editable', editOn);
    if(gone && d.ok.del.has(orig) && !editOn) btn.style.display = 'none'; // 採用されて消えた選択肢は、出さない
    if(off){ const t = document.createElement('span'); t.className = 'tag'; t.textContent = d.ok.off.has(orig) ? '選べない' : '選べなくした（下書き）'; btn.appendChild(t); btn.disabled = true; }
    else if(locked.includes(orig)) lockTag(btn);
    else if(d.cond[orig]) needTag(btn, { label:orig, fx:d.cond[orig] });
    const row = document.createElement('div'); row.className = 'crow';
    btn.replaceWith(row); row.appendChild(btn);
    const edit = () => { fbe = { kind:'choice', orig, value:changed || orig, fx:JSON.parse(JSON.stringify(d.cond[orig] || {})) }; fbNote = ''; render(); };
    if(editOn){ btn.disabled = false; btn.onclick = edit; }
    else if(TEST_BUILD){ const p = document.createElement('button'); p.className = 'fbe'; p.textContent = '✎'; p.title = 'この選択肢を直す'; p.setAttribute('aria-label', 'この選択肢を直す'); p.onclick = edit; row.appendChild(p); }
  });
  // 足した選択肢を選んだあとの場面：その先の選択肢を、さらに足していける
  if(draftShown && draftShown.key === key && draftShown.scene){
    const sk = draftShown.scene, sub = document.createElement('div'); sub.className = 'choices dsub';
    const dS = shownOf(sk), okSet = dS.ok.add;
    for(const a of dS.add){
      if(a.fx && a.fx.hide && !editOn) continue;
      if(fbe && fbe.kind === 'add' && fbe.scene === sk && fbe.id === a.id){ sub.appendChild(addEditor()); continue; }
      const q = document.createElement('button'), okA = okSet.has(a.id); q.className = (okA ? '' : 'pending draft') + (editOn ? ' editable' : '');
      q.innerHTML = escText(a.label) + '<span class="tag">この先に足した選択肢（下書き）　' + escText([toText(a.to), fxText(a.fx), stageText(a) ? '演出：' + stageText(a) : '', condText(a)].filter(Boolean).join('　')) + '</span>';
      if(okA){ const tg = q.querySelector('.tag'); if(tg) tg.remove(); }
      q.onclick = () => {
        if(editOn){ fbe = { kind:'add', id:a.id, label:a.label, result:a.result, to:a.to, fx:{ ...a.fx }, scene:sk }; fbNote = ''; render(); return; }
        if(!live){ fbNote = '足した選択肢は、自分が進めている本で試せます。'; render(); return; }
        runDraft(a, key, sk + '>' + a.id, v);
      };
      if(locked.includes(a.label)) lockTag(q); else needTag(q, a);
      sub.appendChild(q);
    }
    if(fbe && fbe.kind === 'add' && fbe.scene === sk && !fbe.id) sub.appendChild(addEditor());
    else if(TEST_BUILD){ const more = document.createElement('button'); more.className = 'pending'; more.textContent = '＋ この先に、選択肢を足す'; more.onclick = () => { fbe = { kind:'add', label:'', result:'', to:'stay', scene:sk }; fbNote = ''; render(); }; sub.appendChild(more); }
    const back = document.createElement('button'); back.className = 'pending'; back.textContent = '足した場面を閉じる'; back.onclick = () => { const p = loadPlayer(current); if(p.offcam || p.pose){ p.offcam = false; p.pose = null; store.set('player-' + current, p); } draftShown = null; render(); }; sub.appendChild(back);
    const dm = main.querySelector('.draftmsg'); if(dm) dm.after(sub);
  }
  const okSet = d.ok.add;
  for(const a of d.add.filter(a => !v.labels.includes(a.label))){
    if(a.fx && a.fx.hide && !editOn) continue;
    if(fbe && fbe.kind === 'add' && !fbe.scene && fbe.id === a.id){ box.appendChild(addEditor()); continue; }
    const q = document.createElement('button'), okA = okSet.has(a.id); q.className = (okA ? '' : 'pending draft') + (editOn ? ' editable' : '');
    q.innerHTML = escText(a.label) + '<span class="tag">足した選択肢（下書き）　' + escText([toText(a.to), fxText(a.fx), stageText(a) ? '演出：' + stageText(a) : '', condText(a)].filter(Boolean).join('　')) + '</span>';
    if(okA){ const tg = q.querySelector('.tag'); if(tg) tg.remove(); }
    q.onclick = () => {
      if(editOn){ fbe = { kind:'add', id:a.id, label:a.label, result:a.result, to:a.to, fx:{ ...a.fx } }; fbNote = ''; render(); return; }
      if(!live){ fbNote = '足した選択肢は、自分が進めている本で試せます。'; render(); return; }
      runDraft(a, key, key + '>' + a.id, v);
    };
    if(locked.includes(a.label)) lockTag(q); else needTag(q, a);
    box.appendChild(q);
  }
  if(editOn) for(const a of shownOf(anyKey()).add){
    if(fbe && fbe.kind === 'add' && fbe.scene === anyKey() && fbe.id === a.id){ box.appendChild(addEditor()); continue; }
    const q = document.createElement('button'); q.className = 'pending draft editable';
    q.innerHTML = escText(a.label) + '<span class="tag">' + escText([fxText(a.fx), toText(a.to), condText(a)].filter(Boolean).join('　')) + '</span>';
    q.onclick = () => { fbe = { kind:'add', id:a.id, label:a.label, result:a.result, to:a.to, fx:{ ...a.fx }, scene:anyKey() }; fbNote = ''; render(); };
    box.appendChild(q);
  }
  if(fbe && fbe.kind === 'add' && !fbe.scene && !fbe.id) box.appendChild(addEditor());
  else if(TEST_BUILD){ const add = document.createElement('button'); add.className = 'pending'; add.textContent = '＋ 選択肢を足す'; add.onclick = () => { fbe = { kind:'add', label:'', result:'', to:'stay' }; fbNote = ''; render(); }; box.appendChild(add); }
  if(live){
    const sk = draftShown && draftShown.key === key && draftShown.scene;
    const hid = [...(sk ? shownOf(sk).add.map(a => [a, sk + '>' + a.id]) : []), ...d.add.map(a => [a, key + '>' + a.id]), ...shownOf(anyKey()).add.map(a => [a, anyKey() + '>' + a.id])].filter(([a]) => a.fx && a.fx.hide);
    const jb = document.createElement('div'); jb.className = 'jump';
    jb.innerHTML = '<label>番号を打ちこむ</label><input type="number" inputmode="numeric" placeholder="番号"><button>進む</button>';
    jb.querySelector('button').onclick = () => {
      const n = jb.querySelector('input').value.trim();
      if(!n) return;
      const hit = hid.find(([a]) => String(a.fx.hide) === n && !condUnmet(loadPlayer(current), loadWorld(), a).length && !locked.includes(a.label));
      if(!hit){ fbNote = 'その番号では、何も起きない。'; render(); return; }
      fbNote = ''; runDraft(hit[0], key, hit[1], v);
    };
    box.after(jb);
  }
  if(fbNote && !fbOpen){ const n = document.createElement('div'); n.className = 'fb'; n.style.cssText = 'margin:8px 0 0;padding-top:0;border-top:0'; n.innerHTML = '<div class="note">' + escText(fbNote) + '</div>'; box.after(n); }
}
function resultHtml(){
  const ps = CHAR_IDS.map(loadPlayer), ended = p => p.status !== 'active' && p.status !== 'monster';
  const started = p => ended(p) || p.status === 'monster' || p.para !== BOOKS[p.char].start;
  const me = loadPlayer(current);
  if(!ended(me)) return '';
  const open = ps.filter(p => started(p) && !ended(p));
  if(open.length) return '<div class="result">開票の結果は、' + open.map(p => CHARS[p.char].name).join('と') + 'の一日が終わると出る。</div>';
  const r = tallyResult(), n = x => x.toLocaleString('ja-JP'), pct = x => (x / r.total * 100).toFixed(2) + '%';
  const row = (k, o, sum) => '<tr><td>' + TALLY.names[k] + '</td><td class="num">' + n(o[k]) + '</td>' + (sum ? '<td class="num">' + pct(o[k]) + '</td>' : '') + '</tr>';
  const order = ['whitmore', 'carver', 'okafor'].sort((a, b) => r.t[b] - r.t[a]);
  let h = '<div class="result"><b>ウィノア州　州知事選挙　非公式集計</b><br>州務長官事務所　開票率100%（暫定投票を除く）';
  h += '<table class="tally">' + order.map(k => row(k, r.t, true)).join('') + '</table>';
  h += '1位と2位の差は、' + n(r.margin) + '票（' + (r.margin / r.total * 100).toFixed(3) + '%）。<br><br>';
  h += r.recount
    ? '差が投票総数の0.1%以下のため、州法により、自動的に再集計が行われる。各郡の開票点検委員会が集計を認証したあと、すべての票を数え直す。当選者は、まだ決まっていない。'
    : TALLY.names[r.lead].replace('（現職）', '') + 'の当選が確実になった。結果は、各郡の開票点検委員会の認証を経て、州務長官が確定する。';
  const gov = r.st.governor;
  if(gov.status === 'monster-done') h += '<br><br>ホイットモア知事は、投票日の' + (gov.clock >= 1200 ? '夜' : '午後') + 'から、公の場に出ていない。' + (r.recount || r.lead !== 'whitmore' ? '' : '州憲法は、当選者が就任の宣誓をできないときは、副知事の当選者が知事に就くと定めている。保健局の指針では、届け出のあった者は、死亡したものとは扱われない。');
  h += '<br><br><b>マーロウ郡　第14投票区（リンカーン小学校）</b><table class="tally">' + ['whitmore', 'carver', 'okafor'].sort((a, b) => r.p14[b] - r.p14[a]).map(k => row(k, r.p14)).join('') + '</table>';
  h += r.p14.whitmore === r.p14.carver ? 'この投票区では、上の2人が同数だった。' : 'この投票区では、' + TALLY.names[r.p14.whitmore > r.p14.carver ? 'whitmore' : 'carver'].replace('（現職）', '') + 'が' + Math.abs(r.p14.whitmore - r.p14.carver) + '票多かった。';
  const own = [];
  const v = r.st.voter;
  if(r.votes.voter) own.push(r.prov ? 'モーガンの票は暫定投票で、この数にはまだ入っていない。7日以内に郡の窓口へ身分のわかるものを持っていけば、数に加えられる。' + (String(v.status).startsWith('left') ? 'モーガンは、その夜のうちに州を出た。' : v.status === 'monster-done' ? 'モーガンは、窓口へは行かなかった。' : '') : 'モーガンの1票は、この数に入っている。');
  else if(started(v)) own.push('モーガンは、投票しなかった。');
  if(r.votes.governor) own.push('ホイットモア知事の1票は、第9投票区（聖マルコ教会）の数に入っている。');
  else if(started(gov)) own.push('ホイットモア知事は、投票しなかった。');
  if(started(r.st.director)) own.push('ハーラン院長は、先週のうちに期日前投票を済ませている。');
  if(started(r.st.chief)) own.push('ブレナン署長は、一日のあいだ、どの投票所でも立て札から先へは入らなかった。投票もしていない。');
  h += '<br><br>' + own.join('<br>');
  if(r.notes.length) h += '<br><br><b>この一日のうち、数に出たこと</b><br>' + r.notes.join('<br>');
  return h + '</div>';
}

render();
loadPack();
// 送るのを待っているものは、開いたときと、1分ごとに、時刻を過ぎていれば送る
if(TEST_BUILD && !room){ flushOutbox(); setInterval(() => { if(!fbe) flushOutbox(); }, 60000); }
// 部屋に入っていれば、開いたとき・画面に戻ったとき・30秒ごとに、ほかの人の進み具合を読みこむ
if(room){
  if(myDirty) myTouch('fast');
  peerStart();
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') peerStart(); });
  // 画面を離れるときに、まだ書いていない分を書く。開いているあいだは、3分ごとに「いる」印を書く
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && myDirty) myFlush(true); });
  setInterval(() => { if(document.visibilityState === 'visible' && Date.now() - myBeat > 170000){ myDirty = true; myFlush(); } }, 60000);
  roomPull(true).then(() => {
    if(TEST_BUILD && store.get('outbox', []).length) roomSendItems();
    if(!store.get('fb-name', '')){ roomPanel = true; roomNote = '最初に、名前を入れてください。誰がどの本をロックしているかが、ほかの人に分かります。'; render(); }
  });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') roomPull(); });
  document.addEventListener('focusout', () => { setTimeout(() => { if(pendingRender && !typing()){ pendingRender = false; render(); } }, 80); });
  // ふだんは30秒ごと。「意見」を開いているあいだは、8秒ごと
  let pullTick = 0;
  setInterval(() => { if(document.visibilityState === 'visible' && (++pullTick % 4 === 0 || fbOpen)) roomPull(); }, 8000);
}
