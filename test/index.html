<style>
:root{
  --bg:#0b0b0d;
  --panel:#16161a;
  --line:#2c2a2e;
  --text:#e6e1d8;
  --dim:#8a857c;
  --red:#c0392b;
  --gold:#e0b04a;
  --f-mincho:"Hiragino Mincho ProN","Yu Mincho",serif;
  --f-goth:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-goth)}
body{min-height:100dvh}
#top{position:sticky;top:0;z-index:5;background:#000}
@media (max-height:520px){#top{position:static}}
header{background:#000;border-bottom:1px solid var(--line);padding:6px 12px}
.bar{display:flex;align-items:center;gap:8px}
.barbtns{flex:none;display:flex;gap:6px;align-self:flex-start}
.barbtns button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px}
.barbtns button.on{color:var(--text);border-color:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tabs[hidden]{display:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px}
.tabs button.on{color:var(--text);border-color:var(--gold)}
.tabs .reset{margin-left:auto;color:var(--dim)}
.tabs .mapbtn.on{color:var(--text);border-color:var(--gold)}
.map{margin:0 0 16px;border:1px solid #5a4528;border-radius:3px;background:#e4d3ab;padding:5px}
.map svg{display:block;width:100%;height:auto}
.map p{margin:4px 4px 0;font-size:12px;color:#5a4a32}
.m-water{fill:#8ea6ad;stroke:#3f5660;stroke-width:.7}
.m-wave{fill:none;stroke:#5f7a84;stroke-width:.4;opacity:.7}
.m-water-t{fill:#2f4650;font-size:7px;font-style:italic;text-anchor:middle;font-family:serif;letter-spacing:1px}
.m-park{fill:#a3ad7c;stroke:#56603a;stroke-width:.6}
.m-contour{fill:none;stroke:#68723f;stroke-width:.45;stroke-dasharray:2 1.4}
.m-fountain{fill:#8ea6ad;stroke:#3f5660;stroke-width:.4}
.m-block{fill:#ecd27a;stroke:#3a2f22;stroke-width:.3}
.m-block.blank{fill:#f7f1e1;stroke:#b8ab8e;stroke-width:.3}
.m-notable{fill:#cf7f5c}
.m-green{fill:#a3ad7c}
.m-num{fill:#3a2f22;font-size:3.1px;text-anchor:middle;font-family:serif}
.m-main-edge{fill:none;stroke:#3a2f22;stroke-width:4.6;stroke-linecap:round}
.m-main{fill:none;stroke:#f5ecd5;stroke-width:3.4;stroke-linecap:round}
.m-sub-edge{fill:none;stroke:#3a2f22;stroke-width:3.2;stroke-linecap:round}
.m-sub{fill:none;stroke:#f5ecd5;stroke-width:2.2;stroke-linecap:round}
.m-hw-edge{fill:none;stroke:#3a2f22;stroke-width:6;stroke-linecap:round}
.m-hw{fill:none;stroke:#df9fab;stroke-width:4.6;stroke-linecap:round}
.m-rail-edge{fill:none;stroke:#3a2f22;stroke-width:2.6}
.m-rail{fill:none;stroke:#f5ecd5;stroke-width:1.4;stroke-dasharray:4 4}
.m-street{fill:#3a2f22;font-size:5.2px;font-weight:bold;font-family:serif;letter-spacing:.6px;dominant-baseline:middle}
.m-bridge{fill:#d6c59c;stroke:#3a2f22;stroke-width:.8}
.m-land{fill:#c96f4e;stroke:#2a2018;stroke-width:.7}
.m-star{fill:#f5ecd5}
.m-cross{fill:#f5ecd5}
.m-garden{fill:#8f9a68;stroke:#4f5934;stroke-width:.6;stroke-dasharray:1.5 1}
.m-lot{fill:#d8c9a5;stroke:#2a2018;stroke-width:.5}
.m-lotline{stroke:#6b5a3e;stroke-width:.4}
.m-canopy{fill:none;stroke:#2a2018;stroke-width:.7;stroke-dasharray:1.6 1}
.m-pier{fill:#b89a6a;stroke:#2a2018;stroke-width:.6}
.m-metro{fill:#f5ecd5;stroke:#2a2018;stroke-width:.7}
.m-metro-t{fill:#2a2018;font-size:6px;font-weight:bold;text-anchor:middle}
.m-label{fill:#22190f;font-size:8px;font-weight:bold;text-anchor:middle;paint-order:stroke;stroke:#f3e8cc;stroke-width:2.6px;font-family:serif}
.m-label-here{fill:#b0281b}
.m-here{fill:none;stroke:#b0281b;stroke-width:2.2}
.m-district{fill:#b0281b;font-size:14px;font-weight:bold;text-anchor:middle;opacity:.85;paint-order:stroke;stroke:#f3e8cc;stroke-width:2px;font-family:serif;letter-spacing:3px}
.m-small{fill:#4a3c28;font-size:6px;text-anchor:middle;font-family:serif}
.m-legend{fill:#f3e8cc;stroke:#2a2018;stroke-width:1}
.m-legend-in{fill:none;stroke:#2a2018;stroke-width:.4}
.m-title{fill:#22190f;font-size:8.5px;font-weight:bold;text-anchor:middle;font-family:serif;letter-spacing:1px}
.m-rose-ring{fill:#f3e8cc;stroke:#2a2018;stroke-width:.6;opacity:.9}
.m-rose{fill:#f3e8cc;stroke:#2a2018;stroke-width:.5}
.m-rose-n{fill:#2a2018;stroke:#2a2018;stroke-width:.5}
.m-rose-t{fill:#22190f;font-size:7px;font-weight:bold;text-anchor:middle;font-family:serif}
.map svg *{pointer-events:none}
.map .m-pick,.map .m-go,.map .m-go *{pointer-events:auto;cursor:pointer}
.m-pick:hover{stroke:#b0281b}
.m-selected{fill:none;stroke:#b0281b;stroke-width:1.4}
.m-sel-t{fill:#b0281b;font-size:7px;font-weight:bold;text-anchor:middle;paint-order:stroke;stroke:#f3e8cc;stroke-width:2.4px}
.m-known{fill:none;stroke:#b0281b;stroke-width:.9;stroke-dasharray:1.5 1}
.m-star-pin{fill:#b0281b;font-size:5.5px;text-anchor:middle;paint-order:stroke;stroke:#f3e8cc;stroke-width:1.5px}
.map-tools{display:flex;justify-content:flex-end;margin-bottom:4px}
.map-tools button{font-size:13px;background:#f3e8cc;border:1px solid #5a4528;border-radius:4px;padding:3px 12px;color:#2a2018}
.map-scroll{overflow:hidden}
.map.zoom .map-scroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:70dvh}
.map.zoom svg{width:260%;max-width:none}
.map-actions{display:flex;gap:8px;margin-top:6px}
.map-actions button{flex:1;font-size:15px;padding:10px;border-radius:6px;border:1px solid #5a4528;background:#f3e8cc;color:#2a2018}
.map-actions #blockGo{background:#b0281b;color:#fff;border-color:#7a1a10;flex:2}
.map p.known{color:#7a1a10;font-weight:bold}
.addr{display:inline-block;padding:0 6px;border:1px solid #c0392b;border-radius:3px;color:#f0a090;font-family:var(--f-goth);font-size:.9em;margin:0 2px;line-height:1.5}
.m-go{cursor:pointer}
.m-go-ring{fill:rgba(224,176,74,.32);stroke:#9a6a06;stroke-width:2.2;stroke-dasharray:3.5 2}
.m-go-q{fill:#7a5608;font-size:10px;font-weight:bold;text-anchor:middle}
.m-go-t{fill:#7a5608;font-size:7px;font-weight:bold;text-anchor:middle;paint-order:stroke;stroke:#f3e8cc;stroke-width:2.4px}
.m-fold{pointer-events:none;stroke:#fff8e6;stroke-width:1.2;opacity:.45}
.stat{flex:1;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--dim)}
.stat b{color:var(--text);font-weight:normal}
.stat .infect{color:var(--red)}
#cutscene{position:relative;max-width:640px;margin:0 auto;background:#000;aspect-ratio:16/9;overflow:hidden}
#cutscene[hidden],#cutscene.tucked{display:none}
#cutscene canvas{display:block;width:100%;height:100%;image-rendering:pixelated;filter:saturate(.7) contrast(1.15) brightness(1.08)}
#cutscene.glitch canvas{transform:translateX(3px) skewX(-2deg);filter:saturate(.2) contrast(1.6) brightness(1.4) hue-rotate(40deg)}
#cutscene::before{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:cctv-roll 6s linear infinite;z-index:2}
#cutscene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65) 100%);z-index:2}
@keyframes cctv-roll{to{top:110%}}
.cctv-top,.cctv-bot{position:absolute;left:8px;right:8px;z-index:3;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e8f0e0;text-shadow:0 0 3px #000,0 0 1px #000;letter-spacing:.05em;pointer-events:none}
.cctv-top{top:6px;display:flex;justify-content:space-between}
.cctv-top,.cctv-bot{opacity:0}
#cutscene canvas.osd{position:absolute;inset:0;z-index:3;pointer-events:none;filter:blur(.35px) contrast(1.1)}
.cctv-bot{bottom:6px;display:flex;justify-content:space-between}
.cctv-top .rec{color:#ff4a3a;animation:cctv-blink 1s steps(2) infinite}
@keyframes cctv-blink{50%{opacity:0}}
#cutscene.alarm{outline:2px solid #c0392b;outline-offset:-2px}
.cctv-nosig{display:none;position:absolute;inset:0;z-index:4;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.2em;color:#ddd;background:repeating-radial-gradient(circle at 30% 40%,#222 0 1px,#555 1px 2px,#111 2px 3px);animation:cctv-static .15s steps(3) infinite}
#cutscene.nosignal .cctv-nosig{display:flex}
@keyframes cctv-static{0%{background-position:0 0}50%{background-position:7px 3px}100%{background-position:-5px 6px}}
.tabs .me{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.tabs .me select{font-size:16px;background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:3px 4px}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:13px;color:var(--dim)}
.lockbar b{color:var(--text);font-weight:normal}
.lockbar.mine{border-color:var(--gold)}
.lockbar.other{border-color:var(--red)}
.lockbar > button{margin-left:auto;background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:6px 12px;font-size:14px}
.histnav{display:flex;align-items:center;gap:6px;width:100%}
.histnav span{flex:1;text-align:center;color:var(--text)}
.histnav button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
.histnav button:disabled{color:#444}
.undolist{border:1px solid var(--gold);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:13px;color:var(--dim)}
.undolist b{color:var(--text);font-weight:normal}
.undolist > div{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.undolist span{flex:1;line-height:1.5}
.undolist button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px;white-space:nowrap}
.undolist > button{display:block;margin:10px 0 0 auto}
.choices button.chosen,.choices button.chosen:disabled{border-color:var(--gold);color:var(--gold)}
.planmap{margin:0 0 12px;border:1px solid #3a5a6a;border-radius:4px;background:#0c1418;padding:8px}
.planmap svg{display:block;width:100%;height:auto}
.planmap p{margin:6px 2px 0;font-size:12px;color:#7a9aa8}
.pm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:#bcd4dc;font-size:14px}
.pm-tabs{display:flex;gap:4px}
.pm-tabs button{background:#14222a;color:#7a9aa8;border:1px solid #2a4a5a;border-radius:4px;padding:3px 10px;font-size:13px}
.pm-tabs button.on{color:#e8f4f8;border-color:#8ac0d8}
.pm-room{fill:#101c22;stroke:#3a5a6a;stroke-width:1.5}
.pm-room.known{fill:#2a5a72}
.pm-room.pick{stroke:#e8c050;stroke-width:2.5;stroke-dasharray:5 3;cursor:pointer}
.pm-room.risk{stroke:#d0483a;stroke-width:2.5;stroke-dasharray:5 3}
.pm-name{pointer-events:none}
.pm-room.known.nocam{fill:#24485a}
.pm-room.here{fill:#c04a3a;animation:pm-blink 1s steps(2) infinite}
@keyframes pm-blink{50%{fill:#7a2a20}}
.pm-door{fill:#0c1418}
.pm-name{fill:#e8f4f8;font-size:9px;text-anchor:middle;dominant-baseline:middle}
.pm-cam{fill:#e05a4a;font-size:7px;text-anchor:end}
.pm-exit{fill:#d8c070;font-size:8px;text-anchor:middle}
main{max-width:640px;margin:0 auto;padding:16px 30px 48px 16px}
.notice{border-left:3px solid var(--red);background:#1a0f10;padding:8px 12px;margin-bottom:12px;font-size:14px;line-height:1.7;white-space:pre-line}

.no{font-family:var(--f-mincho);color:var(--gold);font-size:28px;margin:4px 0 8px}

/* 画面の右端のつまみ：押すと、映像・地図が横から出入りする */

<script>
'use strict';

// ===== 街 =====
const PLACES = { police:'警察署', hospital:'病院', shotengai:'メインストリート', subway:'地下鉄の駅', gas:'ガソリンスタンド', port:'港', mansion:'丘の上の洋館', mall:'ショッピングモール',
  home:'自宅', oak:'オーク通り', maple:'メープル通り', school:'リンカーン小学校', bridge:'ケスラー橋', depot:'配送センター', hosp:'州立グレンフォード病院', mainst:'メインストリート', church:'聖マルコ教会', road:'州道', res:'知事公邸', hq:'ホイットモア選挙事務所', car:'車の中', radio:'WGLNラジオ', factory:'ケスラー製鋼', hotel:'ホテル・グレンフォード', ps:'グレンフォード警察署', north:'ノースエンド', county:'マーロウ郡庁舎' };
// 歩いてかかる分数
const ADJ = {
  police:{ shotengai:20, subway:20, mansion:30 },
  hospital:{ shotengai:20, gas:30, mansion:30 },
  shotengai:{ police:20, hospital:20, subway:10, gas:20, mall:20 },
  subway:{ police:20, shotengai:10, port:30 },
  gas:{ hospital:30, shotengai:20, port:20, mall:15 },
  port:{ subway:30, gas:20 },
  mansion:{ police:30, hospital:30 },
  mall:{ shotengai:20, gas:15 },
};
const BASE_DANGER = { police:1, hospital:2, shotengai:2, subway:3, gas:1, port:1, mansion:2, mall:3 };
const DAWN = Infinity;          // 5:00 夜明け
const BLACKOUT = Infinity;       // 1:00 停電
const BRIDGE_OPEN = 120;   // 2:00
const DROP = 180;          // 3:00 ヘリが物資を落とす
const BRIDGE_CLOSE = 240;  // 4:00
const TURN_AFTER = 420;    // 噛まれてから発症まで
const INITIAL_ITEMS = {
  police:[{ name:'車の鍵', hidden:true }],
  hospital:[{ name:'薬', hidden:true }],
  shotengai:[{ name:'救急箱', hidden:true }],
  subway:[],
  gas:[{ name:'燃料', hidden:true }],
  port:[],
  mansion:[{ name:'救急箱', hidden:true }],
  mall:[{ name:'薬', hidden:true }],
};

const CHARS = {
  voter:{ name:'有権者', osd:'モーガン', place:'home', items:{}, clock:360, cam:'v_oak' },
  governor:{ name:'州知事', osd:'ホイットモア知事', place:'res', items:{}, clock:420, cam:'v_res' },
  chief:{ name:'警察署長', osd:'ブレナン署長', place:'ps', items:{ 拳銃:1, 弾:15 }, clock:390, cam:'v_ps' },
  director:{ name:'病院長', osd:'ハーラン院長', place:'hosp', items:{}, clock:390, cam:'v_hosp' },
};
const CHAR_IDS = Object.keys(CHARS);
const APP_VERSION = '__APP_VERSION__';
// テスト用の版（リリースで版の番号が入っていないもの）だけ、意見を書く欄を出す
const TEST_BUILD = APP_VERSION.startsWith('__'), BUILD = 'テスト版 2026-11-12 03:41 b849d3c';
const EMBED = /*EMBED*/null/*EMBED*/;
const FEEDBACK_REPO = 'kyunkyunpeachdisco-maker/joining-the-living-dead-feedback', FEEDBACK_KINDS = ['文章', '選択肢', '不具合', '追加の案', 'その他'];
const BOOKS = {};

// ===== 保存 =====
const BASE = 'jtld-election-';
// 部屋番号。招待リンクの # の後ろに付いてきたら、覚える
let room = (() => {
  try {
    const m = location.hash.match(/room=([A-Z2-9]{8})/);
    const r = location.hash.match(/[#&]r=([\w.-]+\/[\w.-]+)/), k = location.hash.match(/[#&]k=([A-Za-z0-9_]+)/), pk = location.hash.match(/[#&]pack=([\w.-]+\/[\w.-]+)/);
    const pt = location.hash.match(/[#&]pk=([A-Za-z0-9_]+)/);
    if(pk){ localStorage.setItem(BASE + 'pack', JSON.stringify(pk[1])); if(pt) localStorage.setItem(BASE + 'pack-key', JSON.stringify(pt[1])); else localStorage.removeItem(BASE + 'pack-key'); if(!m) history.replaceState(null, '', location.pathname + location.search); }
    if(r) localStorage.setItem(BASE + 'gh-repo', JSON.stringify(r[1]));
    if(k) localStorage.setItem(BASE + 'gh-pat', JSON.stringify(k[1]));
    if(m){ localStorage.setItem(BASE + 'room', JSON.stringify(m[1])); if(!/invite=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); }
    return JSON.parse(localStorage.getItem(BASE + 'room') || 'null');
  } catch(e){ return null; }
})();
if(room && !/^[A-Z2-9]{8}$/.test(room)) room = null;
const GLOBAL_KEYS = new Set(['pack', 'pack-cache', 'pack-key', 'pack-latest', 'pub-repo', 'room', 'room-kind', 'dev', 'dev-key', 'gh-repo', 'gh-pat', 'overlay', 'fb-token', 'fb-name', 'video', 'send-at']);
const keyOf = key => BASE + (room && !GLOBAL_KEYS.has(key) ? 'room-' + room + '-' : '') + key;
let roomApplying = false, roomTimer = 0;
let saveWarned = false;
// localStorage が使えない環境でも遊べるよう、メモリにも同じ内容を持っておく（その場合はページを閉じると消える）
const memory = {};
const store = {
  get(key, fallback){
    const k = keyOf(key);
    if(k in memory) return JSON.parse(memory[k]);
    try { const v = localStorage.getItem(k); if(v){ memory[k] = v; return JSON.parse(v); } }
    catch(e){}
    return fallback;
  },
  set(key, value){
    const k = keyOf(key);
    memory[k] = JSON.stringify(value);
    if(room && (key === 'world' || key.startsWith('player-'))) roomDirty();
    try { localStorage.setItem(k, memory[k]); }
    catch(e){ if(!saveWarned){ saveWarned = true; const note = 'この端末では進み具合を保存できません。ページを閉じると進み具合は消えます。'; console.warn(note); setTimeout(() => alert(note)); } }
  },
  remove(key){ const k = keyOf(key); delete memory[k]; try { localStorage.removeItem(k); } catch(e){} },
};

function newWorld(){
  return { events:[], items:JSON.parse(JSON.stringify(INITIAL_ITEMS)), once:{}, boatUsed:null, nextId:1 };
}
function newPlayer(id){
  const c = CHARS[id];
  return { char:id, book:id, para:BOOKS[id].start, place:c.place, clock:c.clock || 0, hp:3, lastCam:c.cam || null,
    items:{ ...c.items }, infected:false, turnAt:null, status:'active',
    flags:{}, seen:[], after:null, msg:'' };
}
function loadWorld(){ const w = store.get('world', null) || newWorld(); w.once = w.once || {}; return w; }
function loadPlayer(id){ return store.get('player-' + id, null) || newPlayer(id); }

// ===== 本から使う小道具 =====
function c(label, cost, to, extra = {}){ return { label, cost, to, ...extra }; }
function fmt(m){ const h = Math.floor(m / 60) % 24, mm = m % 60; return `${h}:${String(mm).padStart(2, '0')}`; }
function has(s, item, n = 1){ return (s.items[item] || 0) >= n; }
function addItem(s, item, n = 1){ s.items[item] = (s.items[item] || 0) + n; if(s.items[item] <= 0) delete s.items[item]; }
function addEvent(w, s, type, place, extra = {}){
  w.events.push({ id:s.char + ':' + w.nextId++, by:s.char, t:s.clock, type, place, ...extra });
}
function shoot(s, w){
  addItem(s, '弾', -1); addEvent(w, s, 'shot', s.place);
  // 銃声を聞きつけて、その場の化け物が増えることがある（着いたときに決まる数の上限まで）
  const z = zsHere(s);
  if(z && z.n < ZOMBIE_MAX && Math.random() < 0.3){
    z.n += 1;
    s.msg = (s.msg ? s.msg + '\n' : '') + '銃声を聞きつけて、もう一体が現れた。';
  }
}
function near(a, b){ return a === b || (ADJ[a] && b in ADJ[a]); }
function others(id){ return CHAR_IDS.filter(x => x !== id).map(loadPlayer); }
// 街の出来事：誰かが印を付けた時刻を、自分の時計が過ぎていれば見える
function setFlag(w, s, name){ addEvent(w, s, 'flag', s.place, { name }); }
function flag(s, w, name){ return w.events.some(e => e.type === 'flag' && e.name === name && e.t <= s.clock); }
// 一度きりの物：先に読んだ人が持っていく
function takeOnce(w, key, who){ if(w.once[key]) return false; w.once[key] = who; return true; }
function taken(w, key){ return !!w.once[key]; }

// 傷を負っても、感染したかどうかは本人にもわからない（確かめるには検査室で血液を調べる）
const INFECT_CHANCE = 0.5;
function bite(s){
  s.hp -= 1;
  s.wounds = (s.wounds || 0) + 1;
  (s.bites = s.bites || []).push(s.para);
  if(!s.infected && Math.random() < INFECT_CHANCE){ s.infected = true; s.turnAt = s.clock + TURN_AFTER; }
  return '襲われて、腕に傷を負った。\n噛まれたのか、引っかかれただけなのか……暗くて、よくわからない。';
}
function symptom(s){
  if(!s.wounds) return '';
  if(s.infected && s.turnAt - s.clock <= 45) return '熱が上がってきた。指先がしびれて、うまく動かない。';
  return '腕の傷のまわりが、じんじんと熱い。';
}
function biteRoll(s, chance){
  if(has(s, '防弾ベスト')) chance /= 2;
  return Math.random() < chance ? bite(s) : '';
}

// 橋とボート：感染していたら負けの結末へ。着く時刻が夜明けを過ぎていたら脱出にならない（s.clock は着いた時刻）
function carEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '車の鍵', -1);
  addEvent(w, s, 'escape', 'police', { by_car:true });
  return s.infected ? BOOKS[s.char].endings.carInfected : BOOKS[s.char].endings.car;
}
function boatEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '燃料', -1); w.boatUsed = s.char;
  addEvent(w, s, 'escape', 'port');
  return s.infected ? BOOKS[s.char].endings.boatInfected : BOOKS[s.char].endings.boat;
}
// 302号室の少女（23:10に噛まれた）：薬を打たれていなければ1:40、打たれていれば3:40に発症する
function girlTurned(s, w){
  if(flag(s, w, 'girl_cured')) return false;
  return s.clock >= (flag(s, w, 'girl_treated') ? 220 : 100);
}
// モールの防犯カメラ：ほかの人がいつモールの入口を通ったか
const LOOKS = { police:'制服の警官', doctor:'白衣の医者' };
function cameraLog(s, w){
  const ev = w.events.filter(e => e.type === 'pass' && e.place === 'mall' && e.by !== s.char && !e.npc && e.t <= s.clock).slice(-4);
  return ev.length ? ev.map(e => `${fmt(e.t)}　${LOOKS[e.by]}が映っている`).join('\n') : '映っているのは、ふらふらと歩く化け物だけだ。';
}
function boatEscape2(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '燃料', -1); w.boat2Used = s.char;
  addEvent(w, s, 'escape', 'port');
  return s.infected ? BOOKS[s.char].endings.boatInfected : BOOKS[s.char].endings.boat;
}
function bridgeOpen(s){ return (s.clock >= BRIDGE_OPEN && s.clock < BRIDGE_CLOSE) || (has(s, '通行証') && s.clock < DAWN); }

function danger(s, w){
  const p = s.place, t = s.clock;
  let d = BASE_DANGER[p] || 0;
  for(const e of w.events){
    if(e.t > t || e.t < t - 60) continue;
    if(e.type === 'shot' || e.type === 'noise') d += e.place === p ? 2 : (near(e.place, p) ? 1 : 0);
    if(e.type === 'horde' && e.place === p) d += 3;
  }
  if(p === 'police' && flag(s, w, 'police_barricade')) d -= 1;
  if(p === 'subway'){
    if(t >= BLACKOUT) d += 1;
    if(flag(s, w, 'subway_lights')) d -= 2;
    if(has(s, '懐中電灯')) d -= 1;
  }
  if(p === 'gas' && flag(s, w, 'gas_dark')) d -= 1;
  const humans = others(s.char).filter(o => o.status === 'active');
  if(humans.length){
    const ahead = t - Math.min(...humans.map(o => o.clock));
    if(ahead >= 120) d += 2; else if(ahead >= 60) d += 1;
  }
  return Math.max(0, d);
}

function radio(t){
  if(t < BLACKOUT) return '（ラジオ）「市民の皆さんは屋内にとどまってください。噛まれた方は、ただちに……」';
  if(t < BRIDGE_OPEN) return '（ラジオ）「避難の車列は、午前2時から4時まで橋を通します。徒歩での通行はできません」';
  if(t < DROP) return '（ラジオ）「橋の車列が動き始めました。検問では、全員の腕と首を確認します」';
  if(t < BRIDGE_CLOSE) return '（ラジオ）「救援物資を、メインストリートの屋上駐車場に投下しました」';
  return '（ラジオ）「橋は封鎖されました。夜明けとともに、ハロウベイ市内は処置されます。繰り返します……」';
}
const TIME_NOTICES = [];

const HUB_TEXT = {
  police:'ハロウベイ警察署のロビー。割れたガラス戸の向こうで、赤色灯が空回りしている。',
  hospital:'セント・アグネス病院の一階。非常灯だけが緑に光り、ストレッチャーが廊下をふさいでいる。',
  shotengai:'店のシャッターが下りたメインストリート。路地の奥で、何かを引きずる音がする。',
  subway:'地下鉄・ハロウベイ駅。止まったエスカレーターの下は真っ暗だ。線路づたいに港まで歩けるはずだ。',
  gas:'ハイウェイ沿いのガソリンスタンド。',
  port:'ハロウベイ港。黒い海から霧が上がってくる。',
  mansion:'丘の上の古い屋敷、旧ホロウェイ邸。百年以上前に海運王が建てた館を、セント・アグネス病院のホロウェイ博士が買い取って住んでいた。\n玄関ホールの吹き抜けで、割れたシャンデリアが揺れている。',
  mall:'ハイウェイ沿いのショッピングモール「ハロウベイ・モール」。自動ドアは割られ、吹き抜けの床にショッピングカートが転がっている。',
};

BOOKS.monster = {
  start:600,
  hubs:{},
  paras:{
    // 変わったあとの本（3人共通）。行き先は、その日に行くはずだった場所
    600:{ text:'指先の感覚がない。寒さも、もう感じない。\n\nどこへ行く途中だったのかが、出てこない。名前も出てこない。足だけが、歩道の継ぎ目の間隔を覚えている。',
      choices:[c('足の向くほうへ歩く', 0, 601), c('明かりのついた窓のほうを向く', 0, 602)] },
    601:{ text:s => '歩いた。\n\n前から来た女の人が、歩道の端へ寄った。目は合わせない。買い物袋を、体の反対側へ持ち替えただけだ。自転車の子どもが、ベルを鳴らさずによけていった。\n\n角を曲がるたびに、足が先に決めている。'
        + ({ voter:'\n\n体育館の屋根が見えてきた。入口から歩道まで、人が並んでいる。', governor:'\n\n青い風船が見えてきた。車寄せに、人が列を作っている。', chief:'\n\n赤い灯が回っているのが見えてきた。金網のフェンスと、見覚えのある車が何台か。', director:'\n\n番号の表示が光っている。長椅子に、人がおおぜい座っている。' })[s.char],
      choices:s => [c(({ voter:'列のいちばん後ろに立つ', governor:'列の前を歩いて、扉のほうへ行く', chief:'車のあいだを通って、玄関のほうへ行く', director:'長椅子のあいだを歩く' })[s.char], 0, ({ voter:s.clock >= 1200 ? 605 : 603, governor:606, chief:608, director:610 })[s.char])] },
    602:{ end:'monster-done', text:'庭の芝生を踏んで、窓の下まで行った。\n\nガラスの向こうで、テレビがついている。地図の上に、数字が3つ並んでいた。長椅子に、大人が2人と子どもが1人。子どもがこっちを指さした。\n\n母親が立ってきて、カーテンを引いた。カーテンの合わせ目から、テレビの光が細く漏れている。\n\nそのまま、そこに立っている。\n\n（ここまで）', choices:[] },
    603:{ text:'列のいちばん後ろに立った。\n\n前の男が、半歩だけ前へ詰めた。振り向かない。その前の人も、半歩詰めた。\n\n列が進む。足が、それに合わせて出る。黄色い立て札の脇を通った。「これより先、選挙運動を禁ず」。字は読めるが、何のことかはわからない。',
      choices:[c('列が進むのに合わせて、進む', 0, 604), c('前の男の襟のあたりへ、顔を寄せる', 0, 604, { run(s){ s.msg = '前の男は、振り向かずに列を出ていった。空いたところを、後ろから誰も詰めてこない。'; return 604; } })] },
    604:{ end:'monster-done', text:'扉のすぐ内側に、机があった。\n\n係員が顔を上げて、こっちの腕は見ずに、目を見た。それから、無線に短く何か言った。\n「すみません。こちらへ」\n\n黄色いベストの2人が、両側に立った。首に、柄のついた輪が掛かる。痛くはない。引かれるほうへ歩いた。\n\n教室だった。机を並べた囲いの中に、先に何人かいる。黒板に紙が貼ってあった。「保健局　待機室」。\n\n囲いに沿って歩く。廊下の向こうから、機械が紙を吸い込む音がときどき聞こえる。8時を過ぎると、その音もしなくなった。\n\n（ここまで）', choices:[] },
    605:{ end:'monster-done', text:'入口の扉は閉まっていた。列はもうない。歩道に、紙の小旗が1本落ちている。\n\nガラスに額をつけた。体育館の中で、係員が机をたたんでいる。ひとりがこっちに気づいて、隣の肩をたたいた。2人とも、すぐに机のほうへ向き直った。\n\n明かりが半分消えた。ガラスは冷たいはずだが、冷たくない。\n\n（ここまで）', choices:[] },
    606:{ text:'列の前を歩いた。\n\n手が何本も伸びてきて、途中で止まり、引っこんだ。誰かが、青い風船のひもを手首に結んでくれた。結び終わると、その人は列の後ろへ下がった。\n\nドアマンが、逆さに持っていたほうきの柄を下ろした。\n「知事」\n少し間があった。それから、ほうきを持ち直して、扉を開けた。',
      choices:[c('中へ入る', 0, 607)] },

    // ===== 朝：近所で起きること（通りそのものは SPOTS） =====
    46:{ zombies:1, enter(s){ s.flags.greeted = 1; s.aware = 'oak2'; },
      text:'「ヘンダーソンさん、おはようございます」\n\n返事はない。ヘンダーソンさんはゆっくりこっちを向いて、一歩、出てきた。はだしの足が霜を踏む。首にはまだ、前の選挙のときの係員証がぶら下がっていた。',
      choices:[c('歩道をさがる', 0, 12)] },
    19:{ zombies:3, enter(s){ s.flags.flyer = 1; },
      text:'チラシは国民進歩党のものだった。\n\n「4年前、この地区を回る警察官は6人いました。今は4人です。ダイアン・カーヴァーは、減らされた人数を元に戻します」\n\n裏には第14投票区の地図と、朝7時から夜8時まで、という時間が刷ってある。\n「お気をつけて。あの人、今朝からずっと歩いてるんですよ」\n運動員は、車道を遠ざかっていく部屋着の背中へ目をやって、隣の家へ歩いていった。',
      choices:[c('通りへ戻る', 0, 18)] },

    // ===== リンカーン小学校の前（朝も夕方も、列から先は同じ） =====
    49:{ zombies:1, enter(s){ s.flags.cards = 1; },
      text:'断る理由もないので、3枚とももらった。どれも本物の投票用紙そっくりに刷ってあって、その陣営の候補のところだけ、楕円が黒く塗ってある。\n\n青い上着の運動員は「知事の欄からいちばん下まで、同じ党の列を塗ってください」と言った。赤い上着のほうは「橋の通行料に反対しているのは、カーヴァーだけですよ」。\n上着を着ていない女の人は、オカフォーの医院にいた看護師だという。「先生は、病院を残すと言っているだけなんです。そこだけ見てやってください」\n\n見本は記載台に持って入ってかまわないそうだ。立て札の裏に、そう書いてある。',
      choices:[c('立て札のところへ戻る', 0, 50)] },
    51:{ time:s => Math.max(s.clock, 425) + 5, zombies:3,
      text:s => (late(s) || evening(s) ? '' : '7時きっかりに、正面玄関が開いた。中から出てきた選挙管理人が、「投票所を開きます」と大きな声で言った。列が動きだす。\n\n')
        + `数えてみると、前から${late(s) ? '17' : '9'}番目だった。すぐ前の2人は、橋の通行料の話をしている。片道2ドルなら月に80ドルだぞ、とひとりが言うと、もうひとりは、それで橋が落ちないなら安いもんだ、と返した。\n\n駐車場の車のあいだから、作業着の男が出てきた。片足を引きずって、まっすぐ列のほうへ歩いてくる。作業着は、胸から下が乾いて黒くなっていた。あとの2人は、車のあいだに立ったきりだ。\n列の何人かが振り返って、また前を向いた。`,
      choices:[
        c('列を離れないで待つ', 0, 60),
        c('列を出て、男を駐車場の奥へおびき出す', 0, 61),
        c('入口の係員に知らせに行く', 0, 62),
      ] },
    60:{ zombies:1,
      text:'列は進まない。男は最後尾のあたりで立ち止まって、並んでいる人の背中を、端から順に眺めている。\n後ろの女の人が小さい声で言った。「あの人、並んでるんですかね」\n誰も返事をしなかった。\n\nそこへ入口から、黄色いベストの係員が2人出てきた。ひとりが長い柄のついた輪を男の首に掛け、もうひとりが腕を取って、校舎の中へ連れていく。\n列が2人ぶん進んだ。',
      choices:[c('入口へ進む', 0, 52)] },
    61:{ zombies:3, enter(s){ s.flags.late = 1; s.flags.lured = 1; s.flags.luredHit = attacked(s, .3) ? 1 : 0; },
      text:s => '列を出て、男の目の前を横切った。男の顔がこっちを向く。そのまま後ろ向きに、車の並びの奥へ下がっていくと、男はついてきた。車のあいだにいた2人も、少し遅れてついてくる。\n\nごみ置き場の柵のところまで引っぱってきたとき、黄色いベストの係員が走ってきた。ひとりが、長い柄のついた輪を男の首に掛ける。\n「あとはこっちでやります。列に戻ってください」'
        + (s.flags.luredHit ? '\n\nただ、係員が来る前に、男の手は一度こっちの腕に届いていた。\n' + wound(s) : '')
        + '\n\n列に戻ると、さっきの場所にはもう別の人が立っていた。いちばん後ろに並び直す。',
      choices:[c('最後尾から、入口へ進む', 0, 52)] },
    62:{ zombies:1, enter(s){ s.flags.late = 1; },
      text:'入口の机まで行って、係員に話した。\n「ありがとうございます。保健局の者が、もう向かってますので」\n係員は名簿から目を上げないまま続けた。\n「列に戻ってお待ちください。すみませんが、場所は取っておけない決まりなんです」\n\n振り返ると、黄色いベストの2人が男を校舎のほうへ連れていくところだった。いちばん後ろに並び直す。',
      choices:[c('最後尾から、入口へ進む', 0, 52)] },
    52:{ time:s => (s.flags.lineDone ? s.clock + 6 : late(s) ? 455 : 440), place:'school', enter(s){ s.flags.lineDone = 1; },
      text:s => '正面玄関を入ったところに、机がひとつ出ている。係員が「袖をまくって、両腕を見せてください」と言っていた。前の人は黙って腕を出した。その次の人は「先週も見せたんだがな」とぼやいている。\n\n順番が来た。' + (s.wounds ? '\n腕の傷は、上着の袖の下だ。' : ''),
      choices:[
        c('両腕を見せる', 0, 0, { run(s){ if(!s.wounds) s.msg = '係員は両腕と首すじを見て、うなずいた。「はい、どうぞ」'; return s.wounds && !s.flags.yellow ? 58 : 63; } }),
        c('傷のないほうの袖だけまくって、通ってしまう', 0, 59, { cond:s => !!s.wounds && !s.flags.yellow }),
      ] },
    58:{ enter(s){ s.flags.yellow = 1; },
      text:'係員は傷を見ると、用紙に時刻を書き入れた。\n「噛まれたんですか」\n「わからないんです」\n「でしたら、出口側の記載台を使ってください。ほかの方と少し離れていただくだけで、投票はふつうにできますから」\n\n黄色い札を渡された。首から下げられるように、ひもがついている。',
      choices:[c('中へ入る', 0, 63)] },
    59:{ enter(s, w){ s.flags.hidWound = 1; setFlag(w, s, 'voter_hid_wound'); },
      text:'片方の袖だけまくって、腕を出した。係員がもう片方へ目を移しかけたとき、後ろの列で子どもが泣きだした。係員はそっちを見て、手だけで「どうぞ」とやった。\n\n袖の中で、腕が熱い。',
      choices:[c('中へ入る', 0, 63)] },

    // ===== 体育館（投票所） =====
    53:{ time:s => s.clock + 5,
      text:s => 'M–Zの机で、名前と住所を言った。係員が名簿をめくる。\n「モーガンさんですね。この投票区は初めてでしょう。何か、身分のわかるものをお持ちですか」',
      choices:[
        c('運転免許証を出す', 0, 55, { cond:s => has(s, '運転免許証') }),
        c('「持ってきてないんです」と言う', 0, 54, { cond:s => !has(s, '運転免許証') }),
      ] },
    54:{ text:s => '「そうしますと、暫定投票になりますね」\n係員は机の下から、緑色の封筒を出してきた。\n「この宣誓書に書いていただいて、用紙は封筒に入れてもらいます。機械には通しません。あとで郡の選挙管理委員会が調べて、問題がなければ数に入ります。7日以内です」'
        + (evening(s) ? '' : '\n\n隣の机にいた選挙管理人が、こっちを向いた。\n「取りに帰られるなら、ふつうに投票できますよ。8時まで開けてますから」'),
      choices:[
        c('暫定投票にする', 0, 56),
        c('取りに帰ることにして、机を離れる', 0, 65, { cond:s => !evening(s), run(s){ s.flags.fetch = 1; s.msg = '「8時まで開けてますから」と、選挙管理人は言った。'; return 65; } }),
      ] },
    56:{ enter(s){ s.flags.provisional = 1; },
      text:'宣誓書に名前と住所と生年月日を書いた。「私はこの投票区の登録有権者であり、この選挙でほかに投票していません」という一文の下に、署名する。選挙管理人ともうひとりの係員が、その場で確認の署名を入れた。\n\n白い内封筒と緑の外封筒、それに投票用紙を渡される。\n「書き終わったら、用紙を白いほうに入れて封をして、それを緑のほうに入れてください」',
      choices:[c('記載台へ行く', 0, 69)] },
    55:{ text:'係員は免許証の住所を名簿と見くらべてから、署名の欄を指でたたいた。そこに署名する。\n\n係員は番号の入った半券を切り取り、投票用紙を二つ折りの紙ばさみにはさんでよこした。\n「記載台へどうぞ。楕円を黒く塗ってくださいね。書き損じたら、機械に入れる前に言ってください。3枚までなら取り替えられます」',
      choices:[c('記載台へ行く', 0, 69)] },
    69:{ time:s => s.clock + 2, zombies:1,
      text:s => (s.flags.yellow ? '黄色い札を見た係員が、出口側のいちばん端の記載台を手で示した。隣の台はひとつ空けてある。\n\n' : '')
        + '記載台へ向かう途中で、ペンが床に落ちる音がした。\n\n3つ目の台で、灰色の上着の男が、台に額をつけたまま立っている。鎖の先でペンが揺れていた。男はのろのろと体を起こすと、目隠しの板を両手でつかんだ。\n\n係員が2人来た。ひとりが後ろから男を抱えて出口へ連れていき、もうひとりは台に残った用紙を、中を見ないようにして裏返す。選挙管理人が呼ばれてきた。\n「ご本人が機械に入れていないので、これは票にはなりません」\n選挙管理人は用紙を封筒にしまい、封の上に署名して、時刻を書き添えた。',
      choices:[c('空いている記載台に入る', 0, 70)] },
    70:{ time:s => s.clock + 3,
      text:'折りたたみ式の台で、三方に目隠しの板が立ててある。黒いペンは鎖でつないであった。\n\n投票用紙のいちばん上は「州知事および副知事（1組に投票）」。\n\n　ロバート・ホイットモア／アラン・ヘイル　　自由連合党\n　ダイアン・カーヴァー／ポール・ニールセン　　国民進歩党\n　サミュエル・オカフォー／ルース・リンド　　無所属\n\nその下に州議会の下院議員、郡政委員、それから判事を留任させるかどうか、と続いている。',
      choices:[
        mark('ホイットモアの楕円を塗る', 'whitmore'),
        mark('カーヴァーの楕円を塗る', 'carver'),
        mark('オカフォーの楕円を塗る', 'okafor'),
        mark('知事の欄は空けておいて、下の欄だけ書く', 'blank'),
      ] },
    71:{ time:s => s.clock + 4,
      text:s => `読み取り機は出口の脇に置いてある。紙ばさみから用紙を抜いて、差し込み口に当てると、機械のほうで勝手に吸い込んでいった。小さな画面の数字が、${evening(s) ? '0611から0612' : late(s) ? '0061から0062' : '0038から0039'}に変わる。\n\n係員が丸いシールを1枚くれた。「投票しました」と書いてある。`,
      choices:[c('読み取り機の前を離れる', 0, 65)] },
    72:{ time:s => s.clock + 4,
      text:'用紙を白い封筒に入れて封をし、それを緑の封筒に入れた。選挙管理人は封筒を受け取ると、番号を控えてから、鍵のかかる袋にしまった。\n\n「こちらが控えです。数に入ったかどうかは、この番号で郡の窓口に聞けばわかります」\n\n係員が丸いシールを1枚くれた。「投票しました」と書いてある。',
      choices:[c('読み取り機の前を離れる', 0, 65)] },

    // ===== 朝：バスと橋 =====
    28:{ place:'oak', time:s => nextBus(s),
      text:s => `4丁目の停留所で、${fmt(nextBus(s))}のバスを待った。並んでいる人は誰もしゃべらない。屋根の下の時刻表に、保健局の紙が貼ってあった。「車内で具合の悪くなった方は、運転手にお知らせください」\n\nバスは時間どおりに来た。運転手は、乗ってくる客の手首をひとりずつ見ている。`
        + (s.wounds ? '\n上着の袖を、手首まで引っぱっておいた。' : ''),
      choices:[c('バスに乗る', 0, 76)] },
    76:{ time:s => s.clock + 12, place:'bridge', inside:true, zombies:1,
      text:'バスがケスラー橋にさしかかる。たもとに測量の杭が打ってあって、「料金所建設予定地」という看板が立っていた。\n\n橋のまんなかあたりで、前の車が止まった。歩道を、背広の男が欄干につかまりながら歩いている。靴を片方しかはいていない。運転手はクラクションも鳴らさずに、男が行ってしまうのを待ってから、また車を出した。\n\n隣の席の女の人が、窓の外を見たまま言った。\n「うちは今夜のうちに、妹のところへ行くんですよ。州境の向こう。投票は郵便で済ませてありますから」',
      choices:[c('川向こうの停留所で降りる', 0, 77)] },

    // ===== 午前：配送センターと、州立病院への配達 =====
    77:{ time:s => Math.max(s.clock + 10, 510), place:'depot',
      text:s => `配送センターの事務所は、朝からストーブの灯油のにおいがする。${s.clock > 515 ? 'タイムカードを押すと' + fmt(s.clock) + 'だった。投票で遅れるとは言ってあったので、主任のダルトンは何も言わない。' : '8時半きっかりに、タイムカードを押した。'}\n\nダルトンが伝票を3枚よこした。\n「州立グレンフォード病院に、医療品が12箱。メインストリートのカーヴァーの事務所に、印刷物が5箱。聖マルコ教会に、郡の選挙管理委員会から投票所で使うものが1箱。3つとも川の向こうだ。回る順は任せる。署名を3枚もらって、4時半までには戻ってこい」\n\n積み込みを手伝いにきたリコが、箱を荷室へ押し込みながら声を落とした。\n「おれ、今日で上がるんだ。5時に家族を乗せて、州道を東へ出る。席がひとつ空いてるんだが、乗るか。5時までに決めてくれりゃいい」`,
      choices:[c('3号車のところへ行く', 0, 79)] },
    84:{ time:s => signAt(s, 20), enter(s){ s.flags.dHosp = 1; },
      text:s => (s.flags.front
        ? '玄関から台車で運び込んだ。受付では、どこへ持っていくのかを3回聞かれた。'
          + (s.clock < 690 ? '\n\n2往復目に、演台の作業員に呼び止められた。\n「その車、11時までにどけてもらえます？　知事の車が入るんで」' : '')
          + (s.clock < 760 ? '\n\n3往復目は、青い上着の若い運動員が台車を押すのを手伝ってくれた。「投票はもう行かれました？」と聞かれた。' : '')
          + '\n\n'
        : '台車を3往復させて、12箱を壁ぎわに積んだ。\n\n')
        + '用度係の机で、受け取りの署名をもらう。係の女の人は、箱を数えながらこんなことを言った。\n「統合になったら、この搬入口も閉めるんですって。荷物はみんな北の病院へ行くことになるわね。車で40分よ」'
        + (s.wounds && !s.flags.treated ? '\n\n係の女の人が、こっちの袖に目をとめた。\n「その腕。救急で見てもらえるわよ、廊下のいちばん手前。ただ、噛まれた傷だと、保健局に届けが行くけど」' : ''),
      choices:[c('机を離れる', 0, 39)] },
    85:{ time:s => s.clock + 30, enter(s, w){ s.flags.treated = 1; s.flags.reported = 1; s.hp = Math.min(3, s.hp + 1); if(s.infected) s.turnAt += 240; setFlag(w, s, 'voter_reported'); },
      text:'救急の待合で20分待たされた。看護師が傷を洗って、注射を1本打ち、包帯を巻いてくれる。\n「噛まれたのかどうかは、うちではわからないんです。熱が出たら、また来てくださいね」\n\n届け出の用紙に、名前と住所、それに、いつどこで傷を負ったかを書いた。写しを1枚もらう。\n「投票所でこれを見せれば、黄色い札をくれますから。投票はちゃんとできますよ」',
      choices:[c('待合へ戻る', 0, 40)] },
    87:{ time:s => Math.max(s.clock, 690) + 25, zombies:3, enter(s){ s.flags.heard = 1; },
      text:(s, w) => 'ホイットモア知事は、上着を脱いでから演台に上がった。\n「州の所得税を、3.2%から2.9%へ。これはお約束です。それから州立病院。建物が3つあれば、事務も3つ、暖房代も3つかかる。それをいつまで払い続けますか。1つにまとめて、浮いたお金を皆さんの近所の診療所へ回す。私が申し上げているのは、そういうことです」\n\n横断幕のほうから声が飛んだ。「ここがなくなったら、救急車は40分かかるんだぞ」\n' + (flag(s, w, 'gov_delay') ? '知事は少し黙って、原稿から顔を上げた。「統合の時期は、1年延ばして見直します」' : '「北の病院の救急を、倍にします」と知事は答えた。') + '\n\n人垣の後ろで、プラカードを持った3人が、演台のほうへ歩きだした。足どりがばらばらだ。護衛の警官が2人、人をかき分けてそっちへ向かう。知事はそれをちらっと見て、原稿に目を戻した。\n「保健局の指針を守って、どうか安全に投票してください。投票所は夜8時までです。さて、ケスラー橋の話をしましょう」',
      choices:[c('人垣を離れる', 0, 78)] },

    // ===== 昼：メインストリートの選挙事務所 =====
    91:{ time:s => signAt(s, 20), inside:'door', enter(s){ s.flags.dMain = 1; },
      text:'事務所の中では、20人ほどが長机に並んで電話をかけていた。壁の地図には、投票区ごとに色の違う画びょうが刺してある。\n\n受け取りの署名をしてくれた運動員が、箱を開けながら言う。\n「送り迎えの車が足りなくて。5時を過ぎると、歩いて投票所へ行ける人がぐっと減るんですよ。もし夕方、お手すきでしたら」\n\n奥の扉が開いて、灰色の上着の女の人が出てきた。ダイアン・カーヴァー本人だった。電話をかけている人たちの後ろを歩きながら、ひとりずつ肩に手を置いていく。こっちに気づいて、足を止めた。\n「配達、ご苦労さま。投票はもう？」',
      choices:[
        c('「済ませました」と答える', 0, 92, { cond:voted }),
        c('「仕事のあとで行きます」と答える', 0, 92, { cond:s => !voted(s) }),
        c('「まだ決めてないんです」と答える', 0, 92, { cond:s => !voted(s) }),
      ] },
    92:{
      text:s => '「8時に列に並んでいれば、投票できますからね。それだけ覚えておいて」\nカーヴァーはそう言うと、もう次の机のほうへ行っていた。\n\n表へ出ると' + fmt(s.clock) + '。隣の食堂は開いていて、窓ぎわに客が座っている。テレビもついていた。',
      choices:[
        c('食堂で何か食べていく', 0, 93),
        c('車へ戻る', 0, 88),
      ] },
    93:{ time:s => s.clock + 35, inside:'door', enter(s){ s.hp = Math.min(3, s.hp + 1); s.flags.diner = 1; },

<script>
'use strict';
// 州知事（ロバート・ホイットモア）の本：200〜299。再選を目指す現職の、投票日の予定表

(() => {
const WOUND = '袖口が裂けて、左の手首の上に赤い筋が残った。爪の跡か歯の跡か、見ただけでは決められない。';
const attacked = (s, chance) => { if(Math.random() >= chance) return false; bite(s); return true; };
const risk = (label, chance, to, ok, hit, extra = {}) => c(label, 0, 0, { ...extra, run(s, w){ if(extra.before) extra.before(s, w); s.msg = attacked(s, chance) ? hit + '\n' + WOUND : ok; return to; } });
const done = (s, k) => { if(s.flags['did_' + k]) return; s.flags.done = (s.flags.done || 0) + 1; s.flags['did_' + k] = 1; };
const did = (s, k) => !!s.flags['did_' + k];
const back = s => s.flags.back;
// 車で着くたびに8分進む。決まった時刻を過ぎていたら、着く前に車の中の場面が入る
const ride = (s, no) => {
  const hop = !s.flags.called && s.clock >= 705 ? 213 : !s.flags.told3 && s.clock >= 860 ? 219 : !s.flags.env && s.clock >= 1040 ? 222 : 0;
  if(hop) s.flags.back = no;
  return hop;
};
const arr = (no, first) => (s, w) => { s.clock += 6; return (first && first(s, w)) || ride(s, no) || undefined; };
// 予定の時刻
const SPEECH = 690, RADIO = 840, SIREN = 1020, COUNT = 1200;

const SPOTS = {
  res:{ no:230, name:'知事公邸', short:'公邸', place:'res', cam:'v_res', inside:true, at:[238, 38], label:[0, -13], adj:['resF', 'resB'], go:{ resF:'正門から車を出す', resB:'車を裏門へ回す' },
    text:'車寄せに黒い車が回してある。ルイス巡査部長は運転席で、両手をハンドルに置いて待っている。ペイジは二つに折った日程表を持って、玄関の扉の脇に立っていた。\n\n玄関ホールの窓の向こう、正門の外で、青い立て札が上下している。カメラが来ているなら、あちらだ。裏門は庭を回った川沿いの側で、そちらには誰も呼んでいない。' },
  resF:{ no:231, name:'公邸の正門', short:'正門', place:'res', cam:'v_res', at:[214, 58], label:[-18, 15], adj:['res', 'hq'], go:{ res:'車を公邸へ戻す', hq:'メインストリートへ出て、選挙事務所へ向かう' },
    z:5, arrive:arr(231),
    text:s => '正門の鉄の扉が開くと、青い立て札がいっせいに上がった。支持者は二十人ほど。その列の後ろを、5人がゆっくり歩いている。立て札を振る腕は止まらないが、何人かは、ときどき肩ごしに後ろを確かめていた。'
      + (s.flags.gate ? '' : '\n\n「知事、4年前もここで握手をしました」とペイジが言った。言ったあとは、日程表から目を上げない。'),
    extra:s => [
      c('窓を下ろして、手を振る', 0, 231, { cond:s => !s.flags.gate, run(s){ s.flags.gate = 1; s.msg = '窓を下ろして、手を振った。冷えた空気が車の中に入ってくる。支持者たちは車に沿って数歩走り、門柱のところで足を止めた。'; return 231; } }),
      risk('車を降りて、握手をして回る', .3, 231, '車を降りて、端から順に手を握った。名前を呼ばれるたびに、相手の目を見てうなずく。ルイス巡査部長は列の後ろに立ち、寄ってきた1人を肘で押し戻していた。二十人と握手を終えて車に戻ると、ペイジが黙ってハンカチを差し出した。', '車を降りて、端から順に手を握った。列の切れ目から出てきた手も、支持者のものだと思って握った。その手は握り返さずに、手首のほうへ上がってきた。巡査部長が引き離すまで、顔は支持者のほうへ向けたままでいた。', { cond:s => !s.flags.gate, before:s => { s.flags.gate = 1; } }),
    ] },
  resB:{ no:232, name:'公邸の裏門', short:'裏門', place:'res', cam:'v_resb', at:[262, 58], label:[18, 15], adj:['res', 'radio', 'hq'], go:{ res:'車を公邸へ戻す', radio:'川沿いの旧道を南へ、WGLNの局舎へ向かう', hq:'公邸通りを西へ、選挙事務所へ向かう' },
    z:2,
    arrive:arr(232, s => { if(!s.flags.gardener){ s.flags.gardener = 1; s.msg = '裏門の鉄の格子に、庭師の作業着を着た1人が、両手を掛けて立っていた。もう1人は、門柱の脇の生け垣に肩を埋めている。巡査部長が先に降り、警棒の先で格子の1人の胸を押して、生け垣の側へ下がらせた。門が開く。見ている者は、誰もいなかった。'; } }),
    text:'川沿いの旧道に面した裏門には、支持者も記者も来ていない。川の音と、砂利を踏む車輪の音がするだけだ。生け垣の根もとに、庭師の作業着が2人。どちらも生け垣のほうを向いて立っている。片方の腰には、剪定ばさみが下がったままだ。' },
  hq:{ no:233, name:'選挙事務所', short:'選挙事務所', place:'hq', cam:'v_hq', at:[171, 92], label:[34, 4], adj:['resF', 'resB', 'hosp', 'mainx'], go:{ resF:'公邸の正門へ向かう', resB:'公邸の裏門へ向かう', hosp:'病院通りへ折れて、州立病院へ向かう', mainx:'メインストリートを南へ下る' },
    z:3, arrive:arr(233),
    text:s => '選挙事務所は、銀行と靴屋にはさまれた貸し店舗だ。窓という窓に、自分の顔のポスターが貼ってある。その前の歩道を、3人が歩いていた。運動員がひとり、扉を内側から押さえて、車が停まるのを待っている。'
      + (did(s, 'hq') ? '\n\nガラスの向こうで、60人がまだ受話器を耳に当てている。' : '\n\n日程表では、9時にここで運動員を激励することになっている。'),
    extra:s => [c('車を降りて、事務所に入る', 0, 207, { cond:s => !did(s, 'hq') })] },
  mainx:{ no:234, name:'メインストリート', short:'メインストリート', place:'mainst', cam:'v_main', inside:true, at:[176, 186], label:[42, -8], adj:['hq', 'hosp', 'church', 'radio', 'hotelF'], go:{ hq:'北へ、選挙事務所へ向かう', hosp:'北へ上がって、州立病院へ向かう', church:'南へ、聖マルコ教会へ向かう', radio:'オーク通りから川沿いへ出て、WGLNの局舎へ向かう', hotelF:'3番街へ折れて、ホテル・グレンフォードへ向かう' },

<script>
'use strict';
// 警察署長（エレン・ブレナン）の本：300〜399。減らされた人数で、投票日の通常の警備計画を回す
// 署の中の部屋と、巡回で回る現場は SPOTS にあって、見取り図と街の地図の上を動く。paras にあるのは、そこで起きる出来事
(() => {
const WOUND = '制服の袖が裂けていた。手首の上に、赤い筋が1本。爪か歯かは、見ただけではわからない。';
const attacked = (s, chance) => { if(Math.random() >= chance) return false; bite(s); return true; };
const risk = (label, chance, to, ok, hit, extra = {}) => c(label, 0, 0, { ...extra, run(s, w){ if(extra.before) extra.before(s, w); s.msg = attacked(s, chance) ? hit + '\n' + WOUND : ok; return to; } });
const pick = (label, to, fn, extra = {}) => c(label, 0, to, { ...extra, run(s, w){ fn(s, w); return to; } });
const back = s => s.flags.back;
// 現場どうしは、パトカーで8分。10時を過ぎると、着く前に無線が入る
const SITES = { lot:'署', school:'リンカーン小学校', hospc:'州立病院', north:'ノースエンドのエルム通り', bridgec:'ケスラー橋', county:'郡庁舎' };
const go = id => Object.fromEntries(Object.keys(SITES).filter(k => k !== id).map(k => [k, `パトカーで、${SITES[k]}へ向かう`]));
const others = id => Object.keys(SITES).filter(k => k !== id);
const arr = no => (s, w) => {
  if(!(s.from in SITES)) return;
  s.clock += 6;
  if(!s.flags.d304 && s.clock >= 600){ s.flags.back = no; return 304; }
};
// 時刻で変わる場面
const NOON = 700, FENCE = 900, JAM = 990, CLOSE = 1140, SHUT = 1215;
const WAITS = [720, FENCE, JAM, CLOSE];
const nextWait = s => WAITS.find(t => t > s.clock);
const amSchool = s => !s.flags.sch1 && s.clock < NOON;
const pmSchool = s => !s.flags.sch2 && s.clock >= CLOSE && s.clock <= SHUT;
const speech = s => !s.flags.d305 && s.clock <= 720;
const jam = s => !s.flags.d311 && s.clock >= JAM;

// フェンスの2人を留置場へ入れた日は、午後に、2人入れた房から1人が廊下へ出ている
const loose = s => !!s.flags.cells && s.clock >= FENCE && !s.flags.caged;
const SPOTS = {
  // ===== 署の中 =====
  p_roll:{ no:320, name:'点呼室', place:'ps', room:'roll', adj:['p_hall'], go:{ p_hall:'廊下へ出る' },
    text:'椅子は出したままで、座っている者はいない。夜勤の誰かが置いていった紙コップが、長机に3つ残っている。\n\n壁の配置表には、ドイル副署長の字で、予備の1台の行き先が書き足してある。空いている欄は、もうない。' },
  p_hall:{ no:321, name:'1階廊下', place:'ps', room:'hall', adj:['p_roll', 'p_office', 'p_cells', 'p_lobby'], go:{ p_roll:'点呼室へ入る', p_office:'署長室へ入る', p_cells:'留置場へ入る', p_lobby:'玄関へ出る' },
    z:s => (loose(s) ? 2 : 0), block:s => (!loose(s) ? [] : s.from === 'p_lobby' ? ['p_roll', 'p_office', 'p_cells'] : ['p_lobby']),
    text:(s, w, aware) => '通信室の扉ごしに、ノヴァクの声がする。番地を復唱して、「順番にうかがいます」と言う。朝から同じ文句だ。\n\n点呼室の扉は開けてある。手前が署長室で、その先が留置場。玄関は、廊下の反対の端になる。'
      + (loose(s) ? '\n\n留置場の戸が、開いたままになっている。\n\n玄関の手前に、2人。ひとりは郵便配達の制服で、鞄の肩ひもをまだ掛けている。どちらの手首にも、手錠が片方だけ下がっていた。朝、フェンスから外した2人だ。' + (aware ? '2人の顔が、こちらを向いた。' : '顔は、玄関のガラス戸のほうを向いている。') + '当番の巡査は、どこにも見えない。'
        : s.flags.caged ? '\n\n留置場の戸は閉めた。錠も確かめた。当番の机は、空いたままだ。' : ''),
    run:{ ok:'反対側の壁に肩を付けて、通った。あいだは腕1本ぶんしかない。後ろで、手錠の鎖が壁に当たって鳴った。', hit:'通りすぎる寸前に、手錠の下がった手が拳銃の帯をつかんだ。腰から引き寄せられる。顔が近い。指を1本ずつはがして、離れた。' },
    extra:s => [
      risk('ひとりずつ腕を取って、留置場の房へ戻す', .4, 321, '後ろから手錠の鎖をつかんで、腕を背中へ回す。そのまま留置場まで歩かせた。戻って、もうひとり。2人とも房へ入れて、格子戸の錠は自分の手で確かめた。', 'ひとり目を房へ入れて戻ると、郵便配達のほうが廊下の真ん中まで来ていた。鎖へ手を伸ばすより先に、袖をつかまれる。そのまま腕をねじって留置場まで歩かせた。房へ入れて、錠は自分の手で確かめた。', { cond:s => loose(s), before:s => { s.flags.caged = 1; s.aware = null; } }),
    ] },
  p_office:{ no:322, name:'署長室', place:'ps', room:'office', adj:['p_hall'], go:{ p_hall:'廊下へ出る' },
    text:s => '机の上は、夜勤の報告が1枚と、投票所17か所の一覧。ほかは片づけてある。\n\n無線機は、通報の系統に合わせたままだ。音を絞っても、ノヴァクの読み上げる番地は聞き取れる。'
      + (!s.flags.lunch && s.clock >= NOON ? '\n\n机の端に紙袋がある。ドイルが置いていった。もう昼を回っている。袋の下に、電話の伝言が2件挟んであった。' : ''),
    extra:s => [
      c('机で昼を食べて、伝言の電話をかける', 0, 307, { cond:s => !s.flags.lunch && s.clock >= NOON }),

        risk('警棒を持って、自分で3人を駐車場の奥へ下がらせる', .25, 326, '警棒の先で胸を押して、1人ずつ、ごみ置き場の柵の中まで下がらせた。3人目が入ったところで、ケイン巡査が柵の戸を閉める。列は、そのあいだも少しずつ進んでいた。', '2人を柵の中へ入れたところで、3人目が車の陰から出てきた。'),
        c('保健局に無線で催促して、パトカーへ戻る', 0, 326),

    // ===== 車の中：無線 =====
    304:{ time:630, place:'car', inside:true, enter(s){ s.flags.d304 = 1; },
      text:'走っている途中で、無線が入った。通信係のノヴァクが、待ちの件数を読み上げる。\n「未対応14件。ノースエンドのエルム通りからは、3回目です。玄関の前にいて、家から出られない、と」\n\n通報に回せる車は、4台とも出ている。動かせるとすれば、投票所の巡回の2台だ。',
      choices:[
        c('投票所の巡回の1台を、通報に回す', 0, 0, { run(s, w){ s.flags.pulled = 1; setFlag(w, s, 'chief_pulled_patrol'); return back(s); } }),
        c('計画どおりにして、順番を待たせる', 0, 0, { run:back }),
      ] },

    // ===== 州立病院：演説の警備 =====
    305:{ time:690, place:'hosp', zombies:3, enter(s){ s.flags.d305 = 1; },
      text:'知事の演説が始まった。演台には背を向けて、聴衆のほうを見ている。\n\nいちばん後ろで、プラカードを持った3人が、演台のほうへ歩き出した。歩き方が揃っていない。1枚は、上下が逆だ。前の列の人たちが、左右に分かれて道を空けていく。',
      choices:[
        c('自分で前に出て、3人を演台の手前で止める', 0, 306, { run(s, w){ setFlag(w, s, 'chief_front');
          s.msg = attacked(s, s.flags.spare === 'hosp' ? .15 : .3)

            : '聴衆のあいだを抜けて、3人の前に立った。警棒を横にして、演台の手前で押し戻す。部下が、後ろから順に腕を取った。知事は、話すのをやめなかった。';
          return 306; } }),
        c('部下に3人を任せ、聴衆を横断幕の側へ下がらせる', 0, 306, { run(s){ s.flags.crowd = 1; s.msg = '両手を広げて、聴衆を横断幕の側へ下がらせた。部下が、3人を演台の手前で押さえる。倒れた人も、押された人もいなかった。'; return 306; } }),
      ] },
    306:{ time:s => s.clock + 20,
      text:'拍手がやんで、聴衆が駐車場のほうへ流れていく。ルイス巡査部長が来て、帽子に手をやった。\n「市警のおかげです。午後はラジオ局、夕方は製鋼所、夜はホテルです。ホテルは人が集まる。そちらから何人か出せますか」\n\n頭の中で、夜の配置表を引く。8時からは、投票箱の回収に4人、開票所に2人を取られる。',
      choices:[
        pick('「回収の要員から2人回す」と答える', 327, (s, w) => { s.flags.hotel = 1; setFlag(w, s, 'chief_hotel'); }),
        c('「出せない。州警察で増やしてくれ」と答える', 0, 327),
      ] },

    // ===== 署長室：昼の電話 =====
    307:{ time:760, place:'ps', enter(s){ s.flags.lunch = 1; },
      text:'紙袋の中身は、ハムのサンドイッチだった。半分食べたところで、受話器を取る。伝言は2件。\n\n1件目は、カーヴァーの選挙事務所から。折り返すと、こう言われた。\n「投票所へお年寄りを送る車を出しています。夕方、その車に警察官を1人ずつ付けてもらえませんか」\n\n2件目は、保健局から。こちらは用件だけだった。\n「引き取りの車が足りません。そちらの留置場の者は、今日じゅうには無理です」\n\nサンドイッチの残りは、袋に戻した。',
      choices:[
        c('送迎の車の件は、「特定の陣営の車には付けられない」と断る', 0, 322, { run(s){ s.flags.neutral = 1; return 322; } }),
        pick('送迎の車が通る道を聞いて、その道に巡回を寄せる', 322, (s, w) => { s.flags.route = 1; setFlag(w, s, 'chief_route'); }),
      ] },

    // ===== ノースエンド：通報の現場 =====
    309:{ time:s => s.clock + 15, place:'north', enter(s){ s.flags.d308 = 1; },
      text:s => '女の人が、こちらへ歩いてきた。上着の前を、片手で押さえている。\n' + (s.clock >= 720 ? '「4年前に泥棒が入ったときは、10分で来てくれました」\n「今日は、22人で回しています」\n「知ってます。ラジオに電話して、知事に言ってやるつもりです」' : '「4年前に泥棒が入ったときは、10分で来てくれました」\n「今日は、22人で回しています」\n女の人は、それには何も言わなかった。')
        + '\n\n女の人は、紙を1枚出して見せた。冷蔵庫の扉から外してきたもので、角に磁石が付いたままだ。投票所の案内だった。\n「これから行きます。8時まででしょう」',
      choices:[c('パトカーへ戻る', 0, 328)] },

    // ===== ケスラー橋：夕方 =====
    312:{ time:s => Math.max(s.clock, 1020) + 30, place:'bridge', zombies:6, enter(s){ s.flags.d311 = 1; },
      text:'街を出る車線に沿って歩いていると、1台の窓が下りた。運転席の男が、顔だけ出す。\n「向こう側は、出ていますか」\n「わかりません。州境までは、州警察の管轄です」\n「投票は済ませたんですがね」\n男は窓を上げた。後ろの席に、毛布と鍋が積んである。いちばん上に、子どもの長靴が1足載っていた。',
      choices:[c('パトカーへ戻る', 0, 329)] },

    // ===== 夜：締め切りと、投票箱の回収 =====
    314:{ time:SHUT, place:'school', enter(s){ s.flags.sch2 = 1; },
      text:s => '8時ちょうどに、選挙管理人が最後尾の後ろに立った。列は、そこから先へは伸びない。最後の1人が体育館を出たのは、8時12分だった。\n\n選挙管理人と係員が、封印した袋を2つ運んできた。1つは票、もう1つは読み取り機の記録だ。受け渡しの用紙に、封印の番号と時刻を書く欄がある。署名の欄は、2人ぶん。\n\n回収に来た警官は、1人だった。決まりでは2人で運ぶ。' + (s.flags.hotel ? 'もう1人は、ホテルへ回してある。' : 'もう1人は、通報の現場から戻れていない。'),
      choices:[
        c('自分が2人目として署名し、回収の車に乗って郡庁舎へ行く', 0, 315, { run(s){ s.flags.rode = 1; return 315; } }),
        c('係員の1人に同乗を頼み、警官1人と係員1人で運ばせる', 0, 326, { run(s){ s.flags.clerk = 1; s.msg = '係員は上着を取りに戻って、2つ目の欄に名前を書いた。袋を膝に載せて、回収の車に乗る。車は、郡庁舎のほうへ出ていった。'; return 326; } }),
      ] },
    315:{ time:1260, place:'county', zombies:4, end:'count',
      text:s => (s.flags.rode ? '袋を2つ抱えて、正面の段の端を上がった。座っていた4人のうち、清掃員の制服の1人が立ち上がる。警備の2人が、先にその腕を取った。\n\n大会議室の受付で、封印の番号を1桁ずつ読み上げた。郡の職員が用紙と照らし合わせて、受領の欄に署名する。'
        : s.flags.clerk ? '大会議室の受付に、リンカーン小学校の袋はもう届いていた。回収の車のほうが、先に着いていた。受け渡しの用紙に、警官1人と係員1人の署名が並んでいる。郡の職員は、決まりの条文を開いて確かめた。それから、受領の欄に署名した。'
        : '大会議室の受付の机に、封印した袋が並びはじめている。郡の職員が、1つずつ番号を読み上げては、受領の欄に署名していく。')
        + '\n\n壁の表に、17の投票区の名前が並んでいる。袋が届いた区に、印が付いていく。9時現在、11。\n\n腰の無線で、ノヴァクが呼んでいる。未対応の通報は、31件。\n\n（署長の本は、ここまで）',
      choices:[] },

})();

<script>
'use strict';
// 病院長（ハーラン）の本：400〜499。統合の決まった病院で、投票日の一日を回す
// 病院の中の部屋と、正面・搬入口は SPOTS にあって、見取り図の上を動く。paras にあるのは、そこで起きる出来事
(() => {
const WOUND = '白衣の袖に、歯の形に血がにじんだ。深さは、洗ってみないとわからない。';
const attacked = (s, chance) => { if(Math.random() >= chance) return false; bite(s); return true; };
const risk = (label, chance, to, ok, hit, extra = {}) => c(label, 0, 0, { ...extra, run(s, w){ if(extra.before) extra.before(s, w); s.msg = attacked(s, chance) ? hit + '\n' + WOUND : ok; return to; } });
const pick = (label, to, fn, extra = {}) => c(label, 0, to, { ...extra, run(s, w){ fn(s, w); return to; } });
// 時刻で変わる場面
const SPEECH = 690, SPEECH_END = 735, RISE = 720, BRIEF = 905, FENCE = 900, SHIFT = 1020, COUNT = 1200;
const WAITS = [SPEECH, 880, SHIFT, COUNT];
const nextWait = s => WAITS.find(t => t > s.clock);
const speech = s => !s.flags.d403 && s.clock >= SPEECH - 20 && s.clock <= SPEECH_END;
const brief = s => !s.flags.d404 && s.clock >= 880 && s.clock <= 930;
const shift = s => !s.flags.d405 && s.clock >= SHIFT && s.clock < COUNT;
const wardZ = s => (s.flags.wardClear ? 0 : 3);
// 1階の廊下の2台のストレッチャーは、昼を過ぎると空になっている
const risen = s => s.clock >= RISE && !s.flags.hallClear;
const dockZ = s => (s.flags.dockIn ? 0 : 5);
// 鎮静剤を1本使って、その場の者を静かにさせる
const sedate = (flagName, to, text) => c('鎮静剤を1本使う', 0, to, { cond:s => has(s, '鎮静剤') && !s.flags[flagName], run(s){ addItem(s, '鎮静剤', -1); s.flags[flagName] = 1; s.aware = null; s.msg = text; return to; } });

const SPOTS = {
  // ===== 3階 =====
  d_office:{ no:420, name:'院長室', place:'hosp', room:'office', adj:['d_ward'], go:{ d_ward:'廊下へ出る' },
    text:s => '院長室。窓の下に、正面の芝生と、組みかけの演台が見える。'
      + '机の上には、夜勤の報告と、統合の日程表。日程表の表紙には、理事会の判が3つ並んでいる。'
      + (s.clock >= COUNT ? '\n\nラジオは、開票の速報をやっている。' : '\n\n壁の時計は' + fmt(s.clock) + '。'),
    extra:s => [
      c('机の引き出しの拳銃を、白衣のポケットに入れる', 0, 420, { cond:s => !has(s, '拳銃') && !s.flags.gun, run(s){ s.flags.gun = 1; addItem(s, '拳銃'); addItem(s, '弾', 5);
        s.msg = '引き出しの奥、理事会の封筒の下に、小さな拳銃がある。前の院長が置いていったものだ。弾は5発、入ったままになっている。\n\n白衣のポケットに入れた。聴診器と同じ側は、やめた。'; return 420; } }),
      c('机で書類を片づけて、次の予定を待つ', 0, 420, { cond:s => !!nextWait(s), run(s){ s.clock = nextWait(s); s.msg = '決裁の判を押した。押すたびに、内線が鳴った。救急からが4回、病棟からが2回。'; return 420; } }),
      c('ラジオの音を上げて、椅子に座る', 0, 407, { cond:s => s.clock >= COUNT }),
    ] },
  d_ward:{ no:421, name:'3階病棟の廊下', place:'hosp', room:'ward', adj:['d_office', 'd_aud', 'd_hall'], go:{ d_office:'院長室へ入る', d_aud:'講堂へ入る', d_hall:'階段で、1階へ降りる' },
    z:wardZ, block:s => (wardZ(s) ? (s.from === 'd_hall' ? ['d_office', 'd_aud'] : ['d_hall']) : []),
    text:(s, w, aware) => '3階の廊下。片側に病室の戸が並び、突き当たりが階段だ。配膳車が、朝のまま廊下に出ている。'
      + (wardZ(s) ? '\n\n階段の手前に、病衣が3人立っている。夜のうちに病室を出たまま、戻されていない。ひとりは、点滴の管を腕から下げている。' + (aware ? '3人とも、こちらを向いた。' : '3人とも、非常口の緑の明かりのほうを向いている。') + '\n看護師たちは、ワゴンを押して、その後ろを黙って通る。'
        : '\n\n階段の手前の3つの病室は、外から掛け金が掛けてある。戸の小窓に、紙が貼ってあった。「保健局　引き取り待ち」。')
      + (shift(s) ? '\n\n詰所の前に、日勤の看護師が集まっている。師長が、こちらを見て会釈をした。話があるらしい。' : ''),
    runLabel:{ d_hall:'3人の脇を抜けて、階段を降りる', d_office:'3人の脇を抜けて、院長室へ行く', d_aud:'3人の脇を抜けて、講堂へ行く' },
    run:{ ok:'配膳車を楯にして、3人の脇を抜けた。点滴の管が、車輪に引っかかって伸びた。', hit:'脇を抜けるとき、点滴を下げたのが、白衣の腕をつかんだ。名札の付いた胸を押して、離れた。受け持ちの医師の名前まで覚えている患者だ。' },
    extra:s => [
      risk('師長を呼んで、3人をひとりずつ病室へ戻す', .3, 421, '師長がシーツを広げて、頭からかぶせる。その上から肩を抱いて、病室へ歩かせた。3人とも入れて、掛け金を掛ける。師長は、戸の小窓に紙を貼った。', '2人目にシーツをかぶせたとき、3人目が師長のほうへ向いた。あいだに入って、腕を出す。歯が当たった。師長と2人で病室へ押し入れて、掛け金を掛けた。', { cond:s => !!wardZ(s), before:s => { s.flags.wardClear = 1; s.aware = null; } }),
      sedate('wardClear', 421, '点滴を下げたのから順に、肩へ1本ずつ打つ量はない。1本を3つに分けて打った。3人は、その場に座りこんだ。師長と看護助手が、車椅子で病室へ運んでいく。'),
      c('師長の話を聞く', 0, 405, { cond:shift }),
    ] },
  d_aud:{ no:422, name:'講堂', place:'hosp', room:'aud', adj:['d_ward'], go:{ d_ward:'廊下へ出る' },
    text:s => '講堂。折りたたみの椅子が200脚、並べてある。壇の上に、演台と水差し。'
      + (brief(s) ? '\n\n席は、もう半分以上埋まっている。白衣と、事務の紺の上着。誰も話していない。' : s.flags.d404 ? '\n\n椅子は、並べたままになっている。床に、日程表の写しが何枚か落ちていた。' : '\n\n3時から、ここで職員に統合の日程を説明する。'),
    extra:s => [c('壇に上がって、日程を読む', 0, 404, { cond:brief })] },

  // ===== 1階 =====
  d_hall:{ no:423, name:'1階廊下', place:'hosp', room:'hall', adj:['d_ward', 'd_lobby', 'd_er', 'd_supply', 'd_dock'], go:{ d_ward:'階段で、3階へ上がる', d_lobby:'受付へ出る', d_er:'「救急」の扉を開ける', d_supply:'「用度係」の戸を開ける', d_dock:'荷受け場へ出る' },
    z:s => (risen(s) ? 2 : 0), block:s => (!risen(s) ? [] : s.from === 'd_ward' || s.from === 'd_dock' ? ['d_lobby', 'd_er', 'd_supply'] : ['d_ward', 'd_dock']),
    text:(s, w, aware) => '1階の廊下。受付の側から「救急」、「用度係」と札が並び、その先に荷受け場と階段がある。'
      + (s.flags.hallClear ? '\n\nストレッチャーが1台、壁に押しつけてある。そのあいだに、2人が挟まれていた。柵の上で、腕だけが動いている。'
        : risen(s) ? '\n\n壁ぎわのストレッチャーは、2台とも空だ。シーツが床に落ちている。\n用度係の戸の先に、はだしの男と女が立っていた。足の親指の札は、今朝、自分が署名したものだ。' + (aware ? '2人は、こちらへ歩いてくる。' : '2人は、荷受け場のほうを向いている。')
        : '\n\n壁ぎわに、ストレッチャーが2台。どちらもシーツが頭まで掛けてあって、足の親指に札が結んである。霊安室が空くのを、ここで待たせている。'),
    run:{ ok:'壁に沿って、2人の脇を抜けた。女のほうの手が、白衣の裾に触れた。', hit:'脇を抜けるとき、男の腕が肩に掛かった。体重がそのまま乗ってくる。下へ抜けたとき、歯が当たった。' },
    extra:s => [
      risk('空のストレッチャーを押していって、2人を壁に挟む', .3, 423, 'ストレッチャーを横にして押し、2人を壁まで下がらせた。車輪の止め具を踏む。通りかかった看護助手が、黙って反対側の止め具も踏んでくれた。', '押していく途中で、女の手が柵を越えた。手の甲に歯が当たる。そのまま壁まで押しつけて、止め具を踏んだ。', { cond:risen, before:s => { s.flags.hallClear = 1; s.aware = null; } }),
      sedate('hallClear', 423, '男の肩に半分、女の肩に半分打った。2人は壁にもたれて、ゆっくり座った。看護助手がストレッチャーを持ってきて、柵を上げた。'),
    ] },
  d_lobby:{ no:424, name:'受付', place:'hosp', room:'lobby', adj:['d_hall', 'd_front'], go:{ d_hall:'廊下へ進む', d_front:'正面玄関から、外へ出る' }, z:3,
    text:'受付。長椅子は埋まっていて、壁ぎわに立っている人もいる。番号の表示は、184。\n\n長椅子のあいだを、3人がゆっくり歩いている。呼ばれても窓口へは行かない。受付の事務員は、その3人の番号を、もう呼ばなくなっている。\n\nこちらに気づいた何人かが、腰を浮かせた。何か言われる前に、会釈だけを返す。' },
  d_er:{ no:425, name:'救急', place:'hosp', room:'er', adj:['d_hall'], go:{ d_hall:'廊下へ戻る' }, z:3,
    text:s => '救急の待合。長椅子に座れない人が、床に座っている。窓口の前に、番号札を握ったまま動かないのが3人。看護師は、その3人の肩ごしに、次の名前を呼んでいる。'
      + (s.flags.d401 ? (s.flags.report ? '\n\n届け出の用紙の束が、窓口の箱からあふれている。' : '\n\n窓口の箱に、届け出の用紙は入っていない。カルテの端に、鉛筆で小さく印が付けてあるだけだ。') : '\n\n救急の主任が、カルテを抱えたまま、こちらへ来た。'),
    extra:s => [c('救急の主任の話を聞く', 0, 401, { cond:s => !s.flags.d401 })] },
  d_supply:{ no:426, name:'用度係', place:'hosp', room:'supply', adj:['d_hall'], go:{ d_hall:'廊下へ戻る' },

<script>
'use strict';

// 決まった形の段落（拠点・遭遇）を本に登録する
for(const id of [...CHAR_IDS, 'monster']){
  const book = BOOKS[id];
  for(const [place, no] of Object.entries(book.hubs)) book.paras[no] = { hub:place, monster:id === 'monster' };
  if(book.enc) book.paras[book.enc] = { encounter:true };
}
const PERIODS = [510, 690, 810, 960, 1140], PERIOD_NAMES = ['朝', '午前', '昼', '午後', '夕方', '夜'];
function periodOf(t){ return PERIODS.filter(b => t >= b).length; }
// まだ前の時間帯にいる人（本を開いたことのない人と、結末まで行った人は数えない）
// 部屋では、いちばん遅れている人より gap 分より先へ行くと、相手が追いつくまで待つ（gap が 0 なら、時間帯の区切りで待つ）
const roomGap = () => (room ? Number(store.get('gap', 0)) || 0 : 0);
function behind(s){
  const mine = periodOf(s.clock), gap = roomGap(), ats = room ? store.get('ats', {}) : {}, skipped = s.skipped || {};
  return others(s.char).filter(o => o.status === 'active' && (o.history || []).length
    && (gap ? o.clock + gap < s.clock : periodOf(o.clock) < mine)
    && !(skipped[o.char] != null && skipped[o.char] >= (ats[o.char] || 0))); // 待たずに進むと決めた相手は、その人がまた動くまで数えない
}
function bookOf(s){ return BOOKS[s.book]; }
function paraOf(s){ return bookOf(s).paras[s.para]; }
function hubNo(s, place){ return bookOf(s).hubs[place]; }

// ===== 拠点の選択肢 =====
// 拠点の画面は3段に分ける：最初は「調べる」「持ち物」「移動する」（と脱出）だけ
function hubChoices(s, w, place){
  const explore = [], items = [], exits = [], moves = [];
  const id = s.char;
  const back = () => hubNo(s, place);
  for(const ch of (BOOKS[id].hubExtra?.[place] || [])) if(!ch.cond || ch.cond(s, w)) explore.push(ch);

  w.items[place].forEach((it, idx) => {
    if(it.hidden || (it.t || 0) > s.clock) return; // 置かれた時刻より前にいる人には見えない
    explore.push({ label:`置いてあった${it.name}を拾う`, cost:0, run(s, w){
      const i = w.items[place].findIndex((x, j) => j === idx && !x.hidden && x.name === it.name);
      if(i >= 0){
        const [got] = w.items[place].splice(i, 1);
        if(got.sample) (s.samples = s.samples || []).push(got.sample); else addItem(s, got.name);
        s.msg = `${got.name}を拾った。`;
      }
      return back();
    } });
  });

  if(!s.flags['searched_' + place]){
    explore.push({ label:'辺りを探す（30分）', cost:30, run(s, w){
      s.flags['searched_' + place] = 1;
      const found = w.items[place].filter(i => i.hidden);
      w.items[place] = w.items[place].filter(i => !i.hidden);
      found.forEach(i => addItem(s, i.name));
      addEvent(w, s, 'search', place, found.length ? { took:true } : {});
      s.msg = found.length ? `${found.map(i => i.name).join('、')}を見つけた。` : 'めぼしい物は見つからなかった。';
      return back();
    } });
  }

  // 血液：傷を負った人は採血して置いていける。医者だけが病院の検査室で調べられる
  if(id === 'doctor' && place === 'hospital'){
    if(s.wounds) explore.push({ label:'検査室で、自分の血を調べる（15分）', cost:15, area:'研究棟', run(s){
      s.msg = `検査の結果：${s.infected ? '陽性。あなたは感染している。' : '陰性。あなたは感染していない。'}`;
      return back();
    } });
    (s.samples || []).forEach((smp, i) => explore.push({ label:`検査室で、${smp.name}を調べる（15分）`, cost:15, area:'研究棟', run(s){
      s.samples.splice(i, 1);
      s.msg = `${smp.name}の検査結果：${smp.infected ? '陽性。感染している。' : '陰性。感染していない。'}`;
      return back();
    } }));
  }
  if(s.wounds){
    items.push({ label:'採血して、血液をここに置いていく（5分）', cost:5, run(s, w){
      const name = `血液（${CHARS[id].name}・${fmt(s.clock)}）`;
      w.items[place].push({ name, hidden:false, by:id, t:s.clock, sample:{ name, infected:s.infected } });
      addEvent(w, s, 'drop', place); s.msg = `${name}を、ここに置いた。`;
      return back();
    } });
  }

  // 感染していなくても打てる（打っても無駄になるだけ）。効いたかどうかは本人にもわからない
  if(s.wounds && has(s, '血清')){
    items.push({ label:'自分に血清を打つ（5分）', cost:5, run(s){
      addItem(s, '血清', -1); s.infected = false; s.turnAt = null;
      s.msg = '血清を打った。……感染していたのなら、これで助かったはずだ。';
      return back();
    } });
  }
  if(s.wounds && has(s, '薬')){
    items.push({ label:'自分に薬を打つ（5分）', cost:5, run(s){
      addItem(s, '薬', -1); if(s.infected) s.turnAt += CHARS[id].medDelay;
      s.msg = '薬を打った。感染していたのなら、発症を遅らせられたはずだ。';
      return back();
    } });
  }
  if(s.hp < 3 && id === 'doctor'){
    items.push({ label:'自分の傷を手当てする（20分）', cost:20, run(s){ s.hp += 1; s.msg = '傷を縫って包帯を巻いた。'; return back(); } });
  }
  if(s.hp < 3 && has(s, '救急箱')){
    items.push({ label:'救急箱を使う（10分）', cost:10, run(s){ addItem(s, '救急箱', -1); s.hp += 1; s.msg = '救急箱で傷の手当てをした。'; return back(); } });
  }
  for(const [item, n] of Object.entries(s.items)){
    if(n <= 0) continue;
    items.push({ label:`${item}を1つ、ここに置いていく`, cost:0, run(s, w){
      addItem(s, item, -1); w.items[place].push({ name:item, hidden:false, by:id, t:s.clock });
      addEvent(w, s, 'drop', place); s.msg = `${item}をここに置いた。`;
      return back();
    } });
  }

  // 出口
  if(place === 'police' && has(s, '車の鍵')){
    if(bridgeOpen(s)) exits.push({ label:'パトカーで橋へ向かう（15分）', cost:15, run(s, w){
      return taken(w, 'car_cleared') ? carEscape(s, w) : BOOKS[id].carScene;
    } });
    else if(s.clock < BRIDGE_OPEN) exits.push({ label:'パトカーで橋へ向かう（橋が開くのは2時から）', disabled:true });
    else exits.push({ label:'パトカーで橋へ向かう（橋は4時に封鎖された）', disabled:true });
  }
  if(place === 'port' && has(s, '燃料') && !w.boatUsed && s.clock + 20 < DAWN){
    exits.push({ label:'ボートに燃料を入れて沖へ出る（20分）', cost:20, run:(s, w) => boatEscape(s, w) });
  }

  const bike = has(s, '自転車');
  for(const [to, min] of Object.entries(ADJ[place])){
    const m = bike ? Math.max(5, Math.ceil(min / 10) * 5) : min;
    moves.push({ label:`${PLACES[to]}へ（${m}分${bike ? '・自転車' : ''}）`, cost:m, move:true, dest:to, run(s, w){
      s.place = to; addEvent(w, s, 'pass', to);
      s.visited = s.visited || [];
      if(!s.visited.includes(to)) s.visited.push(to);
      return hubNo(s, to);
    } });
  }

  const menu = (label, to) => ({ label, cost:0, menu:to, run(s){ s.menu = to; return back(); } });
  const m = s.menu || '';
  if(m === 'explore'){
    // 部屋が多い場所は、まとまり（1階・地下など）ごとに分ける
    const areas = [...new Set(explore.filter(ch => ch.area).map(ch => ch.area))];
    return [
      ...areas.map(a => menu(`${a}（${explore.filter(ch => ch.area === a).length}）`, 'explore:' + a)),
      ...explore.filter(ch => !ch.area),
      menu('← 戻る', null),
    ];
  }
  if(m.startsWith('explore:')){
    const a = m.slice(8);
    return [...explore.filter(ch => ch.area === a), menu('← 戻る', 'explore')];
  }
  if(m === 'items') return [...items, menu('← 戻る', null)];
  if(m === 'move') return [...moves, menu('← 戻る', null)];
  return [
    ...exits,
    ...(explore.length ? [menu('この場所を調べる', 'explore')] : []),
    ...(items.length ? [menu('持ち物', 'items')] : []),
    menu('ほかの場所へ移動する', 'move'),
  ];
}

function monsterChoices(s, w, place){
  const list = [{ label:'ここに群れを呼び集める（30分）', cost:30, run(s, w){
    addEvent(w, s, 'horde', place); s.msg = `${PLACES[place]}に群れが集まってきた。しばらくは、生きた人間には近寄れない場所になる。`;
    return hubNo(s, place);
  } }];
  for(const to of Object.keys(ADJ[place])){
    list.push({ label:`${PLACES[to]}へさまよう（10分）`, cost:10, run(s){ s.place = to; return hubNo(s, to); } });
  }
  list.push({ label:'動かずに夜明けを待つ', cost:0, run(s){ s.clock = DAWN; return 699; } });
  return list;
}

function encounterChoices(s){
  const back = () => s.after || hubNo(s, s.place);
  const calm = alert => { const z = zsHere(s); if(z){ z.aware = false; z.alert = alert; } };
  const list = [];
  if(s.char === 'police' && has(s, '弾')){
    list.push({ label:'撃つ（弾1発）', cost:5, run(s, w){
      shoot(s, w);
      const heard = s.msg; // 銃声で化け物が増えたときの知らせ
      const z = zsHere(s);
      if(z && z.aware){
        z.n = Math.max(0, z.n - 1); z.aware = z.n > 0;
        s.msg = z.n ? `一体の頭を撃ち抜いた。だが銃声で、残りの${z.n}体もこちらへ向かってくる！` : '最後の一体を撃ち倒した。銃声が夜に響いた。';
      } else s.msg = '一発で頭を撃ち抜いた。銃声が夜に響いた。';
      if(heard) s.msg += '\n' + heard;
      return back();
    } });
  }
  list.push({ label:'走って逃げる（10分）', cost:10, run(s){ s.msg = biteRoll(s, 0.35) || 'なんとか振り切った。'; calm(50); return back(); } });
  list.push({ label:'物陰に隠れてやり過ごす（30分）', cost:30, run(s){ s.msg = biteRoll(s, 0.15) || '息を殺しているうちに、足音は遠ざかった。'; calm(20); return back(); } });
  return list;
}

function choicesOf(s, w){
  const p = paraOf(s);
  if(p.spot) return spotChoices(s, w);
  if(p.hub) return p.monster ? monsterChoices(s, w, p.hub) : hubChoices(s, w, p.hub);
  if(p.encounter) return encounterChoices(s);
  const list = typeof p.choices === 'function' ? p.choices(s, w) : (p.choices || []);
  return list.filter(ch => !ch.cond || ch.cond(s, w));
}

// ===== 進める =====
function go(s, w, target){
  s.para = target;
  const p = paraOf(s);
  if(!p) throw new Error(`段落 ${target} が見つかりません（${s.book}）`);
  if(p.time != null) s.clock = Math.max(s.clock, typeof p.time === 'function' ? p.time(s) : p.time);
  if(p.place) s.place = p.place;
  if(p.enter) p.enter(s, w);
  if(p.end) s.status = typeof p.end === 'function' ? p.end(s) : p.end;
}
function isEnd(s, target){ return !!bookOf(s).paras[target]?.end; }

// ===== その場にいる化け物（気づかれているかどうか） =====
// 場所に着いたときに数を決める。その場で過ごした時間と物音で、少しずつ気づかれていく（100で気づかれる）
const ALERT_PER_MIN = 1.5; // 化け物1体・1分あたり
const ZOMBIE_SPOT = { police:'ロビーの奥', hospital:'廊下の先', shotengai:'通りの向こう', subway:'ホームの端', gas:'給油機の陰', port:'桟橋の先', mansion:'階段の下', mall:'吹き抜けの下' };
const ZOMBIE_MAX = 4;
function arriveZombies(s, w){
  const n = Math.max(0, Math.min(ZOMBIE_MAX, Math.round(danger(s, w) * .6 - .4 + Math.random() * .8)));
  s.zs = { place:s.place, n, alert:0, aware:false };
}
function zsHere(s){ return s.zs && s.zs.place === s.place ? s.zs : null; }
function zombieLine(s){
  const z = zsHere(s);
  if(!z || !z.n) return '辺りに、化け物の姿は見えない。';
  let t = `${ZOMBIE_SPOT[s.place]}で、化け物が${z.n}体うろついている。まだこちらに気づいていない。`;
  if(z.alert >= 60) t += '\nそのうち1体が、ときどきこちらを気にしている。';
  return t;
}

// 時計が進んだあとの判定：発症・体力切れなら化け物の本へ、夜明けなら間に合わなかった結末へ（どちらでもなければ null）
function fateTarget(s){
  if(s.hp <= 0 || (s.infected && s.clock >= s.turnAt)){
    if(!(s.infected && s.clock >= s.turnAt)) s.msg = (s.msg ? s.msg + '\n' : '') + '力尽きて倒れたところを、化け物に噛まれた。';
    s.book = 'monster'; s.status = 'monster'; s.hp = 3; s.after = null; return 600;
  }
  if(s.clock >= DAWN) return BOOKS[s.char].endings.stranded;
  return null;
}

function act(choice){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  if(s.status === 'active' && behind(s).length) return;
  const wasEncounter = !!paraOf(s).encounter;
  if(choice.menu !== undefined){ // 画面の段を切り替えるだけ（時間は進まない）
    choice.run(s); store.set('player-' + current, s); render(); return;
  }
  pushUndo(w, s);
  record(s, choice.label);
  s.offcam = false; s.pose = null;
  // 出ていくときの足の運び：選択肢に決まりがなければ、その場の様子で決める（気づかれていれば走る、気づかれていないゾンビがいれば忍び足）
  const spB = s.book !== 'monster' ? spotOf(s) : null, zB = spB && !spB.calm ? spotZ(s, w, spB) : 0;
  const exitGait = gaitOf(choice) || (zB ? (s.aware === paraOf(s).spot ? 'run' : 'sneak') : null);
  const camBefore = camFor(s), placeBefore = s.place, blindBefore = inBlindSpot(s);
  const zBefore = paraOf(s).hub && s.book !== 'monster' ? zsHere(s) : null;
  s.menu = null;
  selectedBlock = null;
  s.msg = '';
  s.clock += choice.cost || 0;
  let target = choice.run ? choice.run(s, w) : choice.to;
  if(wasEncounter) s.after = null;
  // 拠点で時間を使うと、その場の化け物に気づかれていく。その場で撃てば、すぐ気づかれる
  if(zBefore && zBefore.n && !zBefore.aware && !choice.move && s.place === zBefore.place){
    zBefore.alert += (choice.cost || 0) * zBefore.n * ALERT_PER_MIN;
    if(w.events.some(e => e.type === 'shot' && e.by === s.char && e.place === s.place && e.t === s.clock)) zBefore.alert = 100;
    if(zBefore.alert >= 100) zBefore.aware = true;
  }
  if(s.book !== 'monster' && !zsHere(s)) arriveZombies(s, w);
  const toHub = !!BOOKS[s.book].paras[target]?.hub;

  if(s.book !== 'monster' && s.status === 'active' && !isEnd(s, target)){
    const fate = fateTarget(s);
    if(fate){
      target = fate;
    } else if(zsHere(s)?.aware && (zBefore || toHub || wasEncounter)){
      s.after = target; target = BOOKS[s.char].enc;
    } else if(choice.move && Math.random() < Math.min(0.6, danger(s, w) * 0.06)){
      s.after = target; target = BOOKS[s.char].enc;
    }
  }
  if(s.book === 'monster' && s.clock >= DAWN) target = 699;
  go(s, w, target);
  if(s.book !== 'monster' && !s.moved && !choice.risky && !choice.shot) spotLinger(s, w);
  s.moved = false;
  if(s.book === 'monster' && target === 699) s.status = 'monster-done';
  const blindAfter = inBlindSpot(s);
  markRoom(s);
  if(!blindAfter) s.lastCam = camFor(s);
  if(videoOn && Cut.built && Cut.raf && !Cut.built.plan && !isEnd(s, target)){
    const b = Cut.built, moved = s.place !== placeBefore;
    if(camFor(s) !== camBefore){
      // 別のカメラへ：行き先の方向へ歩いて出ていく（カメラのない部屋から出てきたときは、もう映っていないので歩かない）
      Cut.exitTo = (moved && b.exits?.[s.place]) || b.door || [0, -4];
      Cut.exitStart = blindBefore ? 0 : performance.now();
      setExitGait(exitGait);
      Cut.arrive = { from:moved ? placeBefore : null };
    } else if(!blindBefore && blindAfter){
      // 同じカメラのまま、カメラのない部屋へ：扉へ歩いて消える
      if(!b.open){ Cut.exitTo = b.door || [0, -4]; Cut.exitStart = performance.now(); setExitGait(exitGait); }
    } else if(blindBefore && !blindAfter && Cut.actors){
      // カメラのない部屋から戻る：扉から現れる
      Cut.exitStart = 0; Cut.actors.enterFrom = b.enter || b.door || null; Cut.actors.enterStart = performance.now();
    }
  }

  sendStat(s);
  store.set('world', w); store.set('player-' + current, s);
  render();
  window.scrollTo(0, 0);
}
function sendStat(s){
  if(!TEST_BUILD || !room || s.statSent || s.status === 'active' || s.status === 'monster') return;
  s.statSent = 1;
  const body = { build:BUILD, char:s.char, end:String(s.status), clock:s.clock, hp:s.hp, infected:!!s.infected, turned:s.book === 'monster', bites:s.bites || [], inRoom:!!room,
    path:(s.history || []).slice(-400).map(h => [h.para, String(h.chosen || '').slice(0, 30)]) };
  roomFetch(ROOM_DB + '_stats/' + DEV + '-' + Date.now().toString(36) + '.json', { method:'PUT', body:JSON.stringify(body) }).catch(() => {});
}

function tryJump(n){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  const p = paraOf(s);
  pushUndo(w, s);
  record(s, `番号 ${n} を打ち込んだ`);
  s.msg = '';
  if(p.jumps && p.jumps.includes(n)) go(s, w, n);
  else {
    s.clock += 5; s.msg = '何も起きない。（5分が過ぎた）';
    const fate = s.book !== 'monster' && s.status === 'active' ? fateTarget(s) : null;
    if(fate) go(s, w, fate);
  }
  store.set('world', w); store.set('player-' + current, s);
  render();
}

// ===== 気配（ほかの人の出来事が届く）とすれ違いの跡 =====
function collectNotices(s, w){
  const out = [];
  for(const [t, text] of TIME_NOTICES){
    if(s.clock >= t && !s.flags['notice_' + t]){ s.flags['notice_' + t] = 1; out.push(text); }
  }
  for(const e of w.events){
    if(s.seen.includes(e.id) || e.t > s.clock) continue;
    if(e.by === s.char && !e.npc) continue;
    s.seen.push(e.id);
    const where = PLACES[e.place];
    if(e.type === 'shot'){
      out.push(e.place === s.place ? 'すぐ近くで銃声がした！' : near(e.place, s.place) ? `${where}の方から銃声が響いた。化け物の群れが、そちらへ流れていく。` : '遠くで、かすかに銃声がした。');
    } else if(e.type === 'noise'){
      out.push(e.text || `${where}の方で、大きな音がした。`);
    } else if(e.type === 'horde' && near(e.place, s.place)){
      out.push(`${where}の方で、化け物の群れが騒いでいる。`);
    } else if(e.type === 'escape'){
      out.push(e.by_car ? '遠くで、車のエンジン音が橋のほうへ遠ざかっていった。' : '港のほうから、ボートのエンジン音が聞こえた。');
    } else if(e.type === 'pass' && s.book === 'monster' && near(e.place, s.place) && s.clock - e.t <= 60){
      out.push(`${where}から、生きた人間のにおいがする。`);
    } else if(e.type === 'flag' && e.notice && near(e.place, s.place)){
      out.push(e.notice);
    }
  }
  return out;
}

function traces(s, w, place){
  const kinds = new Set();
  let robbed = false;
  for(const e of w.events){
    // 一つしかない物は、実際に先に取った人のもの。取られた跡は街の時刻に関係なく残る
    if(e.took && e.place === place && e.by !== s.char) robbed = true;
    if(e.place !== place || e.t >= s.clock || (e.by === s.char && !e.npc)) continue;
    if(e.type === 'pass' && s.clock - e.t > 90) continue;
    kinds.add(e.type);
  }
  const t = [];
  if(kinds.has('shot')) t.push('床に薬莢が転がっている。誰かがここで撃ったらしい。');
  if(kinds.has('search') || robbed) t.push('棚や引き出しが荒らされている。誰かが先に探し回った後だ。');
  if(kinds.has('pass')) t.push('濡れた足跡が新しい。少し前に、誰かがここを通ったようだ。');
  if(kinds.has('horde')) t.push('壁に爪の跡。化け物の群れが通った跡だ。');
  for(const it of w.items[place]) if(!it.hidden && (it.t || 0) <= s.clock) t.push(`誰かが置いていった${it.name}がある。`);
  if(place === 'port') t.push(w.boatUsed ? '桟橋のボートは、もうない。' : '桟橋に小さなボートが一艘つながれている。燃料は空だ。');
  if(place === 'gas') t.push(flag(s, w, 'gas_dark') ? '給油機の明かりは消えていて、スタンドは闇に沈んでいる。' : s.clock < BLACKOUT ? '給油機の明かりだけが、ぽつんと夜に浮いている。' : '停電で、給油機の明かりも消えている。');
  if(place === 'subway' && flag(s, w, 'subway_lights')) t.push('ホームから線路の奥へ、非常灯が点々と灯っている。');
  return t;
}

const DISTRICTS = {

const coastY = x => 287 + 6 * Math.sin(x / 26) + (x > 150 && x < 225 ? 5 : 0);
const riverX = y => 28 + 4 * Math.sin(y / 34);
function mapZone(x, y){
  if(x < riverX(y)) return 'river';
  if(y > coastY(x)) return 'sea';
  if(Math.hypot((x - 200) / 58, (y - 36) / 33) < 1) return 'hill';
  if(Math.hypot((x - 136) / 20, (y - 190) / 14) < 1) return 'park';
  return 'land';
}
function nearestPlace(x, y){
  let best = null, bd = Infinity;
  for(const [k, l] of Object.entries(LANDMARKS)){ const d = Math.hypot(x - l.x, y - l.y); if(d < bd){ bd = d; best = k; } }
  return best;
}
// 毎回同じ形になるよう、決まった値で揺らす
const hash = (a, b, c) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
// 点の列を、なめらかな曲線のパスにする
function smoothPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

// 街区は一度だけ作る。番号は地区ごとに、上の列から左から右へ 1 番から振る（住所＝地区名＋番号）
const DISTRICT_ORDER = ['N', 'W', 'C', 'E', 'SE', 'H'];
const MAP_BLOCKS = (() => {
  const list = [];
  for(const [owner, l] of Object.entries(LANDMARKS)){
    const ca = Math.cos(l.angle * Math.PI / 180), sa = Math.sin(l.angle * Math.PI / 180);
    const toMap = (a, b) => [l.x + ca * a - sa * b, l.y + sa * a + ca * b];
    const R = 420;
    for(let i = -Math.ceil(R / l.cw); i <= Math.ceil(R / l.cw); i++){

function mapSvg(s, moves = [], tap = null){

    hospital:(x, y) => `<path d="M${x - 5},${y - 13} h10 v8 h8 v10 h-8 v8 h-10 v-8 h-8 v-10 h8z" class="m-land"/><path d="M${x - 1.5},${y - 6} h3 v4.5 h4.5 v3 h-4.5 v4.5 h-3 v-4.5 h-4.5 v-3 h4.5z" class="m-cross"/>`,
    mansion:(x, y) => `<circle cx="${x}" cy="${y + 2}" r="14" class="m-garden"/><rect x="${x - 10}" y="${y - 6}" width="20" height="12" class="m-land"/><rect x="${x - 3}" y="${y - 10}" width="6" height="5" class="m-land"/>`,
    shotengai:(x, y) => [-24, -14, -4, 6, 16].map(dx => `<rect x="${x + dx}" y="${y - 9}" width="8" height="6" class="m-land"/><rect x="${x + dx}" y="${y + 3}" width="8" height="6" class="m-land"/>`).join(''),

function addProps(T, scene, list){
  for(const [name, x, z, r = 0, o = {}] of (list || [])){
    const g = new T.Group(); PROPS[name](T, g, o); g.position.set(x, 0, z); g.rotation.y = r; scene.add(g);
    if(name === 'door' || o.pass) g.userData.pass = true; // 通れる物（歩ける範囲から除かない）
    if(o.npc) (scene.userData.npcs = scene.userData.npcs || []).push({ g, name:o.npc, gate:name === 'gate', home:[x, z, r], exit:o.exit || null, fall:o.fall, state:null });
  }
}

// 明かり：fluo（蛍光灯）・warm（裸電球）・dim（ほぼ暗闇）。停電後は非常灯（赤）に変わる。gen:true は発電機があって停電しない
function addLights(T, scene, c, w, d, h){
  const amb = new T.AmbientLight(c.amb || 0x1c2433, c.ambI || (c.light === 'dim' ? 2.4 : 1.5)); scene.add(amb);
  const list = [];
  const spots = c.lamps || [[0, 0]];
  for(const [x, z] of spots){
    const col = c.light === 'warm' ? 0xffc880 : c.light === 'green' ? 0x40ff80 : 0xd8e4ec;
    const base = c.light === 'dim' ? 1.2 : 2.2;
    const tube = glow(T, c.light === 'warm' ? .16 : 1.2, .05, c.light === 'warm' ? .16 : .24, col, x, h - .06, z); scene.add(tube);
    const l = new T.PointLight(col, base, Math.max(w, d) * 1.3, 1.4); l.position.set(x, h - .4, z); scene.add(l);
    list.push({ tube, l, fl:flicker(l, base, c.light === 'warm' ? .02 : .06) });
  }
  const emer = new T.PointLight(0xff3020, 0, Math.max(w, d) * 1.6, 1.4); emer.position.set(-w / 2 + .4, h - .4, -d / 2 + .4); scene.add(emer);
  return (t, st) => {
    const on = c.gen || !st.blackout;
    list.forEach(({ tube, fl }) => { const f = fl(on); tube.material.color.setScalar(on ? .25 + .7 * f : .06); });
    emer.intensity = on ? 0 : 1.4 + Math.sin(t * 3) * .3;
  };
}

function buildRoom(T, scene, c){
  const [w, d, h] = c.size;
  scene.background = new T.Color(0x020304);
  scene.fog = new T.Fog(0x020304, Math.max(w, d) * .7, Math.max(w, d) * 2.4 + 6);
  const fl = FLOORS[c.floor || 'tile'];
  scene.add(flat(T, w, d, c.floorTex ? TM(T, c.floorTex, w / 2, d / 2) : psxMat(T, { map:tileTex(T, fl[0], fl[1], Math.max(1, w / 2), Math.max(1, d / 2)) }), 0, 0, 0));
  const wl = WALLS[c.wall || 'gray'];
  const wm = c.wallTex ? TM(T, c.wallTex, Math.max(w, d) / 1.6, h / 1.6, c.wallC) : psxMat(T, { map:wallTex(T, wl[0], wl[1], Math.max(1, w / 4), 1) });
  if(c.wallTex) scene.add(box(T, w, 1.3, .22, M(T, c.band || 0x2a4a7a), 0, .65, -d / 2 + .02), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), -w / 2 + .02, .65, 0), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), w / 2 - .02, .65, 0));
  scene.add(box(T, w, h, .2, wm, 0, h / 2, -d / 2), box(T, .2, h, d, wm, -w / 2, h / 2, 0), box(T, .2, h, d, wm, w / 2, h / 2, 0));
  scene.add(box(T, w, .1, d, M(T, 0x101214), 0, h + .05, 0));
  const side = c.camLeft ? -1 : 1;
  const camera = new T.PerspectiveCamera(c.fov || 74, RES_W / RES_H, .1, 80);
  camera.position.set(side * (w / 2 - .35), h - .25, d / 2 - .35);
  camera.lookAt(-side * w * .18, .4, -d * .22);
  addProps(T, scene, c.props);
  const lights = addLights(T, scene, c, w, d, h);
  return { camera, room:true, door:[side * (w / 2 - .6), d / 2 + 1.6], zone:[-w / 2 + .7, w / 2 - .7, -d / 2 + .7, d / 2 - .9], you:c.you || [-side * .3, d * .12], youFace:Math.PI, cross:null,
    update(t, st){ lights(t, st); } };
}

function buildOut(T, scene, c){
  const [w, d] = c.size;
  scene.background = c.day ? skyTex(T, c.night) : new T.Color(c.sky || 0x03050a);
  scene.fog = c.night ? new T.Fog(0x0b0f18, 10, 52) : new T.Fog(c.fogC || (c.day ? 0xb4b6ae : 0x05080c), c.fog ? c.fog[0] : 6, c.fog ? c.fog[1] : 26);
  const fl = FLOORS[c.floor || 'asphalt'];
  if(c.day) townGround(T, scene, c); else scene.add(flat(T, w, d, psxMat(T, { map:tileTex(T, fl[0], fl[1], w / 2, d / 2) }), 0, 0, 0));
  if(c.water){ const wt = flat(T, 80, 80, M(T, 0x0e1a20), 0, -.6, -20); scene.add(wt); }
  const camera = new T.PerspectiveCamera(c.fov || 70, RES_W / RES_H, c.day ? .8 : .1, c.day ? 140 : 90);
  camera.position.set(...(c.cam || [w / 2 - .5, 5, d / 2 - .5])); camera.lookAt(...(c.look || [0, .5, -d * .2]));
  addProps(T, scene, c.props);

  const lamps = (c.lamps || []).map(([x, y, z, col = 0xffd8a0]) => { const l = new T.PointLight(col, 3, 18, 1.3); l.position.set(x, y, z); scene.add(l); return flicker(l, 3, .04); });
  const flood = c.flood ? new T.SpotLight(0xffffe8, 4, 40, .5, .5, 1) : null;
  if(flood){ flood.position.set(...c.flood); scene.add(flood, flood.target); }
  const nav = c.day ? makeNav(T, scene, null, null, [-w / 2 - 4, -d / 2 - 3, w / 2 + 4, d / 2 + 3]) : null;
  return { camera, room:true, open:!!c.day, nav, indoor:c.indoor || null, door:c.door || [0, d / 2 + 1.8], enter:c.enter || null, zone:c.zone || [-w / 2 + 1, w / 2 - 1, -d / 2 + 1, d / 2 - 1.5], you:c.you || [0, d * .15], youFace:Math.PI, cross:null, hide:c.hide || null, hideFace:c.hideFace,
    update(t, st){ lamps.forEach(fl => fl(c.gen || !st.blackout)); if(flood) flood.target.position.set(Math.sin(t * .6) * 4, 0, -2); } };
}
