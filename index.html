*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-goth)}
body{min-height:100dvh}

.m-land{fill:#c96f4e;stroke:#2a2018;stroke-width:.7}

.m-label-here{fill:#b0281b}

.m-rose-ring{fill:#f3e8cc;stroke:#2a2018;stroke-width:.6;opacity:.9}
.m-rose{fill:#f3e8cc;stroke:#2a2018;stroke-width:.5}

.m-rose-t{fill:#22190f;font-size:7px;font-weight:bold;text-anchor:middle;font-family:serif}
.map svg *{pointer-events:none}
.map .m-pick,.map .m-go,.map .m-go *{pointer-events:auto;cursor:pointer}
.m-pick:hover{stroke:#b0281b}
.m-selected{fill:none;stroke:#b0281b;stroke-width:1.4}

.m-go{cursor:pointer}

.stat{flex:1;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--dim)}
.stat b{color:var(--text);font-weight:normal}
.stat .infect{color:var(--red)}
#cutscene{position:relative;max-width:640px;margin:0 auto;background:#000;aspect-ratio:16/9;overflow:hidden}
#cutscene[hidden],#cutscene.tucked{display:none}
#cutscene canvas{display:block;width:100%;height:100%;image-rendering:pixelated;filter:saturate(.7) contrast(1.15) brightness(1.08)}
#cutscene.glitch canvas{transform:translateX(3px) skewX(-2deg);filter:saturate(.2) contrast(1.6) brightness(1.4) hue-rotate(40deg)}
#cutscene::before{content:"";position:absolute;left:0;right:0;height:22%;top:-25%;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent);animation:cctv-roll 6s linear infinite;z-index:2}
#cutscene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65) 100%);z-index:2}
@keyframes cctv-roll{to{top:110%}}
.cctv-top,.cctv-bot{position:absolute;left:8px;right:8px;z-index:3;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#e8f0e0;text-shadow:0 0 3px #000,0 0 1px #000;letter-spacing:.05em;pointer-events:none}
.cctv-top{top:6px;display:flex;justify-content:space-between}
.cctv-top,.cctv-bot{opacity:0}

.cctv-bot{bottom:6px;display:flex;justify-content:space-between}
.cctv-top .rec{color:#ff4a3a;animation:cctv-blink 1s steps(2) infinite}
@keyframes cctv-blink{50%{opacity:0}}
#cutscene.alarm{outline:2px solid #c0392b;outline-offset:-2px}
.cctv-nosig{display:none;position:absolute;inset:0;z-index:4;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.2em;color:#ddd;background:repeating-radial-gradient(circle at 30% 40%,#222 0 1px,#555 1px 2px,#111 2px 3px);animation:cctv-static .15s steps(3) infinite}

@keyframes cctv-static{0%{background-position:0 0}50%{background-position:7px 3px}100%{background-position:-5px 6px}}
.tabs .me{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}

.planmap{margin:0 0 12px;border:1px solid #3a5a6a;border-radius:4px;background:#0c1418;padding:8px}

.pm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:#bcd4dc;font-size:14px}
.pm-tabs{display:flex;gap:4px}

.pm-tabs button.on{color:#e8f4f8;border-color:#8ac0d8}
.pm-room{fill:#101c22;stroke:#3a5a6a;stroke-width:1.5}
.pm-room.known{fill:#2a5a72}
.pm-room.pick{stroke:#e8c050;stroke-width:2.5;stroke-dasharray:5 3;cursor:pointer}
.pm-room.risk{stroke:#d0483a;stroke-width:2.5;stroke-dasharray:5 3}

.pm-room.known.nocam{fill:#24485a}
.pm-room.here{fill:#c04a3a;animation:pm-blink 1s steps(2) infinite}
@keyframes pm-blink{50%{fill:#7a2a20}}
.pm-door{fill:#0c1418}
.pm-name{fill:#e8f4f8;font-size:9px;text-anchor:middle;dominant-baseline:middle}
.pm-cam{fill:#e05a4a;font-size:7px;text-anchor:end}
.pm-exit{fill:#d8c070;font-size:8px;text-anchor:middle}
main{max-width:640px;margin:0 auto;padding:16px 30px 48px 16px}

.jump input{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:16px}
.jump button{flex:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:16px}
.result{margin-top:24px;border:1px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.8}
.tally{border-collapse:collapse;margin:8px 0 10px;width:100%;max-width:420px}.tally td{padding:3px 6px;border-bottom:1px solid #3a3528}.tally .num{text-align:right;font-variant-numeric:tabular-nums}
.help{margin:0 0 16px;font-size:12px;color:var(--dim);line-height:1.7;border:1px solid var(--line);border-radius:4px;padding:10px 12px}
/* 画面の右端のつまみ：押すと、映像・地図が横から出入りする */
.edgetab{position:fixed;right:0;z-index:9;writing-mode:vertical-rl;background:#15171c;color:#cfc7b4;border:1px solid #4a4436;border-right:0;border-radius:6px 0 0 6px;padding:10px 5px;font-size:13px;letter-spacing:.2em;line-height:1}
.edgetab.on{background:#3a3220;color:#f0d890;border-color:#a8780a}
#videoTab{top:58px}
#drawer,#fbDrawer{position:fixed;right:0;top:112px;z-index:8;width:min(94vw,560px);transform:translateX(100%);transition:transform .22s ease-out}
#drawer.open,#fbDrawer.open{transform:translateX(0)}
#drawer[hidden],#fbDrawer[hidden]{display:none}
#drawer .edgetab,#fbDrawer .edgetab{position:absolute;right:auto;left:-27px;top:0}
#fbBody{padding:12px 14px!important}
#drawerBody,#fbBody{max-height:calc(100dvh - 130px);overflow:auto;-webkit-overflow-scrolling:touch;background:#0a0b0e;border:1px solid #4a4436;border-right:0;border-radius:0 0 0 6px;padding:8px;box-shadow:-6px 0 18px rgba(0,0,0,.6)}
#drawerBody .map,#drawerBody .planmap{margin:0}
#top{overflow-x:clip}
#cutscene.slidein{animation:cut-in .22s ease-out}
#cutscene.slideout{transform:translateX(105%);transition:transform .22s ease-in}
@keyframes cut-in{from{transform:translateX(105%)}to{transform:none}}
/* タイトル・メニュー・操作説明（画面いっぱいに重ねる） */
#front{position:fixed;inset:0;z-index:40;background:#050607;color:var(--text);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
#front[hidden]{display:none}
#front::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
.fr-osd{position:relative;display:flex;justify-content:space-between;padding:12px 14px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;color:#b9c4b0}
.fr-osd .rec{color:#ff4a3a;animation:cctv-blink 1s steps(2) infinite}
.fr-in{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;margin:0 auto;padding:20px 22px 28px;box-sizing:border-box}
.fr-title{font-family:var(--f-mincho);font-size:clamp(30px,9vw,46px);line-height:1.15;letter-spacing:.04em;margin:0 0 14px;font-weight:600}
.fr-title small{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.3em;color:var(--red);margin-bottom:14px;font-weight:400}
.fr-sub{font-family:var(--f-mincho);font-size:15px;line-height:1.9;color:#bdb6a8;margin:0 0 30px}
.fr-btns{display:flex;flex-direction:column;gap:10px}
#front button{font-family:var(--f-goth);font-size:16px;line-height:1.5;text-align:left;padding:14px 16px;background:rgba(22,22,26,.92);color:var(--text);border:1px solid #4a4436;border-radius:6px;cursor:pointer}
#front button.main{border-color:var(--gold);color:var(--gold)}
#front button small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
#front button.plain{background:none;border:0;color:var(--dim);font-size:13px;padding:10px 0;text-align:center}
.fr-foot{position:relative;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#5d5a54;padding:0 14px 14px;letter-spacing:.06em}
.fr-h{font-family:var(--f-mincho);font-size:22px;margin:0 0 6px;font-weight:600}
.fr-lead{font-size:13px;color:var(--dim);line-height:1.8;margin:0 0 18px}
.fr-sec{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--dim);margin:22px 0 8px}
.fr-page{border:1px solid var(--line);border-radius:8px;background:rgba(22,22,26,.92);padding:18px 18px 8px;min-height:300px}
.fr-page h3{font-family:var(--f-mincho);font-size:20px;margin:0 0 4px;font-weight:600}
.fr-page .no{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.2em;color:var(--red);margin-bottom:8px}
.fr-page .need{display:inline-block;font-size:12px;color:var(--gold);border:1px solid #5a4a22;border-radius:99px;padding:1px 10px;margin:4px 0 12px}
.fr-page dl{margin:0}
.fr-page dt{font-size:14px;color:var(--gold);margin:14px 0 2px}
.fr-page dd{margin:0 0 12px;font-size:15px;line-height:1.85;color:#d9d3c7}
.fr-page a{color:var(--gold);word-break:break-all}
.fr-nav{display:flex;gap:10px;margin-top:12px}
.fr-nav button{flex:1;text-align:center!important}
.fr-nav button:disabled{opacity:.3}
.fr-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px}
.fr-dots button{width:30px;height:30px;padding:0!important;text-align:center!important;font-size:12px!important;border-radius:99px!important;color:var(--dim)!important}
.fr-dots button.on{border-color:var(--gold)!important;color:var(--gold)!important}
</style>

<body>
<div id="front" hidden></div>
<div id="top">
<header>
  <div class="bar"><div class="stat" id="stat"></div><div class="barbtns" id="barbtns"></div></div>
  <div class="tabs" id="tabs" hidden></div>
</header>
<div id="cutscene" hidden><canvas id="cutcanvas" width="320" height="180"></canvas><img id="cutstill" alt="" hidden><canvas id="osd" class="osd" width="320" height="180" aria-hidden="true"></canvas><div class="cctv-top"><span id="camName"></span><span class="rec">● REC</span></div><div class="cctv-bot"><span id="camTarget"></span><span id="camTime"></span></div><div class="cctv-nosig">NO SIGNAL</div></div>
</div>
<button class="edgetab" id="videoTab">映像</button>
<aside id="drawer" hidden><button class="edgetab" id="mapTab">地図</button><div id="drawerBody"></div></aside>
<aside id="fbDrawer" hidden><button class="edgetab" id="fbTab">意見</button><div id="fbBody"></div></aside>
<main id="main"></main>
<script>
'use strict';

// ===== 街 =====
const PLACES = { police:'警察署', hospital:'病院', shotengai:'メインストリート', subway:'地下鉄の駅', gas:'ガソリンスタンド', port:'港', mansion:'丘の上の洋館', mall:'ショッピングモール',
  home:'自宅', oak:'オーク通り', maple:'メープル通り', school:'リンカーン小学校', bridge:'ケスラー橋', depot:'配送センター', hosp:'州立グレンフォード病院', mainst:'メインストリート', church:'聖マルコ教会', road:'州道', res:'知事公邸', hq:'ホイットモア選挙事務所', car:'車の中', radio:'WGLNラジオ', factory:'ケスラー製鋼', hotel:'ホテル・グレンフォード', ps:'グレンフォード警察署', north:'ノースエンド', county:'マーロウ郡庁舎' };
// 歩いてかかる分数
const ADJ = {
  police:{ shotengai:20, subway:20, mansion:30 },
  hospital:{ shotengai:20, gas:30, mansion:30 },
  shotengai:{ police:20, hospital:20, subway:10, gas:20, mall:20 },
  subway:{ police:20, shotengai:10, port:30 },
  gas:{ hospital:30, shotengai:20, port:20, mall:15 },
  port:{ subway:30, gas:20 },
  mansion:{ police:30, hospital:30 },
  mall:{ shotengai:20, gas:15 },
};
const BASE_DANGER = { police:1, hospital:2, shotengai:2, subway:3, gas:1, port:1, mansion:2, mall:3 };
const DAWN = Infinity;          // 5:00 夜明け
const BLACKOUT = Infinity;       // 1:00 停電
const BRIDGE_OPEN = 120;   // 2:00
const DROP = 180;          // 3:00 ヘリが物資を落とす
const BRIDGE_CLOSE = 240;  // 4:00
const TURN_AFTER = 420;    // 噛まれてから発症まで
const INITIAL_ITEMS = {
  police:[{ name:'車の鍵', hidden:true }],
  hospital:[{ name:'薬', hidden:true }],
  shotengai:[{ name:'救急箱', hidden:true }],
  subway:[],
  gas:[{ name:'燃料', hidden:true }],
  port:[],
  mansion:[{ name:'救急箱', hidden:true }],
  mall:[{ name:'薬', hidden:true }],
};

const CHARS = {
  voter:{ name:'有権者', osd:'モーガン', place:'home', items:{}, clock:360, cam:'v_oak' },
  governor:{ name:'州知事', osd:'ホイットモア知事', place:'res', items:{}, clock:420, cam:'v_res' },
  chief:{ name:'警察署長', osd:'ブレナン署長', place:'ps', items:{ 拳銃:1, 弾:15 }, clock:390, cam:'v_ps' },
  director:{ name:'病院長', osd:'ハーラン院長', place:'hosp', items:{}, clock:390, cam:'v_hosp' },
};
const CHAR_IDS = Object.keys(CHARS);
const APP_VERSION = 'v0.2.4';
// テスト用の版（リリースで版の番号が入っていないもの）だけ、意見を書く欄を出す
const TEST_BUILD = APP_VERSION.startsWith('__'), BUILD = '__BUILD__';
const EMBED = /*EMBED*/null/*EMBED*/;
const FEEDBACK_REPO = 'kyunkyunpeachdisco-maker/joining-the-living-dead-feedback', FEEDBACK_KINDS = ['文章', '選択肢', '不具合', '追加の案', 'その他'];
const BOOKS = {};

// ===== 保存 =====
const BASE = 'jtld-election-';
// 部屋番号。招待リンクの # の後ろに付いてきたら、覚える
let room = (() => {
  try {
    const m = location.hash.match(/room=([A-Z2-9]{8})/);
    const r = location.hash.match(/[#&]r=([\w.-]+\/[\w.-]+)/), k = location.hash.match(/[#&]k=([A-Za-z0-9_]+)/), pk = location.hash.match(/[#&]pack=([\w.-]+\/[\w.-]+)/);
    const pt = location.hash.match(/[#&]pk=([A-Za-z0-9_]+)/);
    if(pk){ localStorage.setItem(BASE + 'pack', JSON.stringify(pk[1])); if(pt) localStorage.setItem(BASE + 'pack-key', JSON.stringify(pt[1])); else localStorage.removeItem(BASE + 'pack-key'); if(!m) history.replaceState(null, '', location.pathname + location.search); }
    if(r) localStorage.setItem(BASE + 'gh-repo', JSON.stringify(r[1]));
    if(k) localStorage.setItem(BASE + 'gh-pat', JSON.stringify(k[1]));
    if(m){ localStorage.setItem(BASE + 'room', JSON.stringify(m[1])); if(!/invite=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); }
    return JSON.parse(localStorage.getItem(BASE + 'room') || 'null');
  } catch(e){ return null; }
})();
if(room && !/^[A-Z2-9]{8}$/.test(room)) room = null;
const GLOBAL_KEYS = new Set(['pack', 'pack-cache', 'pack-key', 'pack-latest', 'pub-repo', 'room', 'room-kind', 'dev', 'dev-key', 'gh-repo', 'gh-pat', 'overlay', 'fb-token', 'fb-name', 'video', 'send-at']);
const keyOf = key => BASE + (room && !GLOBAL_KEYS.has(key) ? 'room-' + room + '-' : '') + key;
let roomApplying = false, roomTimer = 0;
let saveWarned = false;
// localStorage が使えない環境でも遊べるよう、メモリにも同じ内容を持っておく（その場合はページを閉じると消える）
const memory = {};
const store = {
  get(key, fallback){
    const k = keyOf(key);
    if(k in memory) return JSON.parse(memory[k]);
    try { const v = localStorage.getItem(k); if(v){ memory[k] = v; return JSON.parse(v); } }
    catch(e){}
    return fallback;
  },
  set(key, value){
    const k = keyOf(key);
    memory[k] = JSON.stringify(value);
    if(room && (key === 'world' || key.startsWith('player-'))) roomDirty();
    try { localStorage.setItem(k, memory[k]); }
    catch(e){ if(!saveWarned){ saveWarned = true; const note = 'この端末では進み具合を保存できません。ページを閉じると進み具合は消えます。'; console.warn(note); setTimeout(() => alert(note)); } }
  },
  remove(key){ const k = keyOf(key); delete memory[k]; try { localStorage.removeItem(k); } catch(e){} },
};

function newWorld(){
  return { events:[], items:JSON.parse(JSON.stringify(INITIAL_ITEMS)), once:{}, boatUsed:null, nextId:1 };
}
function newPlayer(id){
  const c = CHARS[id];
  return { char:id, book:id, para:BOOKS[id].start, place:c.place, clock:c.clock || 0, hp:3, lastCam:c.cam || null,
    items:{ ...c.items }, infected:false, turnAt:null, status:'active',
    flags:{}, seen:[], after:null, msg:'' };
}
function loadWorld(){ const w = store.get('world', null) || newWorld(); w.once = w.once || {}; return w; }
function loadPlayer(id){ return store.get('player-' + id, null) || newPlayer(id); }

// ===== 本から使う小道具 =====
function c(label, cost, to, extra = {}){ return { label, cost, to, ...extra }; }
function fmt(m){ const h = Math.floor(m / 60) % 24, mm = m % 60; return `${h}:${String(mm).padStart(2, '0')}`; }
function has(s, item, n = 1){ return (s.items[item] || 0) >= n; }
function addItem(s, item, n = 1){ s.items[item] = (s.items[item] || 0) + n; if(s.items[item] <= 0) delete s.items[item]; }
function addEvent(w, s, type, place, extra = {}){
  w.events.push({ id:s.char + ':' + w.nextId++, by:s.char, t:s.clock, type, place, ...extra });
}
function shoot(s, w){
  addItem(s, '弾', -1); addEvent(w, s, 'shot', s.place);
  // 銃声を聞きつけて、その場の化け物が増えることがある（着いたときに決まる数の上限まで）
  const z = zsHere(s);
  if(z && z.n < ZOMBIE_MAX && Math.random() < 0.3){
    z.n += 1;
    s.msg = (s.msg ? s.msg + '\n' : '') + '銃声を聞きつけて、もう一体が現れた。';
  }
}
function near(a, b){ return a === b || (ADJ[a] && b in ADJ[a]); }
function others(id){ return CHAR_IDS.filter(x => x !== id).map(loadPlayer); }
// 街の出来事：誰かが印を付けた時刻を、自分の時計が過ぎていれば見える
function setFlag(w, s, name){ addEvent(w, s, 'flag', s.place, { name }); }
function flag(s, w, name){ return w.events.some(e => e.type === 'flag' && e.name === name && e.t <= s.clock); }
// 一度きりの物：先に読んだ人が持っていく
function takeOnce(w, key, who){ if(w.once[key]) return false; w.once[key] = who; return true; }
function taken(w, key){ return !!w.once[key]; }

// 傷を負っても、感染したかどうかは本人にもわからない（確かめるには検査室で血液を調べる）
const INFECT_CHANCE = 0.5;
function bite(s){
  s.hp -= 1;
  s.wounds = (s.wounds || 0) + 1;
  (s.bites = s.bites || []).push(s.para);
  if(!s.infected && Math.random() < INFECT_CHANCE){ s.infected = true; s.turnAt = s.clock + TURN_AFTER; }
  return '襲われて、腕に傷を負った。\n噛まれたのか、引っかかれただけなのか……暗くて、よくわからない。';
}
function symptom(s){
  if(!s.wounds) return '';
  if(s.infected && s.turnAt - s.clock <= 45) return '熱が上がってきた。指先がしびれて、うまく動かない。';
  return '腕の傷のまわりが、じんじんと熱い。';
}
function biteRoll(s, chance){
  if(has(s, '防弾ベスト')) chance /= 2;
  return Math.random() < chance ? bite(s) : '';
}

// 橋とボート：感染していたら負けの結末へ。着く時刻が夜明けを過ぎていたら脱出にならない（s.clock は着いた時刻）
function carEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '車の鍵', -1);
  addEvent(w, s, 'escape', 'police', { by_car:true });
  return s.infected ? BOOKS[s.char].endings.carInfected : BOOKS[s.char].endings.car;
}
function boatEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '燃料', -1); w.boatUsed = s.char;
  addEvent(w, s, 'escape', 'port');
  return s.infected ? BOOKS[s.char].endings.boatInfected : BOOKS[s.char].endings.boat;
}
// 302号室の少女（23:10に噛まれた）：薬を打たれていなければ1:40、打たれていれば3:40に発症する
function girlTurned(s, w){
  if(flag(s, w, 'girl_cured')) return false;
  return s.clock >= (flag(s, w, 'girl_treated') ? 220 : 100);
}
// モールの防犯カメラ：ほかの人がいつモールの入口を通ったか
const LOOKS = { police:'制服の警官', doctor:'白衣の医者' };
function cameraLog(s, w){
  const ev = w.events.filter(e => e.type === 'pass' && e.place === 'mall' && e.by !== s.char && !e.npc && e.t <= s.clock).slice(-4);
  return ev.length ? ev.map(e => `${fmt(e.t)}　${LOOKS[e.by]}が映っている`).join('\n') : '映っているのは、ふらふらと歩く化け物だけだ。';
}
function boatEscape2(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '燃料', -1); w.boat2Used = s.char;
  addEvent(w, s, 'escape', 'port');
  return s.infected ? BOOKS[s.char].endings.boatInfected : BOOKS[s.char].endings.boat;
}
function bridgeOpen(s){ return (s.clock >= BRIDGE_OPEN && s.clock < BRIDGE_CLOSE) || (has(s, '通行証') && s.clock < DAWN); }

function danger(s, w){
  const p = s.place, t = s.clock;
  let d = BASE_DANGER[p] || 0;
  for(const e of w.events){
    if(e.t > t || e.t < t - 60) continue;
    if(e.type === 'shot' || e.type === 'noise') d += e.place === p ? 2 : (near(e.place, p) ? 1 : 0);
    if(e.type === 'horde' && e.place === p) d += 3;
  }
  if(p === 'police' && flag(s, w, 'police_barricade')) d -= 1;
  if(p === 'subway'){
    if(t >= BLACKOUT) d += 1;
    if(flag(s, w, 'subway_lights')) d -= 2;
    if(has(s, '懐中電灯')) d -= 1;
  }
  if(p === 'gas' && flag(s, w, 'gas_dark')) d -= 1;
  const humans = others(s.char).filter(o => o.status === 'active');
  if(humans.length){
    const ahead = t - Math.min(...humans.map(o => o.clock));
    if(ahead >= 120) d += 2; else if(ahead >= 60) d += 1;
  }
  return Math.max(0, d);
}

function radio(t){
  if(t < BLACKOUT) return '（ラジオ）「市民の皆さんは屋内にとどまってください。噛まれた方は、ただちに……」';
  if(t < BRIDGE_OPEN) return '（ラジオ）「避難の車列は、午前2時から4時まで橋を通します。徒歩での通行はできません」';
  if(t < DROP) return '（ラジオ）「橋の車列が動き始めました。検問では、全員の腕と首を確認します」';
  if(t < BRIDGE_CLOSE) return '（ラジオ）「救援物資を、メインストリートの屋上駐車場に投下しました」';
  return '（ラジオ）「橋は封鎖されました。夜明けとともに、ハロウベイ市内は処置されます。繰り返します……」';
}
const TIME_NOTICES = [];

const HUB_TEXT = {
  police:'ハロウベイ警察署のロビー。割れたガラス戸の向こうで、赤色灯が空回りしている。',
  hospital:'セント・アグネス病院の一階。非常灯だけが緑に光り、ストレッチャーが廊下をふさいでいる。',
  shotengai:'店のシャッターが下りたメインストリート。路地の奥で、何かを引きずる音がする。',
  subway:'地下鉄・ハロウベイ駅。止まったエスカレーターの下は真っ暗だ。線路づたいに港まで歩けるはずだ。',
  gas:'ハイウェイ沿いのガソリンスタンド。',
  port:'ハロウベイ港。黒い海から霧が上がってくる。',
  mansion:'丘の上の古い屋敷、旧ホロウェイ邸。百年以上前に海運王が建てた館を、セント・アグネス病院のホロウェイ博士が買い取って住んでいた。\n玄関ホールの吹き抜けで、割れたシャンデリアが揺れている。',
  mall:'ハイウェイ沿いのショッピングモール「ハロウベイ・モール」。自動ドアは割られ、吹き抜けの床にショッピングカートが転がっている。',
};

BOOKS.monster = {
  start:600,
  hubs:{},
  paras:{
    // 変わったあとの本（3人共通）。行き先は、その日に行くはずだった場所
    600:{ text:'指先の感覚がない。寒さも、もう感じない。\n\nどこへ行く途中だったのかが、出てこない。名前も出てこない。足だけが、歩道の継ぎ目の間隔を覚えている。',
      choices:[c('足の向くほうへ歩く', 0, 601), c('明かりのついた窓のほうを向く', 0, 602)] },
    601:{ text:s => '歩いた。\n\n前から来た女の人が、歩道の端へ寄った。目は合わせない。買い物袋を、体の反対側へ持ち替えただけだ。自転車の子どもが、ベルを鳴らさずによけていった。\n\n角を曲がるたびに、足が先に決めている。'
        + ({ voter:'\n\n体育館の屋根が見えてきた。入口から歩道まで、人が並んでいる。', governor:'\n\n青い風船が見えてきた。車寄せに、人が列を作っている。', chief:'\n\n赤い灯が回っているのが見えてきた。金網のフェンスと、見覚えのある車が何台か。', director:'\n\n番号の表示が光っている。長椅子に、人がおおぜい座っている。' })[s.char],
      choices:s => [c(({ voter:'列のいちばん後ろに立つ', governor:'列の前を歩いて、扉のほうへ行く', chief:'車のあいだを通って、玄関のほうへ行く', director:'長椅子のあいだを歩く' })[s.char], 0, ({ voter:s.clock >= 1200 ? 605 : 603, governor:606, chief:608, director:610 })[s.char])] },
    602:{ end:'monster-done', text:'庭の芝生を踏んで、窓の下まで行った。\n\nガラスの向こうで、テレビがついている。地図の上に、数字が3つ並んでいた。長椅子に、大人が2人と子どもが1人。子どもがこっちを指さした。\n\n母親が立ってきて、カーテンを引いた。カーテンの合わせ目から、テレビの光が細く漏れている。\n\nそのまま、そこに立っている。\n\n（ここまで）', choices:[] },
    603:{ text:'列のいちばん後ろに立った。\n\n前の男が、半歩だけ前へ詰めた。振り向かない。その前の人も、半歩詰めた。\n\n列が進む。足が、それに合わせて出る。黄色い立て札の脇を通った。「これより先、選挙運動を禁ず」。字は読めるが、何のことかはわからない。',
      choices:[c('列が進むのに合わせて、進む', 0, 604), c('前の男の襟のあたりへ、顔を寄せる', 0, 604, { run(s){ s.msg = '前の男は、振り向かずに列を出ていった。空いたところを、後ろから誰も詰めてこない。'; return 604; } })] },
    604:{ end:'monster-done', text:'扉のすぐ内側に、机があった。\n\n係員が顔を上げて、こっちの腕は見ずに、目を見た。それから、無線に短く何か言った。\n「すみません。こちらへ」\n\n黄色いベストの2人が、両側に立った。首に、柄のついた輪が掛かる。痛くはない。引かれるほうへ歩いた。\n\n教室だった。机を並べた囲いの中に、先に何人かいる。黒板に紙が貼ってあった。「保健局　待機室」。\n\n囲いに沿って歩く。廊下の向こうから、機械が紙を吸い込む音がときどき聞こえる。8時を過ぎると、その音もしなくなった。\n\n（ここまで）', choices:[] },
    605:{ end:'monster-done', text:'入口の扉は閉まっていた。列はもうない。歩道に、紙の小旗が1本落ちている。\n\nガラスに額をつけた。体育館の中で、係員が机をたたんでいる。ひとりがこっちに気づいて、隣の肩をたたいた。2人とも、すぐに机のほうへ向き直った。\n\n明かりが半分消えた。ガラスは冷たいはずだが、冷たくない。\n\n（ここまで）', choices:[] },
    606:{ text:'列の前を歩いた。\n\n手が何本も伸びてきて、途中で止まり、引っこんだ。誰かが、青い風船のひもを手首に結んでくれた。結び終わると、その人は列の後ろへ下がった。\n\nドアマンが、逆さに持っていたほうきの柄を下ろした。\n「知事」\n少し間があった。それから、ほうきを持ち直して、扉を開けた。',
      choices:[c('中へ入る', 0, 607)] },
    607:{ end:'monster-done', text:'じゅうたんの上を歩いた。明るい部屋に、丸いテーブルがいくつもある。正面の大きな画面で、数字が動いている。\n\n水の盆を持った若い男が、こっちを見て立ち止まり、盆を持ったままよけて通った。テーブルの人たちは、画面を見ている。\n\n肘を取られた。\n「知事、こちらへ」\n聞いたことのある声だ。引かれるほうへ歩いた。小さな部屋。長椅子と、鏡と、水差し。\n\n扉が閉まって、鍵の回る音がした。扉の向こうで、拍手が起きた。何に対する拍手かは、わからない。\n\n鏡の中に、青い風船が浮いている。\n\n（ここまで）', choices:[] },
    608:{ text:'車のあいだを通った。\n\n若い巡査が、パトカーの扉に手を掛けたまま、こっちを見ている。\n「署長」\n返事をしようとした。口は開いたが、音にならない。\n\n玄関から、もうひとり出てきた。帽子を取って、脇に挟んだ。それから、腰の手錠を外した。',
      choices:[c('立ったまま、待つ', 0, 609), c('玄関のほうへ、もう一歩出る', 0, 609, { run(s){ s.msg = '若い巡査が、警棒を横にして、胸の前に出した。押されはしなかった。足が止まった。'; return 609; } })] },
    610:{ end:'monster-done', text:'長椅子のあいだを歩いた。\n\n座っている人たちが、黙って足を引っこめる。窓口の中の女の人が、番号を呼びかけて、やめた。\n「院長」\n\n白い服の2人が、両側から腕を取った。ひとりは、前に何度も一緒に歩いたことのある歩幅だ。引かれるほうへ歩いた。\n\n小さな部屋。ベッドが1つ。戸が閉まって、外から掛け金の音がした。小窓の向こうで、誰かが紙を貼っている。字は裏から透けて見えるが、読み方が出てこない。\n\n（ここまで）', choices:[] },
    609:{ end:'monster-done', text:'左の手首に、手錠が掛かった。もう片方の輪は、金網のフェンスに掛けられた。\n\n「決まりですので」と、帽子を脇に挟んだ男が言った。それから帽子をかぶり直して、敬礼をした。若い巡査も、遅れて敬礼をした。\n\nフェンスには、ほかにも手錠がいくつか下がっている。空のものも、そうでないものもある。\n\n無線の声が、車の中から聞こえる。数を読み上げている。その数が何の数だったかは、もう出てこない。\n\n（ここまで）', choices:[] },
  },
};
</script>
<script src="book-voter.js"></script>
<script src="book-governor.js"></script>
<script src="book-chief.js"></script>
<script src="book-director.js"></script>
<script>
'use strict';

// ===== 足した本（キャラ） =====
// 追加分（overlay.books[名前]）と、この端末の下書き（draft-books）から作る。街の歩き方（場所・つながり・ゾンビの数）と見た目は、もとにする本（like）から借りる
// 1冊：{ name 名前, osd 映像に出る呼び名, like もとにする本, start 始まる場所, clock 始まる時刻（分）, base 段落の番号の初め（7000 から、200 ずつ） }
function addBook(id, x){
  if(!/^[a-z]{3,12}$/.test(id) || CHARS[id] || BOOKS[id] || !x || !CHARS[x.like] || CHARS[x.like].dyn || !(x.base >= 7000 && x.base < 9000 && x.base % 200 === 0)) return;
  const L = BOOKS[x.like], base = x.base, spots = {}, safe = (f, d) => (s, w, a) => { try { const v = f(s, w, a); return v == null ? d : v; } catch(e){ return d; } };
  let i = 0;
  for(const [k, sp] of Object.entries(L.spots || {})){
    if(i >= 190) break;
    spots[k] = { no:base + i++, name:sp.name, short:sp.short, place:sp.place, map:sp.map, cam:sp.cam, room:sp.room, at:sp.at, label:sp.label, inside:sp.inside, hide:sp.hide, calm:sp.calm, path:sp.path, free:sp.free, go:sp.go,
      adj:typeof sp.adj === 'function' ? safe(sp.adj, []) : sp.adj, z:typeof sp.z === 'function' ? safe(sp.z, 0) : sp.z, block:typeof sp.block === 'function' ? safe(sp.block, []) : sp.block,
      run:{ ok:'走って、抜けた。', hit:'走って抜けるところを、つかまれた。' }, text:sp.name + '。', extra:s => dynExtra(s, base) };
  }
  const start = spots[x.start] ? x.start : Object.keys(spots)[0], name = String(x.name || id).slice(0, 12);
  BOOKS[id] = { start:spots[start].no, hubs:{}, noJump:true, spots, map:L.map, maps:L.maps, wound:() => '腕に、歯の形の傷がついた。', endings:{ stranded:base + 199 },
    planZ:Object.fromEntries(Object.entries(L.planZ || {}).map(([k, f]) => [k, safe(f, [])])),
    paras:{ [base + 199]:{ end:'done', text:name + 'の一日は、ここまで。', choices:[] } } };
  CHARS[id] = { name, osd:String(x.osd || name).slice(0, 16), place:spots[start].place, items:{}, clock:Math.max(300, Math.min(1200, Number(x.clock) || 420)), cam:spots[start].cam || CHARS[x.like].cam, dyn:true, like:x.like };
  CHAR_IDS.push(id);
}
// 足した本の、どの場所にもある選択肢：時間を進める・一日を終える
function dynExtra(s, base){
  const next = PERIODS.find(t => t > s.clock);
  return [
    ...(next ? [c('しばらく、ここにいる', 0, 0, { run(s){ s.clock = next; s.msg = fmt(next) + 'になった。'; return s.para; } })] : []),
    ...(s.clock >= 1140 ? [c('今日は、ここまでにする', 0, base + 199)] : []),
  ];
}
const DYN_BOOKS = (() => { try { const o = EMBED || (store.get('pack', '') && store.get('pack-cache', null)) || store.get('overlay', null) || {}; return { ...(o.books || {}), ...store.get('draft-books', {}) }; } catch(e){ return {}; } })();
for(const [id, x] of Object.entries(DYN_BOOKS)) try { addBook(id, x); } catch(e){}
// 決まった形の段落（拠点・遭遇）を本に登録する
for(const id of [...CHAR_IDS, 'monster']){
  const book = BOOKS[id];
  for(const [place, no] of Object.entries(book.hubs)) book.paras[no] = { hub:place, monster:id === 'monster' };
  if(book.enc) book.paras[book.enc] = { encounter:true };
}
const PERIODS = [510, 690, 810, 960, 1140], PERIOD_NAMES = ['朝', '午前', '昼', '午後', '夕方', '夜'];
function periodOf(t){ return PERIODS.filter(b => t >= b).length; }
// まだ前の時間帯にいる人（本を開いたことのない人と、結末まで行った人は数えない）
// 部屋では、いちばん遅れている人より gap 分より先へ行くと、相手が追いつくまで待つ（gap が 0 なら、時間帯の区切りで待つ）
const roomGap = () => (room ? Number(store.get('gap', 0)) || 0 : 0);
function behind(s){
  const mine = periodOf(s.clock), gap = roomGap(), ats = room ? store.get('ats', {}) : {}, skipped = s.skipped || {};
  return others(s.char).filter(o => o.status === 'active' && (o.history || []).length
    && (gap ? o.clock + gap < s.clock : periodOf(o.clock) < mine)
    && !(skipped[o.char] != null && skipped[o.char] >= (ats[o.char] || 0))); // 待たずに進むと決めた相手は、その人がまた動くまで数えない
}
function bookOf(s){ return BOOKS[s.book]; }
function paraOf(s){ return bookOf(s).paras[s.para]; }
function hubNo(s, place){ return bookOf(s).hubs[place]; }

// ===== 拠点の選択肢 =====
// 拠点の画面は3段に分ける：最初は「調べる」「持ち物」「移動する」（と脱出）だけ
function hubChoices(s, w, place){
  const explore = [], items = [], exits = [], moves = [];
  const id = s.char;
  const back = () => hubNo(s, place);
  for(const ch of (BOOKS[id].hubExtra?.[place] || [])) if(!ch.cond || ch.cond(s, w)) explore.push(ch);

  w.items[place].forEach((it, idx) => {
    if(it.hidden || (it.t || 0) > s.clock) return; // 置かれた時刻より前にいる人には見えない
    explore.push({ label:`置いてあった${it.name}を拾う`, cost:0, run(s, w){
      const i = w.items[place].findIndex((x, j) => j === idx && !x.hidden && x.name === it.name);
      if(i >= 0){
        const [got] = w.items[place].splice(i, 1);
        if(got.sample) (s.samples = s.samples || []).push(got.sample); else addItem(s, got.name);
        s.msg = `${got.name}を拾った。`;
      }
      return back();
    } });
  });

  if(!s.flags['searched_' + place]){
    explore.push({ label:'辺りを探す（30分）', cost:30, run(s, w){
      s.flags['searched_' + place] = 1;
      const found = w.items[place].filter(i => i.hidden);
      w.items[place] = w.items[place].filter(i => !i.hidden);
      found.forEach(i => addItem(s, i.name));
      addEvent(w, s, 'search', place, found.length ? { took:true } : {});
      s.msg = found.length ? `${found.map(i => i.name).join('、')}を見つけた。` : 'めぼしい物は見つからなかった。';
      return back();
    } });
  }

  // 血液：傷を負った人は採血して置いていける。医者だけが病院の検査室で調べられる
  if(id === 'doctor' && place === 'hospital'){
    if(s.wounds) explore.push({ label:'検査室で、自分の血を調べる（15分）', cost:15, area:'研究棟', run(s){
      s.msg = `検査の結果：${s.infected ? '陽性。あなたは感染している。' : '陰性。あなたは感染していない。'}`;
      return back();
    } });
    (s.samples || []).forEach((smp, i) => explore.push({ label:`検査室で、${smp.name}を調べる（15分）`, cost:15, area:'研究棟', run(s){
      s.samples.splice(i, 1);
      s.msg = `${smp.name}の検査結果：${smp.infected ? '陽性。感染している。' : '陰性。感染していない。'}`;
      return back();
    } }));
  }
  if(s.wounds){
    items.push({ label:'採血して、血液をここに置いていく（5分）', cost:5, run(s, w){
      const name = `血液（${CHARS[id].name}・${fmt(s.clock)}）`;
      w.items[place].push({ name, hidden:false, by:id, t:s.clock, sample:{ name, infected:s.infected } });
      addEvent(w, s, 'drop', place); s.msg = `${name}を、ここに置いた。`;
      return back();
    } });
  }

  // 感染していなくても打てる（打っても無駄になるだけ）。効いたかどうかは本人にもわからない
  if(s.wounds && has(s, '血清')){
    items.push({ label:'自分に血清を打つ（5分）', cost:5, run(s){
      addItem(s, '血清', -1); s.infected = false; s.turnAt = null;
      s.msg = '血清を打った。……感染していたのなら、これで助かったはずだ。';
      return back();
    } });
  }
  if(s.wounds && has(s, '薬')){
    items.push({ label:'自分に薬を打つ（5分）', cost:5, run(s){
      addItem(s, '薬', -1); if(s.infected) s.turnAt += CHARS[id].medDelay;
      s.msg = '薬を打った。感染していたのなら、発症を遅らせられたはずだ。';
      return back();
    } });
  }
  if(s.hp < 3 && id === 'doctor'){
    items.push({ label:'自分の傷を手当てする（20分）', cost:20, run(s){ s.hp += 1; s.msg = '傷を縫って包帯を巻いた。'; return back(); } });
  }
  if(s.hp < 3 && has(s, '救急箱')){
    items.push({ label:'救急箱を使う（10分）', cost:10, run(s){ addItem(s, '救急箱', -1); s.hp += 1; s.msg = '救急箱で傷の手当てをした。'; return back(); } });
  }
  for(const [item, n] of Object.entries(s.items)){
    if(n <= 0) continue;
    items.push({ label:`${item}を1つ、ここに置いていく`, cost:0, run(s, w){
      addItem(s, item, -1); w.items[place].push({ name:item, hidden:false, by:id, t:s.clock });
      addEvent(w, s, 'drop', place); s.msg = `${item}をここに置いた。`;
      return back();
    } });
  }

  // 出口
  if(place === 'police' && has(s, '車の鍵')){
    if(bridgeOpen(s)) exits.push({ label:'パトカーで橋へ向かう（15分）', cost:15, run(s, w){
      return taken(w, 'car_cleared') ? carEscape(s, w) : BOOKS[id].carScene;
    } });
    else if(s.clock < BRIDGE_OPEN) exits.push({ label:'パトカーで橋へ向かう（橋が開くのは2時から）', disabled:true });
    else exits.push({ label:'パトカーで橋へ向かう（橋は4時に封鎖された）', disabled:true });
  }
  if(place === 'port' && has(s, '燃料') && !w.boatUsed && s.clock + 20 < DAWN){
    exits.push({ label:'ボートに燃料を入れて沖へ出る（20分）', cost:20, run:(s, w) => boatEscape(s, w) });
  }

  const bike = has(s, '自転車');
  for(const [to, min] of Object.entries(ADJ[place])){
    const m = bike ? Math.max(5, Math.ceil(min / 10) * 5) : min;
    moves.push({ label:`${PLACES[to]}へ（${m}分${bike ? '・自転車' : ''}）`, cost:m, move:true, dest:to, run(s, w){
      s.place = to; addEvent(w, s, 'pass', to);
      s.visited = s.visited || [];
      if(!s.visited.includes(to)) s.visited.push(to);
      return hubNo(s, to);
    } });
  }

  const menu = (label, to) => ({ label, cost:0, menu:to, run(s){ s.menu = to; return back(); } });
  const m = s.menu || '';
  if(m === 'explore'){
    // 部屋が多い場所は、まとまり（1階・地下など）ごとに分ける
    const areas = [...new Set(explore.filter(ch => ch.area).map(ch => ch.area))];
    return [
      ...areas.map(a => menu(`${a}（${explore.filter(ch => ch.area === a).length}）`, 'explore:' + a)),
      ...explore.filter(ch => !ch.area),
      menu('← 戻る', null),
    ];
  }
  if(m.startsWith('explore:')){
    const a = m.slice(8);
    return [...explore.filter(ch => ch.area === a), menu('← 戻る', 'explore')];
  }
  if(m === 'items') return [...items, menu('← 戻る', null)];
  if(m === 'move') return [...moves, menu('← 戻る', null)];
  return [
    ...exits,
    ...(explore.length ? [menu('この場所を調べる', 'explore')] : []),
    ...(items.length ? [menu('持ち物', 'items')] : []),
    menu('ほかの場所へ移動する', 'move'),
  ];
}

function monsterChoices(s, w, place){
  const list = [{ label:'ここに群れを呼び集める（30分）', cost:30, run(s, w){
    addEvent(w, s, 'horde', place); s.msg = `${PLACES[place]}に群れが集まってきた。しばらくは、生きた人間には近寄れない場所になる。`;
    return hubNo(s, place);
  } }];
  for(const to of Object.keys(ADJ[place])){
    list.push({ label:`${PLACES[to]}へさまよう（10分）`, cost:10, run(s){ s.place = to; return hubNo(s, to); } });
  }
  list.push({ label:'動かずに夜明けを待つ', cost:0, run(s){ s.clock = DAWN; return 699; } });
  return list;
}

function encounterChoices(s){
  const back = () => s.after || hubNo(s, s.place);
  const calm = alert => { const z = zsHere(s); if(z){ z.aware = false; z.alert = alert; } };
  const list = [];
  if(s.char === 'police' && has(s, '弾')){
    list.push({ label:'撃つ（弾1発）', cost:5, run(s, w){
      shoot(s, w);
      const heard = s.msg; // 銃声で化け物が増えたときの知らせ
      const z = zsHere(s);
      if(z && z.aware){
        z.n = Math.max(0, z.n - 1); z.aware = z.n > 0;
        s.msg = z.n ? `一体の頭を撃ち抜いた。だが銃声で、残りの${z.n}体もこちらへ向かってくる！` : '最後の一体を撃ち倒した。銃声が夜に響いた。';
      } else s.msg = '一発で頭を撃ち抜いた。銃声が夜に響いた。';
      if(heard) s.msg += '\n' + heard;
      return back();
    } });
  }
  list.push({ label:'走って逃げる（10分）', cost:10, run(s){ s.msg = biteRoll(s, 0.35) || 'なんとか振り切った。'; calm(50); return back(); } });
  list.push({ label:'物陰に隠れてやり過ごす（30分）', cost:30, run(s){ s.msg = biteRoll(s, 0.15) || '息を殺しているうちに、足音は遠ざかった。'; calm(20); return back(); } });
  return list;
}

function choicesOf(s, w){
  const p = paraOf(s);
  if(p.spot) return spotChoices(s, w);
  if(p.hub) return p.monster ? monsterChoices(s, w, p.hub) : hubChoices(s, w, p.hub);
  if(p.encounter) return encounterChoices(s);
  const list = typeof p.choices === 'function' ? p.choices(s, w) : (p.choices || []);
  return list.filter(ch => !ch.cond || ch.cond(s, w));
}

// ===== 進める =====
function go(s, w, target){
  s.para = target;
  const p = paraOf(s);
  if(!p) throw new Error(`段落 ${target} が見つかりません（${s.book}）`);
  if(p.time != null) s.clock = Math.max(s.clock, typeof p.time === 'function' ? p.time(s) : p.time);
  if(p.place) s.place = p.place;
  if(p.enter) p.enter(s, w);
  if(p.end) s.status = typeof p.end === 'function' ? p.end(s) : p.end;
}
function isEnd(s, target){ return !!bookOf(s).paras[target]?.end; }

// ===== その場にいる化け物（気づかれているかどうか） =====
// 場所に着いたときに数を決める。その場で過ごした時間と物音で、少しずつ気づかれていく（100で気づかれる）
const ALERT_PER_MIN = 1.5; // 化け物1体・1分あたり
const ZOMBIE_SPOT = { police:'ロビーの奥', hospital:'廊下の先', shotengai:'通りの向こう', subway:'ホームの端', gas:'給油機の陰', port:'桟橋の先', mansion:'階段の下', mall:'吹き抜けの下' };
const ZOMBIE_MAX = 4;
function arriveZombies(s, w){
  const n = Math.max(0, Math.min(ZOMBIE_MAX, Math.round(danger(s, w) * .6 - .4 + Math.random() * .8)));
  s.zs = { place:s.place, n, alert:0, aware:false };
}
function zsHere(s){ return s.zs && s.zs.place === s.place ? s.zs : null; }
function zombieLine(s){
  const z = zsHere(s);
  if(!z || !z.n) return '辺りに、化け物の姿は見えない。';
  let t = `${ZOMBIE_SPOT[s.place]}で、化け物が${z.n}体うろついている。まだこちらに気づいていない。`;
  if(z.alert >= 60) t += '\nそのうち1体が、ときどきこちらを気にしている。';
  return t;
}

// 時計が進んだあとの判定：発症・体力切れなら化け物の本へ、夜明けなら間に合わなかった結末へ（どちらでもなければ null）
function fateTarget(s){
  if(s.hp <= 0 || (s.infected && s.clock >= s.turnAt)){
    if(!(s.infected && s.clock >= s.turnAt)) s.msg = (s.msg ? s.msg + '\n' : '') + '力尽きて倒れたところを、化け物に噛まれた。';
    s.book = 'monster'; s.status = 'monster'; s.hp = 3; s.after = null; return CHARS[s.char].dyn ? 602 : 600;
  }
  if(s.clock >= DAWN) return BOOKS[s.char].endings.stranded;
  return null;
}

function act(choice){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  if(s.status === 'active' && behind(s).length) return;
  const wasEncounter = !!paraOf(s).encounter;
  if(choice.menu !== undefined){ // 画面の段を切り替えるだけ（時間は進まない）
    choice.run(s); store.set('player-' + current, s); render(); return;
  }
  pushUndo(w, s);
  record(s, choice.label);
  s.offcam = false; s.pose = null; s.spos = null; s.scam = null;
  // 出ていくときの足の運び：選択肢に決まりがなければ、その場の様子で決める（気づかれていれば走る、気づかれていないゾンビがいれば忍び足）
  const spB = s.book !== 'monster' ? spotOf(s) : null, zB = spB && !spB.calm ? spotZ(s, w, spB) : 0;
  const exitGait = gaitOf(choice) || sceneStageOf(s).gait || (zB ? (s.aware === paraOf(s).spot ? 'run' : 'sneak') : null);
  const camBefore = camFor(s), placeBefore = s.place, blindBefore = inBlindSpot(s);
  const zBefore = paraOf(s).hub && s.book !== 'monster' ? zsHere(s) : null;
  s.menu = null;
  selectedBlock = null;
  s.msg = '';
  s.clock += choice.cost || 0;
  let target = choice.run ? choice.run(s, w) : choice.to;
  if(wasEncounter) s.after = null;
  // 拠点で時間を使うと、その場の化け物に気づかれていく。その場で撃てば、すぐ気づかれる
  if(zBefore && zBefore.n && !zBefore.aware && !choice.move && s.place === zBefore.place){
    zBefore.alert += (choice.cost || 0) * zBefore.n * ALERT_PER_MIN;
    if(w.events.some(e => e.type === 'shot' && e.by === s.char && e.place === s.place && e.t === s.clock)) zBefore.alert = 100;
    if(zBefore.alert >= 100) zBefore.aware = true;
  }
  if(s.book !== 'monster' && !zsHere(s)) arriveZombies(s, w);
  const toHub = !!BOOKS[s.book].paras[target]?.hub;

  if(s.book !== 'monster' && s.status === 'active' && !isEnd(s, target)){
    const fate = fateTarget(s);
    if(fate){
      target = fate;
    } else if(zsHere(s)?.aware && (zBefore || toHub || wasEncounter)){
      s.after = target; target = BOOKS[s.char].enc;
    } else if(choice.move && Math.random() < Math.min(0.6, danger(s, w) * 0.06)){
      s.after = target; target = BOOKS[s.char].enc;
    }
  }
  if(s.book === 'monster' && s.clock >= DAWN) target = 699;
  go(s, w, target);
  if(s.book !== 'monster' && !s.moved && !choice.risky && !choice.shot) spotLinger(s, w);
  s.moved = false;
  if(s.book === 'monster' && target === 699) s.status = 'monster-done';
  const blindAfter = inBlindSpot(s);
  markRoom(s);
  if(!blindAfter) s.lastCam = camFor(s);
  if(videoOn && Cut.built && Cut.raf && !Cut.built.plan && !isEnd(s, target)){
    const b = Cut.built, moved = s.place !== placeBefore;
    if(camFor(s) !== camBefore){
      // 別のカメラへ：行き先の方向へ歩いて出ていく（カメラのない部屋から出てきたときは、もう映っていないので歩かない）
      Cut.exitTo = (moved && b.exits?.[s.place]) || b.door || [0, -4];
      Cut.exitStart = blindBefore ? 0 : performance.now();
      setExitGait(exitGait);
      Cut.arrive = { from:moved ? placeBefore : null };
    } else if(!blindBefore && blindAfter){
      // 同じカメラのまま、カメラのない部屋へ：扉へ歩いて消える
      if(!b.open){ Cut.exitTo = b.door || [0, -4]; Cut.exitStart = performance.now(); setExitGait(exitGait); }
    } else if(blindBefore && !blindAfter && Cut.actors){
      // カメラのない部屋から戻る：扉から現れる
      Cut.exitStart = 0; Cut.actors.enterFrom = b.enter || b.door || null; Cut.actors.enterStart = performance.now();
    }
  }

  sendStat(s);
  store.set('world', w); store.set('player-' + current, s);
  render();
  window.scrollTo(0, 0);
}
function sendStat(s){
  if(!TEST_BUILD || !room || s.statSent || s.status === 'active' || s.status === 'monster') return;
  s.statSent = 1;
  const body = { build:BUILD, char:s.char, end:String(s.status), clock:s.clock, hp:s.hp, infected:!!s.infected, turned:s.book === 'monster', bites:s.bites || [], inRoom:!!room,
    path:(s.history || []).slice(-400).map(h => [h.para, String(h.chosen || '').slice(0, 30)]) };
  roomFetch(ROOM_DB + '_stats/' + DEV + '-' + Date.now().toString(36) + '.json', { method:'PUT', body:JSON.stringify(body) }).catch(() => {});
}

function tryJump(n){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  const p = paraOf(s);
  pushUndo(w, s);
  record(s, `番号 ${n} を打ち込んだ`);
  s.msg = '';
  if(p.jumps && p.jumps.includes(n)) go(s, w, n);
  else {
    s.clock += 5; s.msg = '何も起きない。（5分が過ぎた）';
    const fate = s.book !== 'monster' && s.status === 'active' ? fateTarget(s) : null;
    if(fate) go(s, w, fate);
  }
  store.set('world', w); store.set('player-' + current, s);
  render();
}

// ===== 気配（ほかの人の出来事が届く）とすれ違いの跡 =====
function collectNotices(s, w){
  const out = [];
  for(const [t, text] of TIME_NOTICES){
    if(s.clock >= t && !s.flags['notice_' + t]){ s.flags['notice_' + t] = 1; out.push(text); }
  }
  for(const e of w.events){
    if(s.seen.includes(e.id) || e.t > s.clock) continue;
    if(e.by === s.char && !e.npc) continue;
    s.seen.push(e.id);
    const where = PLACES[e.place];
    if(e.type === 'shot'){
      out.push(e.place === s.place ? 'すぐ近くで銃声がした！' : near(e.place, s.place) ? `${where}の方から銃声が響いた。化け物の群れが、そちらへ流れていく。` : '遠くで、かすかに銃声がした。');
    } else if(e.type === 'noise'){
      out.push(e.text || `${where}の方で、大きな音がした。`);
    } else if(e.type === 'horde' && near(e.place, s.place)){
      out.push(`${where}の方で、化け物の群れが騒いでいる。`);
    } else if(e.type === 'escape'){
      out.push(e.by_car ? '遠くで、車のエンジン音が橋のほうへ遠ざかっていった。' : '港のほうから、ボートのエンジン音が聞こえた。');
    } else if(e.type === 'pass' && s.book === 'monster' && near(e.place, s.place) && s.clock - e.t <= 60){
      out.push(`${where}から、生きた人間のにおいがする。`);
    } else if(e.type === 'flag' && e.notice && near(e.place, s.place)){
      out.push(e.notice);
    }
  }
  return out;
}

function traces(s, w, place){
  const kinds = new Set();
  let robbed = false;
  for(const e of w.events){
    // 一つしかない物は、実際に先に取った人のもの。取られた跡は街の時刻に関係なく残る
    if(e.took && e.place === place && e.by !== s.char) robbed = true;
    if(e.place !== place || e.t >= s.clock || (e.by === s.char && !e.npc)) continue;
    if(e.type === 'pass' && s.clock - e.t > 90) continue;
    kinds.add(e.type);
  }
  const t = [];
  if(kinds.has('shot')) t.push('床に薬莢が転がっている。誰かがここで撃ったらしい。');
  if(kinds.has('search') || robbed) t.push('棚や引き出しが荒らされている。誰かが先に探し回った後だ。');
  if(kinds.has('pass')) t.push('濡れた足跡が新しい。少し前に、誰かがここを通ったようだ。');
  if(kinds.has('horde')) t.push('壁に爪の跡。化け物の群れが通った跡だ。');
  for(const it of w.items[place]) if(!it.hidden && (it.t || 0) <= s.clock) t.push(`誰かが置いていった${it.name}がある。`);
  if(place === 'port') t.push(w.boatUsed ? '桟橋のボートは、もうない。' : '桟橋に小さなボートが一艘つながれている。燃料は空だ。');
  if(place === 'gas') t.push(flag(s, w, 'gas_dark') ? '給油機の明かりは消えていて、スタンドは闇に沈んでいる。' : s.clock < BLACKOUT ? '給油機の明かりだけが、ぽつんと夜に浮いている。' : '停電で、給油機の明かりも消えている。');
  if(place === 'subway' && flag(s, w, 'subway_lights')) t.push('ホームから線路の奥へ、非常灯が点々と灯っている。');
  return t;
}

// ===== 地図：番号付きの街区がびっしり並ぶ古い市街図。行っていない地区は白地図 =====
const MAP_W = 400, MAP_H = 320;
// 主な場所。地区ごとに通りの向き（angle）と区画の大きさ（cw, ch）を変える
const LANDMARKS = {
  mansion:{ x:200, y:38, label:'洋館', district:'N', angle:15, cw:11, ch:9 },
  police:{ x:80, y:100, label:'警察署', district:'W', angle:8, cw:13, ch:10 },
  subway:{ x:74, y:212, label:'地下鉄の駅', district:'W', angle:-12, cw:12, ch:9 },
  shotengai:{ x:196, y:156, label:'メインストリート', district:'C', angle:0, cw:14, ch:9 },
  hospital:{ x:318, y:96, label:'病院', district:'E', angle:20, cw:13, ch:10 },
  mall:{ x:254, y:222, label:'モール', district:'SE', angle:-24, cw:15, ch:11 },
  gas:{ x:332, y:236, label:'スタンド', district:'SE', angle:32, cw:12, ch:9, below:true },
  port:{ x:186, y:280, label:'港', district:'H', angle:4, cw:17, ch:8 },
};
const DISTRICTS = {
  N:{ name:'北', x:268, y:52 }, W:{ name:'西', x:46, y:160 }, C:{ name:'中央', x:238, y:178 },
  E:{ name:'東', x:364, y:140 }, SE:{ name:'南東', x:290, y:268 }, H:{ name:'港', x:112, y:306 },
};
const coastY = x => 287 + 6 * Math.sin(x / 26) + (x > 150 && x < 225 ? 5 : 0);
const riverX = y => 28 + 4 * Math.sin(y / 34);
function mapZone(x, y){
  if(x < riverX(y)) return 'river';
  if(y > coastY(x)) return 'sea';
  if(Math.hypot((x - 200) / 58, (y - 36) / 33) < 1) return 'hill';
  if(Math.hypot((x - 136) / 20, (y - 190) / 14) < 1) return 'park';
  return 'land';
}
function nearestPlace(x, y){
  let best = null, bd = Infinity;
  for(const [k, l] of Object.entries(LANDMARKS)){ const d = Math.hypot(x - l.x, y - l.y); if(d < bd){ bd = d; best = k; } }
  return best;
}
// 毎回同じ形になるよう、決まった値で揺らす
const hash = (a, b, c) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
// 点の列を、なめらかな曲線のパスにする
function smoothPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const MAP_ROADS = [
  { name:'メインストリート', cls:'main', pts:[[0,93],[40,95],[80,100],[132,126],[196,156],[256,128],[318,96],[400,78]] },
  { name:'駅前通り', cls:'sub', pts:[[80,100],[68,152],[74,212]] },

  { name:'丘の坂', cls:'sub', pts:[[196,156],[232,124],[204,104],[236,80],[214,60],[200,38]] },

];

// 街区は一度だけ作る。番号は地区ごとに、上の列から左から右へ 1 番から振る（住所＝地区名＋番号）
const DISTRICT_ORDER = ['N', 'W', 'C', 'E', 'SE', 'H'];
const MAP_BLOCKS = (() => {
  const list = [];
  for(const [owner, l] of Object.entries(LANDMARKS)){
    const ca = Math.cos(l.angle * Math.PI / 180), sa = Math.sin(l.angle * Math.PI / 180);
    const toMap = (a, b) => [l.x + ca * a - sa * b, l.y + sa * a + ca * b];
    const R = 420;
    for(let i = -Math.ceil(R / l.cw); i <= Math.ceil(R / l.cw); i++){
      for(let j = -Math.ceil(R / l.ch); j <= Math.ceil(R / l.ch); j++){
        const wide = i % 2 === 0 && hash(i, j, l.angle) < 0.3;
        if(i % 2 !== 0 && (i - 1) % 2 === 0 && hash(i - 1, j, l.angle) < 0.3) continue; // 左隣とつながった大きな区画
        const w = wide ? 2 : 1;
        const gap = 1.5;
        const pts = [[i * l.cw + gap, j * l.ch + gap], [(i + w) * l.cw - gap, j * l.ch + gap], [(i + w) * l.cw - gap, (j + 1) * l.ch - gap], [i * l.cw + gap, (j + 1) * l.ch - gap]]
          .map(([a, b], k) => toMap(a + (hash(i, j, k) - 0.5) * 1.6, b + (hash(j, i, k) - 0.5) * 1.2));
        const cx = pts.reduce((t, p) => t + p[0], 0) / 4, cy = pts.reduce((t, p) => t + p[1], 0) / 4;
        if(cx < -10 || cx > MAP_W + 10 || cy < -10 || cy > MAP_H + 10) continue;
        if(nearestPlace(cx, cy) !== owner) continue;
        if(pts.some(([x, y]) => mapZone(x, y) !== 'land')) continue;
        const h = hash(i, j, 9 + l.angle);
        list.push({ district:l.district, pts, cx, cy, kind:h < 0.07 ? 'notable' : h > 0.965 ? 'green' : 'plain' });
      }
    }
  }
  for(const d of DISTRICT_ORDER){
    list.filter(b => b.district === d && b.kind !== 'green')
      .sort((a, b) => Math.round(a.cy / 12) - Math.round(b.cy / 12) || a.cx - b.cx)
      .forEach((b, n) => { b.num = n + 1; b.addr = d + '-' + b.num; });
  }
  return list;
})();
const blockByAddr = addr => MAP_BLOCKS.find(b => b.addr === addr);

const SECRETS = {

function knownAddrs(s){ return Object.keys(s.flags).filter(k => k.startsWith('addr_')).map(k => k.slice(5)); }

function mapSvg(s, moves = [], tap = null){
  const seen = new Set([...(s.visited || []), s.place]);
  const openDistricts = new Set([...seen].map(p => LANDMARKS[p]?.district));
  const isOpen = (x, y) => openDistricts.has(LANDMARKS[nearestPlace(x, y)].district);
  const P = ([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`;
  let defs = '', g = '';

  // 紙のざらつき・焼け
  defs += '<filter id="m-grain"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .55 0"/></filter>'
    + '<radialGradient id="m-burn" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#7a5a2a" stop-opacity="0"/><stop offset="100%" stop-color="#5a3a12" stop-opacity=".45"/></radialGradient>';

  // 地形：川・海・丘・公園
  let sea = `M0,${MAP_H} L0,${coastY(0).toFixed(1)}`;
  for(let x = 0; x <= MAP_W; x += 8) sea += ` L${x},${coastY(x).toFixed(1)}`;
  sea += ` L${MAP_W},${MAP_H} Z`;
  let river = 'M0,0';
  for(let y = 0; y <= MAP_H; y += 8) river += ` L${riverX(y).toFixed(1)},${y}`;
  river += ` L0,${MAP_H} Z`;
  g += `<path d="${sea}" class="m-water"/><path d="${river}" class="m-water"/>`;
  for(let k = 1; k <= 3; k++) g += `<path d="${sea.replace(/L(\d+),([\d.]+)/g, (m, x, y) => `L${x},${(+y + k * 7).toFixed(1)}`)}" class="m-wave"/>`;
  g += '<ellipse cx="200" cy="36" rx="58" ry="33" class="m-park"/>';
  [[44, 25], [30, 17], [16, 9]].forEach(([rx, ry]) => g += `<ellipse cx="200" cy="36" rx="${rx}" ry="${ry}" class="m-contour"/>`);
  g += '<ellipse cx="136" cy="190" rx="20" ry="14" class="m-park"/><circle cx="136" cy="190" r="3" class="m-fountain"/>';

  // 街区（今いる地区の街区は、拠点の画面にいるとき押して選べる）
  for(const bl of MAP_BLOCKS){
    const open = openDistricts.has(bl.district);
    const cls = !open ? 'm-block blank' : bl.kind === 'notable' ? 'm-block m-notable' : bl.kind === 'green' ? 'm-block m-green' : 'm-block';
    const pick = tap && bl.addr && bl.district === tap.district;
    g += `<polygon points="${bl.pts.map(P).join(' ')}" class="${cls}${pick ? ' m-pick' : ''}"${pick ? ` data-block="${bl.addr}"` : ''}/>`;
    if(open && bl.num) g += `<text x="${bl.cx.toFixed(1)}" y="${(bl.cy + 1.2).toFixed(1)}" class="m-num">${bl.num}</text>`;
  }

  // 大通り・線路
  MAP_ROADS.forEach((r, n) => {
    const d = smoothPath(r.pts);
    defs += `<path id="m-road-${n}" d="${d}"/>`;
    g += `<path d="${d}" class="m-${r.cls}-edge"/>`;
  });
  MAP_ROADS.forEach((r, n) => { g += `<use href="#m-road-${n}" class="m-${r.cls}"/>`; });
  const L = LANDMARKS;
  g += `<path d="${smoothPath([[L.subway.x, L.subway.y], [104, 246], [150, 268], [L.port.x, L.port.y]])}" class="m-rail-edge"/>`
    + `<path d="${smoothPath([[L.subway.x, L.subway.y], [104, 246], [150, 268], [L.port.x, L.port.y]])}" class="m-rail"/>`;
  // 通りの名前（行った地区を通る通りだけ）
  MAP_ROADS.forEach((r, n) => {
    if(!r.name || !r.pts.some(([x, y]) => x > 0 && x < MAP_W && isOpen(x, y))) return;
    g += `<text class="m-street"><textPath href="#m-road-${n}" startOffset="${r.cls === 'hw' ? 20 : 30}%">${r.name}</textPath></text>`;
  });
  // 橋
  g += `<rect x="1" y="${L.police.y - 12}" width="30" height="10" class="m-bridge" transform="rotate(3 16 ${L.police.y - 7})"/><text x="16" y="${L.police.y - 16}" class="m-label">橋</text>`;
  g += `<text x="13" y="240" class="m-water-t" transform="rotate(-88 13 240)">ハロウ川</text><text x="236" y="312" class="m-water-t">ハロウ湾</text>`;

  // 主な場所（行った場所だけ形を描く）
  const shape = {
    police:(x, y) => `<rect x="${x - 12}" y="${y - 8}" width="24" height="15" class="m-land"/><path d="M${x},${y - 5} l1.6,3.4 3.7,.4 -2.8,2.5 .8,3.6 -3.3,-1.9 -3.3,1.9 .8,-3.6 -2.8,-2.5 3.7,-.4z" class="m-star"/>`,
    hospital:(x, y) => `<path d="M${x - 5},${y - 13} h10 v8 h8 v10 h-8 v8 h-10 v-8 h-8 v-10 h8z" class="m-land"/><path d="M${x - 1.5},${y - 6} h3 v4.5 h4.5 v3 h-4.5 v4.5 h-3 v-4.5 h-4.5 v-3 h4.5z" class="m-cross"/>`,
    mansion:(x, y) => `<circle cx="${x}" cy="${y + 2}" r="14" class="m-garden"/><rect x="${x - 10}" y="${y - 6}" width="20" height="12" class="m-land"/><rect x="${x - 3}" y="${y - 10}" width="6" height="5" class="m-land"/>`,
    shotengai:(x, y) => [-24, -14, -4, 6, 16].map(dx => `<rect x="${x + dx}" y="${y - 9}" width="8" height="6" class="m-land"/><rect x="${x + dx}" y="${y + 3}" width="8" height="6" class="m-land"/>`).join(''),
    mall:(x, y) => `<rect x="${x - 18}" y="${y - 11}" width="36" height="16" class="m-land"/><rect x="${x - 18}" y="${y + 6}" width="36" height="9" class="m-lot"/>` + [0, 1, 2, 3, 4, 5, 6, 7].map(k => `<line x1="${x - 16 + k * 4.4}" y1="${y + 7}" x2="${x - 16 + k * 4.4}" y2="${y + 14}" class="m-lotline"/>`).join(''),
    gas:(x, y) => `<rect x="${x - 7}" y="${y - 5}" width="10" height="9" class="m-land"/><rect x="${x + 4}" y="${y - 7}" width="12" height="11" class="m-canopy"/>`,
    port:(x, y) => [-30, -12, 6, 24].map(dx => `<rect x="${x + dx}" y="${y + 4}" width="5" height="18" class="m-pier"/>`).join('') + `<rect x="${x - 22}" y="${y - 8}" width="16" height="9" class="m-land"/><rect x="${x + 2}" y="${y - 8}" width="16" height="9" class="m-land"/>`,
    subway:(x, y) => `<rect x="${x - 10}" y="${y - 6}" width="20" height="12" class="m-land"/><circle cx="${x}" cy="${y}" r="4.5" class="m-metro"/><text x="${x}" y="${y + 2}" class="m-metro-t">M</text>`,
  };
  for(const [place, l] of Object.entries(LANDMARKS)){
    if(!seen.has(place)) continue;
    const here = s.place === place;
    g += shape[place](l.x, l.y);
    if(here) g += `<circle cx="${l.x}" cy="${l.y}" r="16" class="m-here"/>`;
    g += `<text x="${l.x}" y="${l.below ? l.y + 25 : l.y - 18}" class="${here ? 'm-label m-label-here' : 'm-label'}">${l.label}${here ? '（現在地）' : ''}</text>`;
  }
  // 自分の本で知った住所は★で示す
  for(const addr of knownAddrs(s)){
    const bl = blockByAddr(addr);
    if(!bl) continue;
    g += `<polygon points="${bl.pts.map(P).join(' ')}" class="m-known"/><text x="${(bl.cx + 5).toFixed(1)}" y="${(bl.cy - 1.5).toFixed(1)}" class="m-star-pin">★</text>`;
  }
  if(tap && tap.selected){
    const bl = blockByAddr(tap.selected);
    if(bl) g += `<polygon points="${bl.pts.map(P).join(' ')}" class="m-selected"/><text x="${bl.cx.toFixed(1)}" y="${(bl.cy - 8).toFixed(1)}" class="m-sel-t">${addrName(bl.addr)}</text>`;
  }
  // 押して移動できる場所（拠点にいるときだけ）
  for(const mv of moves){
    const l = LANDMARKS[mv.dest];
    g += `<g class="m-go" data-go="${mv.dest}"><circle cx="${l.x}" cy="${l.y}" r="17" class="m-go-ring"/>`
      + (seen.has(mv.dest) ? '' : `<text x="${l.x}" y="${l.y + 3}" class="m-go-q">？</text>`)
      + `<text x="${l.x}" y="${l.below ? l.y - 19 : l.y + 27}" class="m-go-t">${mv.cost}分</text>`
      + `<circle cx="${l.x}" cy="${l.y}" r="22" fill="transparent"/></g>`;
  }

  // 地区名（行った地区だけ）
  for(const [k, d] of Object.entries(DISTRICTS)) if(openDistricts.has(k)) g += `<text x="${d.x}" y="${d.y}" class="m-district">${d.name}</text>`;

  // 方位記号・題字枠
  const rose = [0, 45, 90, 135, 180, 225, 270, 315].map(a => {
    const long = a % 90 === 0 ? 13 : 7;
    return `<path d="M0,${-long} L2.2,0 L0,2 L-2.2,0Z" transform="rotate(${a})" class="${a === 0 ? 'm-rose-n' : 'm-rose'}"/>`;
  }).join('');
  g += `<g transform="translate(58 300)"><circle r="9" class="m-rose-ring"/>${rose}<text y="-16" class="m-rose-t">N</text></g>`;
  g += '<g transform="translate(306 282)"><rect x="0" y="0" width="90" height="32" class="m-legend"/><rect x="2.5" y="2.5" width="85" height="27" class="m-legend-in"/>'
    + '<text x="45" y="14" class="m-title">ハロウベイ市街図</text><text x="45" y="24" class="m-small">― 夜明け前 ―</text></g>';

  // 紙の折り目・ざらつき・焼け
  g += `<line x1="${MAP_W / 3}" y1="0" x2="${MAP_W / 3}" y2="${MAP_H}" class="m-fold"/><line x1="${MAP_W * 2 / 3}" y1="0" x2="${MAP_W * 2 / 3}" y2="${MAP_H}" class="m-fold"/><line x1="0" y1="${MAP_H / 2}" x2="${MAP_W}" y2="${MAP_H / 2}" class="m-fold"/>`;
  g += `<rect width="${MAP_W}" height="${MAP_H}" filter="url(#m-grain)" opacity=".35" pointer-events="none"/><rect width="${MAP_W}" height="${MAP_H}" fill="url(#m-burn)" pointer-events="none"/>`;

  const known = knownAddrs(s);
  return `<div class="map${mapZoom ? ' zoom' : ''}"><div class="map-tools"><button id="mapZoom">${mapZoom ? '縮小' : '拡大'}</button></div><div class="map-scroll" id="mapScroll"><svg viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="ハロウベイ市街図"><defs>${defs}</defs>${g}</svg></div>`
    + (tap && tap.selected ? `<div class="map-actions"><button id="blockGo">${addrName(tap.selected)}を調べる（10分）</button><button id="blockCancel">やめる</button></div>` : '')
    + (tap && !tap.selected ? `<p>今いる地区（${DISTRICTS[tap.district].name}）の街区を押すと、その番地を選べる。</p>` : '')
    + (known.length ? `<p class="known">わかっている住所（★）：${known.map(addrName).join('、')}</p>` : '')
    + (moves.length ? '<p>金色の点線で囲まれた場所を押すと、そこへ移動する。</p>' : '') + '<p>白い地区は、まだ行っていない。赤い丸が現在地。点線は地下鉄の線路。</p></div>';
}

// 地図から押せる移動（拠点の画面にいるときだけ）
function mapMoves(s, w){
  const p = paraOf(s);
  if(!canAct() || !p.hub || p.monster || s.status !== 'active') return [];
  return hubChoices({ ...s, menu:'move' }, w, p.hub).filter(ch => ch.move);
}

// 地図で街区を押せるのは、拠点の画面にいるときの、今いる地区だけ
function mapTap(s){
  const p = paraOf(s);
  if(!canAct() || !p.hub || p.monster || s.status !== 'active') return null;
  return { district:LANDMARKS[s.place].district, selected:selectedBlock };
}

function addProps(T, scene, list){
  for(const [name, x, z, r = 0, o = {}] of (list || [])){
    const g = new T.Group(); PROPS[name](T, g, o); g.position.set(x, 0, z); g.rotation.y = r; scene.add(g);
    if(name === 'door' || o.pass) g.userData.pass = true; // 通れる物（歩ける範囲から除かない）
    if(o.npc) (scene.userData.npcs = scene.userData.npcs || []).push({ g, name:o.npc, gate:name === 'gate', home:[x, z, r], exit:o.exit || null, fall:o.fall, state:null });
  }
}

// 明かり：fluo（蛍光灯）・warm（裸電球）・dim（ほぼ暗闇）。停電後は非常灯（赤）に変わる。gen:true は発電機があって停電しない
function addLights(T, scene, c, w, d, h){
  const amb = new T.AmbientLight(c.amb || 0x1c2433, c.ambI || (c.light === 'dim' ? 2.4 : 1.5)); scene.add(amb);
  const list = [];
  const spots = c.lamps || [[0, 0]];
  for(const [x, z] of spots){
    const col = c.light === 'warm' ? 0xffc880 : c.light === 'green' ? 0x40ff80 : 0xd8e4ec;
    const base = c.light === 'dim' ? 1.2 : 2.2;
    const tube = glow(T, c.light === 'warm' ? .16 : 1.2, .05, c.light === 'warm' ? .16 : .24, col, x, h - .06, z); scene.add(tube);
    const l = new T.PointLight(col, base, Math.max(w, d) * 1.3, 1.4); l.position.set(x, h - .4, z); scene.add(l);
    list.push({ tube, l, fl:flicker(l, base, c.light === 'warm' ? .02 : .06) });
  }
  const emer = new T.PointLight(0xff3020, 0, Math.max(w, d) * 1.6, 1.4); emer.position.set(-w / 2 + .4, h - .4, -d / 2 + .4); scene.add(emer);
  return (t, st) => {
    const on = c.gen || !st.blackout;
    list.forEach(({ tube, fl }) => { const f = fl(on); tube.material.color.setScalar(on ? .25 + .7 * f : .06); });
    emer.intensity = on ? 0 : 1.4 + Math.sin(t * 3) * .3;
  };
}

function buildRoom(T, scene, c){
  const [w, d, h] = c.size;
  scene.background = new T.Color(0x020304);
  scene.fog = new T.Fog(0x020304, Math.max(w, d) * .7, Math.max(w, d) * 2.4 + 6);
  const fl = FLOORS[c.floor || 'tile'];
  scene.add(flat(T, w, d, c.floorTex ? TM(T, c.floorTex, w / 2, d / 2) : psxMat(T, { map:tileTex(T, fl[0], fl[1], Math.max(1, w / 2), Math.max(1, d / 2)) }), 0, 0, 0));
  const wl = WALLS[c.wall || 'gray'];
  const wm = c.wallTex ? TM(T, c.wallTex, Math.max(w, d) / 1.6, h / 1.6, c.wallC) : psxMat(T, { map:wallTex(T, wl[0], wl[1], Math.max(1, w / 4), 1) });
  if(c.wallTex) scene.add(box(T, w, 1.3, .22, M(T, c.band || 0x2a4a7a), 0, .65, -d / 2 + .02), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), -w / 2 + .02, .65, 0), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), w / 2 - .02, .65, 0));
  scene.add(box(T, w, h, .2, wm, 0, h / 2, -d / 2), box(T, .2, h, d, wm, -w / 2, h / 2, 0), box(T, .2, h, d, wm, w / 2, h / 2, 0));
  scene.add(box(T, w, .1, d, M(T, 0x101214), 0, h + .05, 0));
  const side = c.camLeft ? -1 : 1;
  const camera = new T.PerspectiveCamera(c.fov || 74, RES_W / RES_H, .1, 80);
  camera.position.set(side * (w / 2 - .35), h - .25, d / 2 - .35);
  camera.lookAt(-side * w * .18, .4, -d * .22);
  addProps(T, scene, c.props);
  const lights = addLights(T, scene, c, w, d, h);
  return { camera, room:true, door:[side * (w / 2 - .6), d / 2 + 1.6], zone:[-w / 2 + .7, w / 2 - .7, -d / 2 + .7, d / 2 - .9], you:c.you || [-side * .3, d * .12], youFace:Math.PI, cross:null,
    update(t, st){ lights(t, st); } };
}

function buildOut(T, scene, c){
  const [w, d] = c.size;
  scene.background = c.day ? skyTex(T, c.night) : new T.Color(c.sky || 0x03050a);
  scene.fog = c.night ? new T.Fog(0x0b0f18, 10, 52) : new T.Fog(c.fogC || (c.day ? 0xb4b6ae : 0x05080c), c.fog ? c.fog[0] : 6, c.fog ? c.fog[1] : 26);
  const fl = FLOORS[c.floor || 'asphalt'];
  if(c.day) townGround(T, scene, c); else scene.add(flat(T, w, d, psxMat(T, { map:tileTex(T, fl[0], fl[1], w / 2, d / 2) }), 0, 0, 0));
  if(c.water){ const wt = flat(T, 80, 80, M(T, 0x0e1a20), 0, -.6, -20); scene.add(wt); }
  const camera = new T.PerspectiveCamera(c.fov || 70, RES_W / RES_H, c.day ? .8 : .1, c.day ? 140 : 90);
  camera.position.set(...(c.cam || [w / 2 - .5, 5, d / 2 - .5])); camera.lookAt(...(c.look || [0, .5, -d * .2]));
  addProps(T, scene, c.props);
  scene.add(new T.AmbientLight(c.amb || (c.night ? 0x2c3a5c : c.day ? 0x9aa4b0 : 0x24304a), c.ambI || (c.night ? 1.7 : c.day ? 1.25 : 2.4)));
  const moon = new T.DirectionalLight(c.day && !c.night ? 0xffe4bc : 0x8fa0c0, c.day && !c.night ? 1.7 : c.night ? .5 : 1.1); moon.position.set(...(c.day ? [-9, 7, 6] : [-3, 10, 4])); scene.add(moon);
  const lamps = (c.lamps || []).map(([x, y, z, col = 0xffd8a0]) => { const l = new T.PointLight(col, 3, 18, 1.3); l.position.set(x, y, z); scene.add(l); return flicker(l, 3, .04); });
  const flood = c.flood ? new T.SpotLight(0xffffe8, 4, 40, .5, .5, 1) : null;
  if(flood){ flood.position.set(...c.flood); scene.add(flood, flood.target); }
  const nav = c.day ? makeNav(T, scene, null, null, [-w / 2 - 4, -d / 2 - 3, w / 2 + 4, d / 2 + 3]) : null;
  return { camera, room:true, open:!!c.day, nav, indoor:c.indoor || null, door:c.door || [0, d / 2 + 1.8], enter:c.enter || null, zone:c.zone || [-w / 2 + 1, w / 2 - 1, -d / 2 + 1, d / 2 - 1.5], you:c.you || [0, d * .15], youFace:Math.PI, cross:null, hide:c.hide || null, hideFace:c.hideFace,
    update(t, st){ lamps.forEach(fl => fl(c.gen || !st.blackout)); if(flood) flood.target.position.set(Math.sin(t * .6) * 4, 0, -2); } };
}

function townTex(T, kind, rx = 1, ry = 1){ return psxTex(T, 32, 32, (g, w, h) => TOWN_TEX[kind](g, w, h), rx, ry); }
function TM(T, kind, rx, ry, color){ return psxMat(T, { map:townTex(T, kind, rx, ry), ...(color != null ? { color } : {}) }); }
// 文字の入った板（貼り紙・看板）
function textTex(T, lines, bg, fg, w = 48, h = 32){
  return psxTex(T, w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; const lh = H / lines.length; g.font = `bold ${Math.floor(Math.min(lh * .78, W / Math.max(...lines.map(l => l.length)) * 1.5))}px sans-serif`; lines.forEach((l, i) => g.fillText(l, W / 2, lh * (i + .55))); });
}
// 地面に落ちる影（朝の低い日なので、物の片側に伸びる）
function shade(T, w, d, dx = 0, dz = 0, a = .34){ const m = flat(T, w, d, new T.MeshBasicMaterial({ color:0x0a0c10, transparent:true, opacity:a, depthWrite:false }), dx, .1, dz); m.renderOrder = 1; return m; }
// 曇りがちな朝の空：上は灰青、地平線は白っぽい
function skyTex(T, night){
  const c = document.createElement('canvas'); c.width = 4; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
  if(night){ gr.addColorStop(0, '#05070d'); gr.addColorStop(.5, '#0b1020'); gr.addColorStop(.64, '#1a1c2a'); gr.addColorStop(1, '#0b0f18'); }
  else { gr.addColorStop(0, '#6f8194'); gr.addColorStop(.45, '#9aa6ae'); gr.addColorStop(.62, '#c4c2b4'); gr.addColorStop(1, '#b4b6ae'); }
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; return t;
}
// 地面：芝の上に、道・歩道・駐車場を帯で敷く。[種類, 中心x, 中心z, 幅, 奥行き]。遠くは木立と屋根で埋める
function townGround(T, scene, c){
  if(c.base === 'water') scene.add(flat(T, 400, 400, TM(T, 'water', 100, 100), 0, -9, 0)); else scene.add(flat(T, 260, 260, TM(T, 'grass', 130, 130), 0, -.12, 0));
  (c.ground || []).forEach(([kind, x, z, w, d], i) => {
    if(kind === 'curb') scene.add(box(T, w, .14, d, M(T, 0x8f8c84), x, .07, z));
    else scene.add(flat(T, w, d, TM(T, kind, w / 2, d / 2), x, i * .008, z));
  });
  const r = seeded(c.seed || 13), cols = [0x8a5a34, 0x9a7a3a, 0x6a4a34, 0x5a5a3c, 0x7a6038];
  for(let i = 0; i < 26; i++){
    const far = i < 18, x = far ? -62 + i * 7.2 + r() * 3 : (i % 2 ? -1 : 1) * (30 + r() * 10), z = far ? -(c.back || 30) - r() * 10 : -24 + (i - 18) * 6;
    const m = new T.Mesh(new T.IcosahedronGeometry(3.2 + r() * 2.4, 0), psxMat(T, { color:cols[i % cols.length], flatShading:true }));
    m.position.set(x, 4.4 + r() * 2, z); scene.add(m, box(T, .6, 5, .6, M(T, 0x3a3028), x, 2.5, z));
    if(far && i % 3 === 1) scene.add(box(T, 8, 3.4, 5, M(T, [0xa8a498, 0x8c949a, 0xb0a48c][i % 3]), x + 3.4, 1.7, z + 7), box(T, 8.6, 1.2, 5.6, M(T, 0x463a34), x + 3.4, 4, z + 7));
  }
}

function inBlindSpot(s){
  if(s.offcam) return true;
  if(planOf(s)) return false;
  const p = paraOf(s);
  return !p.hub && !p.encounter && s.book !== 'monster' && (NO_CAM.has(PARA_CAMS[s.para]) || !!p.inside);
}
function camFor(s){
  const pl = planOf(s);
  if(pl) return `plan:${pl.plan}:${pl.floor}`;
  const p = paraOf(s);
  if(s.book === 'monster' && s.lastCam) return s.lastCam; // ゾンビになったあとは、最後に映っていたカメラのまま
  if(p.hub || p.encounter || s.book === 'monster' || !PARA_CAMS[s.para]) return s.place;
  if(NO_CAM.has(PARA_CAMS[s.para])) return s.lastCam || s.place;
  return s.clock >= 1010 && CAM_DEFS[PARA_CAMS[s.para] + 'n'] ? PARA_CAMS[s.para] + 'n' : PARA_CAMS[s.para];
}

  const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1, minZ = Math.min(...zs) - 1, maxZ = Math.max(...zs) + 1.5;
  const S = 12, W = (maxX - minX) * S, H = (maxZ - minZ) * S;

  let g = '';

    const isHere = here && here.room === id, known = seen.has(key);
    g += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * S}" height="${(z1 - z0) * S}" class="pm-room${known ? ' known' : ''}${isHere ? ' here' : ''}${r.cams ? '' : ' nocam'}${taps && taps[id] ? ' pick' : ''}"${taps && taps[id] ? ` data-spot="${taps[id]}"` : ''}/>`;
    if(known || isHere || (taps && taps[id]) || risks[id] || bookOf(s).spots) g += `<text x="${X((x0 + x1) / 2)}" y="${Z((z0 + z1) / 2)}" class="pm-name">${escText(r.name)}</text>`;
    if(r.cams && known) g += `<text x="${+X(x1) - 5}" y="${+Z(z0) + 11}" class="pm-cam">●</text>`;
  }
  for(const d of P.doors.map(([a, b, x, z, w = 1.2, label = '']) => ({ a, b, x, z, w, label })).filter(d => P.rooms[d.a].floor === floor)){
    const horiz = Object.values(P.rooms).some(r => r.floor === floor && (Math.abs(r.rect[1] - d.z) < .01 || Math.abs(r.rect[3] - d.z) < .01) && d.x > r.rect[0] && d.x < r.rect[2]);
    g += horiz ? `<rect x="${X(d.x - d.w / 2)}" y="${Z(d.z) - 2}" width="${d.w * S}" height="4" class="pm-door"/>` : `<rect x="${X(d.x) - 2}" y="${Z(d.z - d.w / 2)}" width="4" height="${d.w * S}" class="pm-door"/>`;
    if(d.b[0] === '@' && d.label) g += `<text x="${X(d.x)}" y="${+Z(d.z) + (horiz ? 14 : 4)}" class="pm-exit">${d.label}</text>`;
  }
  const tabs = P.floors.map(f => `<button data-floor="${f}" class="${f === floor ? 'on' : ''}">${f}</button>`).join('');
  return `<div class="planmap"><div class="pm-head"><b>${P.name}</b><span class="pm-tabs">${tabs}</span></div>`
    + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${P.name} ${floor}">${g}</svg>`
    + `<p>${taps ? '金色の枠の部屋を押すと、そこへ移る。' : ''}色の付いた部屋は行ったことのある部屋。光っているのが今いる部屋。● は監視カメラのある部屋。</p></div>`;
}

  return {
    cell:f('cell_shot') ? 'down' : f('cell_released') ? 'gone' : 'in',
    sailor:f('sailor_free') ? 'gone' : 'in',
    boss:f('boss_dead') ? 'down' : 'in',

// 映っている最中に変わったら、動きを見せる（扉が開く・走って出ていく・倒れる）。
// 組み立てた直後と、手を戻したときは、動きを見せずにその状態にする
function npcStep(n, t, st){
  const want = st.npc?.[n.name] || 'in', g = n.g, f = g.userData.fig, [hx, hz, hr] = n.home;
  const dt = Math.min(.1, Math.max(0, t - (n.t ?? t))); n.t = t;
  if(want !== n.state){
    const jump = n.state === null || want === 'in';
    n.state = want; n.rest = false; n.k = jump ? 1 : 0; n.d = jump ? 1e9 : 0;
    g.visible = true; g.position.set(hx, 0, hz); g.rotation.y = hr;
    if(f){ g.userData.pose(); f.userData.shadow.visible = true; f.userData.spd = 0; }
    if(want === 'in') n.rest = true;
  }
  if(n.rest) return;
  n.k = Math.min(1, n.k + dt / .5);
  if(n.gate){ g.rotation.y = hr - (want === 'gone' ? 1.5 * n.k * n.k * (3 - 2 * n.k) : 0); n.rest = n.k >= 1; return; }
  if(want === 'down'){
    const a = 1.5 * n.k * n.k;
    if(n.fall === 'side') f.rotation.z = a; else f.rotation.x = -a;
    f.position.y = .12 * n.k; f.userData.shadow.visible = false; n.rest = n.k >= 1; return;
  }
  if(!n.exit){ g.visible = false; n.rest = true; return; }
  if(n.k < .7 || dt <= 0) return; // 扉が開くのを一拍待つ
  const pts = [[hx, hz], ...n.exit], step = 3.2 * dt;
  n.d += step;
  if(n.d >= pathLen(pts)){ g.visible = false; n.rest = true; return; }
  const [x, z, dx, dz] = pathAt(pts, n.d);
  g.position.set(x, 0, z); turnTo(g, Math.atan2(dx, dz), 14 * dt); gaitRun(f, step, dt);
}

// 本文をめくるたびに映像が飛ぶと忙しないので、映像は一拍おいてから追いかける（続けてめくったら最後の状況だけ映す）
function setCutscene(st){
  const ms = Cut.lagMs ?? 700;
  if(!videoOn || !Cut.key || !Cut.raf || ms <= 0){ clearTimeout(Cut.lagT); Cut.lagT = 0; applyCutscene(st); return; }
  Cut.lagSt = st;
  if(!Cut.lagT) Cut.lagT = setTimeout(() => { Cut.lagT = 0; applyCutscene(Cut.lagSt); }, ms);
}

  const wrap = document.getElementById('cutscene');
  if(!videoOn){ cancelAnimationFrame(Cut.raf); Cut.raf = 0; Cut.key = null; wrap.hidden = true; return; }
  wrap.hidden = false;
  const nextKey = `${st.cam}:${st.you}:${st.monster}`;
  // 別のカメラへ移るときは、いまの場面で出口まで歩ききってから切り替える
  if(Cut.key && Cut.key !== nextKey && Cut.built?.plan && !Cut.exitStart && Cut.raf && st.you === Cut.state.you) planLeave(st);
  const left = Cut.exitStart ? (Cut.exitMs || EXIT_MS) - (performance.now() - Cut.exitStart) : 0;
  if(Cut.key && Cut.key !== nextKey && left > 0){ clearTimeout(Cut.pendingT); Cut.pendingSt = st; Cut.pendingT = setTimeout(() => applyCutscene(Cut.pendingSt), left + 20); return; }
  const def = CAM_DEFS[st.cam];
  Cut.mainName = st.ended ? 'CAM-??' : def ? `CAM-${def.no}　${def.name}` : CAMS[st.place];
  Cut.who = CHARS[st.you].osd;

  Cut.mainTarget = st.ended ? '対象をロスト' : st.monster ? '対象：識別不能' : st.offscreen ? `捜索中：${Cut.who}` : `追跡中：${Cut.who}`;
  if(!st.plan){ document.getElementById('camName').textContent = Cut.mainName; document.getElementById('camTarget').textContent = Cut.mainTarget; }
  Cut.hidShown = null;
  wrap.classList.toggle('nosignal', st.ended);
  wrap.classList.toggle('alarm', st.encounter);
  if(st.clock !== Cut.state.clock){ Cut.clockBase = st.clock; Cut.clockAt = performance.now(); }
  Cut.state = st;
  const key = nextKey;
  if(Cut.key === key){
    if(Cut.exitStart){ clearTimeout(Cut.pendingT); Cut.exitStart = 0; Cut.exitMs = 0; if(Cut.built?.plan) Cut.built.target = null; }
    if(st.plan && Cut.built?.plan) planGoto(st.plan.room);
    return;
  }

  Cut.prevKey = Cut.key;
  if(Cut.key) cutStatic(520);
  Cut.key = key;
  loadThree().then(() => { if(Cut.key === key) buildPlace(st); }).catch(() => { wrap.hidden = true; Cut.key = null; });
}

// 行った部屋を覚える（館内図の色分けに使う）
function markRoom(s){
  const pl = planOf(s);
  if(!pl){ s.lastRoom = null; return; }
  s.rooms = s.rooms || [];
  const P = PLANS[pl.plan], [lp, lr] = (s.lastRoom || '').split(':');
  let path = [pl.room];
  if(lp === pl.plan && P.rooms[lr]){
    // 同じ階なら通った部屋、別の階なら両方の階段まで
    if(P.rooms[lr].floor === pl.floor) path = planRouteRooms(pl.plan, pl.floor, lr, pl.room);
    else path = [...planRouteRooms(pl.plan, P.rooms[lr].floor, lr, stairsOf(P, P.rooms[lr].floor, pl.floor)), ...planRouteRooms(pl.plan, pl.floor, stairsOf(P, pl.floor, P.rooms[lr].floor), pl.room)];
  }
  for(const r of path){ const key = `${pl.plan}:${r}`; if(!s.rooms.includes(key)) s.rooms.push(key); }
  s.lastRoom = `${pl.plan}:${pl.room}`;
}

// ===== 見取り図の建物の中の映像 =====
// 歩ける場所の地図。組み上がった場面の実物（壁・机・棚・車…）から作り、人物はこの上だけを歩く
const NAV_CELL = .2, NAV_R = .28;
function makeNav(T, scene, plan, floor, area){
  const rooms = area ? [{ rect:area }] : Object.values(PLANS[plan].rooms).filter(r => r.floor === floor), doors = area ? [] : planDoors(plan, floor);
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  for(const r of rooms){ x0 = Math.min(x0, r.rect[0], r.rect[2]); z0 = Math.min(z0, r.rect[1], r.rect[3]); x1 = Math.max(x1, r.rect[0], r.rect[2]); z1 = Math.max(z1, r.rect[1], r.rect[3]); }
  x0 -= .8; z0 -= .8; x1 += .8; z1 += .8;
  const C = NAV_CELL, W = Math.ceil((x1 - x0) / C), H = Math.ceil((z1 - z0) / C), N = W * H, cell = new Uint8Array(N);
  const cx = i => x0 + (i + .5) * C, cz = j => z0 + (j + .5) * C;
  // 床のある所（部屋の中と、扉の開口）
  for(let j = 0; j < H; j++) for(let i = 0; i < W; i++){
    const x = cx(i), z = cz(j);
    if(rooms.some(r => x >= Math.min(r.rect[0], r.rect[2]) && x <= Math.max(r.rect[0], r.rect[2]) && z >= Math.min(r.rect[1], r.rect[3]) && z <= Math.max(r.rect[1], r.rect[3]))
      || doors.some(d => Math.hypot(d.x - x, d.z - z) <= Math.max((d.w || 0) / 2, .3))) cell[j * W + i] = 1;
  }
  // 物のある所を塞ぐ（腰から頭の高さにかかる物だけ。体の幅のぶん太らせる）
  scene.updateMatrixWorld(true);
  const bx = new T.Box3();
  scene.traverse(o => {
    if(!o.isMesh) return;
    for(let p = o; p; p = p.parent) if(p.userData && p.userData.pass) return;
    bx.setFromObject(o);
    if(!(bx.max.y >= .25 && bx.min.y <= 1.5)) return;
    const i0 = Math.max(0, Math.floor((bx.min.x - NAV_R - x0) / C)), i1 = Math.min(W - 1, Math.floor((bx.max.x + NAV_R - x0) / C));
    const j0 = Math.max(0, Math.floor((bx.min.z - NAV_R - z0) / C)), j1 = Math.min(H - 1, Math.floor((bx.max.z + NAV_R - z0) / C));
    for(let j = j0; j <= j1; j++) for(let i = i0; i <= i1; i++){
      const x = cx(i), z = cz(j);
      if(x >= bx.min.x - NAV_R && x <= bx.max.x + NAV_R && z >= bx.min.z - NAV_R && z <= bx.max.z + NAV_R) cell[j * W + i] = 0;

  for(let s = 0; s < N; s++){
    if(!cell[s] || comp[s] >= 0) continue;
    const id = sizes.length, q = [s]; comp[s] = id;
    for(let h = 0; h < q.length; h++){
      const c = q[h], i = c % W, j = (c / W) | 0;
      for(const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
        const ni = i + di, nj = j + dj; if(ni < 0 || nj < 0 || ni >= W || nj >= H) continue;
        const n = nj * W + ni; if(cell[n] && comp[n] < 0){ comp[n] = id; q.push(n); }

    }
    sizes.push(q.length);
  }
  // 歩けるのは、いちばん広いひと続きの範囲だけ（階段の脇のすき間や、檻の中には入らない）
  const main = sizes.indexOf(Math.max(...sizes));
  for(let c = 0; c < N; c++) if(cell[c] && comp[c] !== main) cell[c] = 0;
  const idx = (x, z) => { const i = Math.floor((x - x0) / C), j = Math.floor((z - z0) / C); return i < 0 || j < 0 || i >= W || j >= H ? -1 : j * W + i; };
  const free = (x, z) => { const k = idx(x, z); return k >= 0 && cell[k] === 1; };
  const snap = p => {
    if(free(p[0], p[1])) return p;

    const ei = e % W, ej = (e / W) | 0;
    const hh = c => { const dx = Math.abs(c % W - ei), dz = Math.abs(((c / W) | 0) - ej); return Math.max(dx, dz) + .4142 * Math.min(dx, dz); };
    gs[s] = 0; par[s] = -1; seen[s] = run; push(s, hh(s));
    while(hi.length){
      const c = pop();
      if(c === e) break;
      if(done[c] === run) continue;
      done[c] = run;
      const ci = c % W, cj = (c / W) | 0;
      for(let dj = -1; dj <= 1; dj++) for(let di = -1; di <= 1; di++){
        if(!di && !dj) continue;
        const ni = ci + di, nj = cj + dj; if(ni < 0 || nj < 0 || ni >= W || nj >= H) continue;
        const n = nj * W + ni; if(!cell[n] || done[n] === run) continue;
        if(di && dj && (!cell[cj * W + ni] || !cell[nj * W + ci])) continue; // 角をかすめない
        const g = gs[c] + (di && dj ? 1.4142 : 1);

  };
  const near = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < .01;
  // a から b への道順。物を避けた折れ線で返す（つながっていなければ、やむをえず一直線）
  const path = (a, b) => {
    const A = snap(a), B = snap(b), ia = idx(A[0], A[1]), ib = idx(B[0], B[1]);

// 化け物がうろつく範囲と、もう一人が横切る線。玄関のある階は見取り図の指定、ほかの階はいちばん広い部屋
// 廊下で、ゾンビの立つ範囲（部屋の全体でなく、通り道をふさぐ所）
const PLAN_ZZONE = { school:{ corridor:[14.5, 17.5, -2.3, -.9] }, hosp:{ hall:[20, 23, -2.3, -.9] }, hotel:{ hall:[14, 17, -2.3, -.9] }, ps:{ hall:[18, 21, -2.3, -.9] } };
function zoneFor(plan, floor){

function planBuilt(T, scene, pl){
  const upd = buildPlanFloor(T, scene, pl.plan, pl.floor);
  const camera = new T.PerspectiveCamera(70, RES_W / RES_H, .1, 60);
  const zc = zoneFor(pl.plan, pl.floor);
  const b = { plan:pl.plan, floor:pl.floor, camera, update:upd, you:[0, 0], zone:zc.zone, cross:zc.cross, youFace:Math.PI, walls:upd.walls, eyes:[] };
  b.nav = makeNav(T, scene, pl.plan, pl.floor);
  for(const r of Object.values(PLANS[pl.plan].rooms)){
    if(r.floor !== pl.floor) continue;
    for(const c of [...(r.cams || []), ...(r.hideCam ? [r.hideCam] : [])]){
      const o = new T.PerspectiveCamera(c.fov || 70, RES_W / RES_H, .1, 60); o.position.set(...c.pos); o.lookAt(...c.look); o.updateMatrixWorld(); o.updateProjectionMatrix();
      b.eyes.push({ cam:c, obj:o, hide:c === r.hideCam });

}
function planSetTarget(b, room){
  const P = PLANS[b.plan];
  if(!P.rooms[room]) room = P.hub;
  const r = P.rooms[room], s = b.nav.snap(r.stand);
  b.target = room; b.you[0] = s[0]; b.you[1] = s[1];
  b.hide = r.hide ? [r.hide[0], r.hide[1]] : null; // 物陰は、歩ける範囲の外（階段の下など）でもそのまま使う b.hideFace = r.hideFace; b.hideZone = r.hideZone; b.hideCam = r.hideCam; b.hideView = r.hideView || (r.hideCam ? 'cam' : 'none');
}
function pathLen(pts){ let L = 0; for(let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

function pathAt(pts, d){

// ふだんは小走り。気づいていない化け物がそばにいる間の短い移動だけ、腰を落として忍び足
const JOG = 1.9, SNEAK = 1.4;
function planWalk(pts, leave, opt = {}){
  const st = Cut.state || {}, L = pathLen(pts);

  const speed = Math.max(sneak ? SNEAK : JOG, L / (leave ? 4.5 : sneak ? 7 : 6));

  if(ta + tb > T0){ const f = T0 / (ta + tb); ta *= f; tb *= f; }
  const sec = Math.max(.1, T0 + (ta + tb) / 2);
  Cut.walk = { pts, L, start:performance.now(), dur:sec * 1000, hideEnd:leave, sneak, a:ta / sec, b:tb / sec };

}
// 進み具合（0〜1）。はじめは加速、終わりは減速
function walkFrac(W, k){

}
function wantHide(st, b){ if(st.pose === 'hide') return !st.offscreen && !!b.hide && !st.monster; return !st.offscreen && !!b.hide && st.hideOk !== false && st.zombies > 0 && !st.aware && !st.encounter && !st.monster; }
function planBase(st, b){ return wantHide(st, b) ? b.hide : b.you; }
function youXZ(){ const y = Cut.youObj; return y ? [y.position.x, y.position.z] : [...Cut.built.you]; }
function planGoto(room){
  const b = Cut.built;

  planWalk(b.nav.path(youXZ(), planBase(Cut.state, b)), false);
}
function planLeave(st){
  const b = Cut.built, P = PLANS[b.plan];
  let exit = st.plan && st.plan.plan === b.plan ? null : (P.exitFor[st.cam] || P.exitTo?.[st.place] || '@street');
  const door = exit && P.doors.find(d => d[1] === exit);
  const goal = door && P.rooms[door[0]].floor === b.floor ? door : null;
  let dest;
  if(goal) dest = [goal[2], goal[3]];
  else { const to = st.plan && st.plan.plan === b.plan ? st.plan.floor : P.rooms[door?.[0]]?.floor; const sr = stairsOf(P, b.floor, to); if(!sr) return; dest = b.nav.fix(P.rooms[sr].stand); }

}
function planArrive(st){
  const b = Cut.built, P = PLANS[b.plan];
  const prevParts = (Cut.prevKey || '').split(':');
  const prev = prevParts.length > 2 && prevParts[prevParts.length - 2] === st.you ? Cut.prevKey : '';
  let startRoom, startPt;
  const fromCam = prev.split(':')[0];
  const samePlan = prev.startsWith(`plan:${b.plan}:`), prevFloor = samePlan ? prev.split(':')[2] : null;
  const fromPlace = prev.startsWith('plan:') ? (samePlan ? null : prev.split(':')[1]) : fromCam;
  const exit = samePlan ? null : (P.exitFor[fromCam] || P.exitTo?.[fromPlace] || (prev ? '@street' : null));

  else if(prev){ startRoom = stairsOf(P, b.floor, prevFloor || P.rooms[door?.[0]]?.floor); if(startRoom) startPt = b.nav.fix(P.rooms[startRoom].stand); }
