.cctv-top,.cctv-bot{opacity:0}

.tabs .me{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.tabs .me select{font-size:16px;background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:3px 4px}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:13px;color:var(--dim)}

.pm-tabs{display:flex;gap:4px}
.pm-tabs button{background:#14222a;color:#7a9aa8;border:1px solid #2a4a5a;border-radius:4px;padding:3px 10px;font-size:13px}

main{max-width:640px;margin:0 auto;padding:16px 30px 48px 16px}

/* 画面の右端のつまみ：押すと、映像・地図が横から出入りする */
.edgetab{position:fixed;right:0;z-index:9;writing-mode:vertical-rl;background:#15171c;color:#cfc7b4;border:1px solid #4a4436;border-right:0;border-radius:6px 0 0 6px;padding:10px 5px;font-size:13px;letter-spacing:.2em;line-height:1}
.edgetab.on{background:#3a3220;color:#f0d890;border-color:#a8780a}
#videoTab{top:58px}
#drawer{position:fixed;right:0;top:112px;z-index:8;width:min(94vw,560px);transform:translateX(100%);transition:transform .22s ease-out}

#top{overflow-x:clip}
#cutscene.slidein{animation:cut-in .22s ease-out}

@keyframes cut-in{from{transform:translateX(105%)}to{transform:none}}
</style>
</head>

<script>

// ===== 保存（Firebase に移すときはここだけ差し替える） =====
const PREFIX = 'jtld-election-';
let saveWarned = false;
// localStorage が使えない環境でも遊べるよう、メモリにも同じ内容を持っておく（その場合はページを閉じると消える）
const memory = {};
const store = {
  get(key, fallback){
    if(key in memory) return JSON.parse(memory[key]);
    try { const v = localStorage.getItem(PREFIX + key); if(v){ memory[key] = v; return JSON.parse(v); } }
    catch(e){}
    return fallback;
  },
  set(key, value){
    memory[key] = JSON.stringify(value);
    try { localStorage.setItem(PREFIX + key, memory[key]); }
    catch(e){ if(!saveWarned){ saveWarned = true; const note = 'この端末では進み具合を保存できません。ページを閉じると進み具合は消えます。'; console.warn(note); setTimeout(() => alert(note)); } }
  },
  remove(key){ delete memory[key]; try { localStorage.removeItem(PREFIX + key); } catch(e){} },
};

function newWorld(){
  return { events:[], items:JSON.parse(JSON.stringify(INITIAL_ITEMS)), once:{}, boatUsed:null, nextId:1 };
}
function newPlayer(id){
  const c = CHARS[id];
  return { char:id, book:id, para:BOOKS[id].start, place:c.place, clock:c.clock || 0, hp:3, lastCam:c.cam || null,
    items:{ ...c.items }, infected:false, turnAt:null, status:'active',
    flags:{}, seen:[], after:null, msg:'' };
}
function loadWorld(){ const w = store.get('world', null) || newWorld(); w.once = w.once || {}; return w; }
function loadPlayer(id){ return store.get('player-' + id, null) || newPlayer(id); }

// ===== 本から使う小道具 =====
function c(label, cost, to, extra = {}){ return { label, cost, to, ...extra }; }
function fmt(m){ const h = Math.floor(m / 60) % 24, mm = m % 60; return `${h}:${String(mm).padStart(2, '0')}`; }
function has(s, item, n = 1){ return (s.items[item] || 0) >= n; }
function addItem(s, item, n = 1){ s.items[item] = (s.items[item] || 0) + n; if(s.items[item] <= 0) delete s.items[item]; }
function addEvent(w, s, type, place, extra = {}){
  w.events.push({ id:w.nextId++, by:s.char, t:s.clock, type, place, ...extra });
}
function shoot(s, w){
  addItem(s, '弾', -1); addEvent(w, s, 'shot', s.place);
  // 銃声を聞きつけて、その場の化け物が増えることがある（着いたときに決まる数の上限まで）
  const z = zsHere(s);
  if(z && z.n < ZOMBIE_MAX && Math.random() < 0.3){
    z.n += 1;
    s.msg = (s.msg ? s.msg + '\n' : '') + '銃声を聞きつけて、もう一体が現れた。';
  }
}
function near(a, b){ return a === b || (ADJ[a] && b in ADJ[a]); }
function others(id){ return CHAR_IDS.filter(x => x !== id).map(loadPlayer); }
// 街の出来事：誰かが印を付けた時刻を、自分の時計が過ぎていれば見える
function setFlag(w, s, name){ addEvent(w, s, 'flag', s.place, { name }); }
function flag(s, w, name){ return w.events.some(e => e.type === 'flag' && e.name === name && e.t <= s.clock); }
// 一度きりの物：先に読んだ人が持っていく
function takeOnce(w, key, who){ if(w.once[key]) return false; w.once[key] = who; return true; }
function taken(w, key){ return !!w.once[key]; }

// 傷を負っても、感染したかどうかは本人にもわからない（確かめるには検査室で血液を調べる）
const INFECT_CHANCE = 0.5;
function bite(s){
  s.hp -= 1;
  s.wounds = (s.wounds || 0) + 1;
  if(!s.infected && Math.random() < INFECT_CHANCE){ s.infected = true; s.turnAt = s.clock + TURN_AFTER; }
  return '襲われて、腕に傷を負った。\n噛まれたのか、引っかかれただけなのか……暗くて、よくわからない。';
}
function symptom(s){
  if(!s.wounds) return '';
  if(s.infected && s.turnAt - s.clock <= 45) return '熱が上がってきた。指先がしびれて、うまく動かない。';
  return '腕の傷のまわりが、じんじんと熱い。';
}
function biteRoll(s, chance){
  if(has(s, '防弾ベスト')) chance /= 2;
  return Math.random() < chance ? bite(s) : '';
}

// 橋とボート：感染していたら負けの結末へ。着く時刻が夜明けを過ぎていたら脱出にならない（s.clock は着いた時刻）
function carEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '車の鍵', -1);
  addEvent(w, s, 'escape', 'police', { by_car:true });
  return s.infected ? BOOKS[s.char].endings.carInfected : BOOKS[s.char].endings.car;
}
function boatEscape(s, w){
  if(s.clock >= DAWN) return fateTarget(s);
  addItem(s, '燃料', -1); w.boatUsed = s.char;
  addEvent(w, s, 'escape', 'port');
  return s.infected ? BOOKS[s.char].endings.boatInfected : BOOKS[s.char].endings.boat;
}
// 302号室の少女（23:10に噛まれた）：薬を打たれていなければ1:40、打たれていれば3:40に発症する
function girlTurned(s, w){
  if(flag(s, w, 'girl_cured')) return false;
  return s.clock >= (flag(s, w, 'girl_treated') ? 220 : 100);
}
// モールの防犯カメラ：ほかの人がいつモールの入口を通ったか
const LOOKS = { police:'制服の警官', doctor:'白衣の医者' };
function cameraLog(s, w){
  const ev = w.events.filter(e => e.type === 'pass' && e.place === 'mall' && e.by !== s.char && !e.npc && e.t <= s.clock).slice(-4);
  return ev.length ? ev.map(e => `${fmt(e.t)}　${LOOKS[e.by]}が映っている`).join('\n') : '映っているのは、ふらふらと歩く化け物だけだ。';
}
function boatEscape2(s, w){

function bridgeOpen(s){ return (s.clock >= BRIDGE_OPEN && s.clock < BRIDGE_CLOSE) || (has(s, '通行証') && s.clock < DAWN); }

function danger(s, w){
  const p = s.place, t = s.clock;
  let d = BASE_DANGER[p] || 0;
  for(const e of w.events){
    if(e.t > t || e.t < t - 60) continue;
    if(e.type === 'shot' || e.type === 'noise') d += e.place === p ? 2 : (near(e.place, p) ? 1 : 0);
    if(e.type === 'horde' && e.place === p) d += 3;
  }
  if(p === 'police' && flag(s, w, 'police_barricade')) d -= 1;
  if(p === 'subway'){
    if(t >= BLACKOUT) d += 1;
    if(flag(s, w, 'subway_lights')) d -= 2;
    if(has(s, '懐中電灯')) d -= 1;
  }
  if(p === 'gas' && flag(s, w, 'gas_dark')) d -= 1;
  const humans = others(s.char).filter(o => o.status === 'active');
  if(humans.length){
    const ahead = t - Math.min(...humans.map(o => o.clock));
    if(ahead >= 120) d += 2; else if(ahead >= 60) d += 1;
  }
  return Math.max(0, d);
}

function radio(t){
  if(t < BLACKOUT) return '（ラジオ）「市民の皆さんは屋内にとどまってください。噛まれた方は、ただちに……」';
  if(t < BRIDGE_OPEN) return '（ラジオ）「避難の車列は、午前2時から4時まで橋を通します。徒歩での通行はできません」';
  if(t < DROP) return '（ラジオ）「橋の車列が動き始めました。検問では、全員の腕と首を確認します」';
  if(t < BRIDGE_CLOSE) return '（ラジオ）「救援物資を、メインストリートの屋上駐車場に投下しました」';
  return '（ラジオ）「橋は封鎖されました。夜明けとともに、ハロウベイ市内は処置されます。繰り返します……」';
}

<script>
'use strict';

// 決まった形の段落（拠点・遭遇）を本に登録する
for(const id of [...CHAR_IDS, 'monster']){
  const book = BOOKS[id];
  for(const [place, no] of Object.entries(book.hubs)) book.paras[no] = { hub:place, monster:id === 'monster' };
  if(book.enc) book.paras[book.enc] = { encounter:true };
}
const PERIODS = [510, 690, 810, 960, 1140], PERIOD_NAMES = ['朝', '午前', '昼', '午後', '夕方', '夜'];
function periodOf(t){ return PERIODS.filter(b => t >= b).length; }
// まだ前の時間帯にいる人（本を開いたことのない人と、結末まで行った人は数えない）
function behind(s){ const mine = periodOf(s.clock); return others(s.char).filter(o => o.status === 'active' && (o.history || []).length && periodOf(o.clock) < mine); }
function bookOf(s){ return BOOKS[s.book]; }
function paraOf(s){ return bookOf(s).paras[s.para]; }
function hubNo(s, place){ return bookOf(s).hubs[place]; }

// ===== 拠点の選択肢 =====
// 拠点の画面は3段に分ける：最初は「調べる」「持ち物」「移動する」（と脱出）だけ
function hubChoices(s, w, place){
  const explore = [], items = [], exits = [], moves = [];
  const id = s.char;
  const back = () => hubNo(s, place);
  for(const ch of (BOOKS[id].hubExtra?.[place] || [])) if(!ch.cond || ch.cond(s, w)) explore.push(ch);

  w.items[place].forEach((it, idx) => {
    if(it.hidden || (it.t || 0) > s.clock) return; // 置かれた時刻より前にいる人には見えない
    explore.push({ label:`置いてあった${it.name}を拾う`, cost:0, run(s, w){
      const i = w.items[place].findIndex((x, j) => j === idx && !x.hidden && x.name === it.name);
      if(i >= 0){
        const [got] = w.items[place].splice(i, 1);
        if(got.sample) (s.samples = s.samples || []).push(got.sample); else addItem(s, got.name);
        s.msg = `${got.name}を拾った。`;
      }
      return back();
    } });
  });

  if(!s.flags['searched_' + place]){
    explore.push({ label:'辺りを探す（30分）', cost:30, run(s, w){
      s.flags['searched_' + place] = 1;
      const found = w.items[place].filter(i => i.hidden);
      w.items[place] = w.items[place].filter(i => !i.hidden);
      found.forEach(i => addItem(s, i.name));
      addEvent(w, s, 'search', place, found.length ? { took:true } : {});
      s.msg = found.length ? `${found.map(i => i.name).join('、')}を見つけた。` : 'めぼしい物は見つからなかった。';
      return back();
    } });
  }

  // 血液：傷を負った人は採血して置いていける。医者だけが病院の検査室で調べられる
  if(id === 'doctor' && place === 'hospital'){
    if(s.wounds) explore.push({ label:'検査室で、自分の血を調べる（15分）', cost:15, area:'研究棟', run(s){
      s.msg = `検査の結果：${s.infected ? '陽性。あなたは感染している。' : '陰性。あなたは感染していない。'}`;
      return back();
    } });
    (s.samples || []).forEach((smp, i) => explore.push({ label:`検査室で、${smp.name}を調べる（15分）`, cost:15, area:'研究棟', run(s){
      s.samples.splice(i, 1);
      s.msg = `${smp.name}の検査結果：${smp.infected ? '陽性。感染している。' : '陰性。感染していない。'}`;
      return back();
    } }));
  }
  if(s.wounds){
    items.push({ label:'採血して、血液をここに置いていく（5分）', cost:5, run(s, w){
      const name = `血液（${CHARS[id].name}・${fmt(s.clock)}）`;
      w.items[place].push({ name, hidden:false, by:id, t:s.clock, sample:{ name, infected:s.infected } });
      addEvent(w, s, 'drop', place); s.msg = `${name}を、ここに置いた。`;
      return back();
    } });
  }

  // 感染していなくても打てる（打っても無駄になるだけ）。効いたかどうかは本人にもわからない
  if(s.wounds && has(s, '血清')){
    items.push({ label:'自分に血清を打つ（5分）', cost:5, run(s){
      addItem(s, '血清', -1); s.infected = false; s.turnAt = null;
      s.msg = '血清を打った。……感染していたのなら、これで助かったはずだ。';
      return back();
    } });
  }
  if(s.wounds && has(s, '薬')){
    items.push({ label:'自分に薬を打つ（5分）', cost:5, run(s){
      addItem(s, '薬', -1); if(s.infected) s.turnAt += CHARS[id].medDelay;
      s.msg = '薬を打った。感染していたのなら、発症を遅らせられたはずだ。';
      return back();
    } });
  }
  if(s.hp < 3 && id === 'doctor'){
    items.push({ label:'自分の傷を手当てする（20分）', cost:20, run(s){ s.hp += 1; s.msg = '傷を縫って包帯を巻いた。'; return back(); } });
  }
  if(s.hp < 3 && has(s, '救急箱')){
    items.push({ label:'救急箱を使う（10分）', cost:10, run(s){ addItem(s, '救急箱', -1); s.hp += 1; s.msg = '救急箱で傷の手当てをした。'; return back(); } });
  }
  for(const [item, n] of Object.entries(s.items)){
    if(n <= 0) continue;
    items.push({ label:`${item}を1つ、ここに置いていく`, cost:0, run(s, w){
      addItem(s, item, -1); w.items[place].push({ name:item, hidden:false, by:id, t:s.clock });
      addEvent(w, s, 'drop', place); s.msg = `${item}をここに置いた。`;
      return back();
    } });
  }

  // 出口
  if(place === 'police' && has(s, '車の鍵')){
    if(bridgeOpen(s)) exits.push({ label:'パトカーで橋へ向かう（15分）', cost:15, run(s, w){
      return taken(w, 'car_cleared') ? carEscape(s, w) : BOOKS[id].carScene;
    } });
    else if(s.clock < BRIDGE_OPEN) exits.push({ label:'パトカーで橋へ向かう（橋が開くのは2時から）', disabled:true });
    else exits.push({ label:'パトカーで橋へ向かう（橋は4時に封鎖された）', disabled:true });
  }
  if(place === 'port' && has(s, '燃料') && !w.boatUsed && s.clock + 20 < DAWN){
    exits.push({ label:'ボートに燃料を入れて沖へ出る（20分）', cost:20, run:(s, w) => boatEscape(s, w) });
  }

  const bike = has(s, '自転車');
  for(const [to, min] of Object.entries(ADJ[place])){
    const m = bike ? Math.max(5, Math.ceil(min / 10) * 5) : min;
    moves.push({ label:`${PLACES[to]}へ（${m}分${bike ? '・自転車' : ''}）`, cost:m, move:true, dest:to, run(s, w){
      s.place = to; addEvent(w, s, 'pass', to);
      s.visited = s.visited || [];
      if(!s.visited.includes(to)) s.visited.push(to);
      return hubNo(s, to);
    } });
  }

  const menu = (label, to) => ({ label, cost:0, menu:to, run(s){ s.menu = to; return back(); } });
  const m = s.menu || '';
  if(m === 'explore'){
    // 部屋が多い場所は、まとまり（1階・地下など）ごとに分ける
    const areas = [...new Set(explore.filter(ch => ch.area).map(ch => ch.area))];
    return [
      ...areas.map(a => menu(`${a}（${explore.filter(ch => ch.area === a).length}）`, 'explore:' + a)),
      ...explore.filter(ch => !ch.area),
      menu('← 戻る', null),
    ];
  }
  if(m.startsWith('explore:')){
    const a = m.slice(8);
    return [...explore.filter(ch => ch.area === a), menu('← 戻る', 'explore')];
  }
  if(m === 'items') return [...items, menu('← 戻る', null)];
  if(m === 'move') return [...moves, menu('← 戻る', null)];
  return [
    ...exits,
    ...(explore.length ? [menu('この場所を調べる', 'explore')] : []),
    ...(items.length ? [menu('持ち物', 'items')] : []),
    menu('ほかの場所へ移動する', 'move'),
  ];
}

function monsterChoices(s, w, place){
  const list = [{ label:'ここに群れを呼び集める（30分）', cost:30, run(s, w){
    addEvent(w, s, 'horde', place); s.msg = `${PLACES[place]}に群れが集まってきた。しばらくは、生きた人間には近寄れない場所になる。`;
    return hubNo(s, place);
  } }];
  for(const to of Object.keys(ADJ[place])){
    list.push({ label:`${PLACES[to]}へさまよう（10分）`, cost:10, run(s){ s.place = to; return hubNo(s, to); } });
  }
  list.push({ label:'動かずに夜明けを待つ', cost:0, run(s){ s.clock = DAWN; return 699; } });
  return list;
}

function encounterChoices(s){
  const back = () => s.after || hubNo(s, s.place);
  const calm = alert => { const z = zsHere(s); if(z){ z.aware = false; z.alert = alert; } };
  const list = [];
  if(s.char === 'police' && has(s, '弾')){
    list.push({ label:'撃つ（弾1発）', cost:5, run(s, w){
      shoot(s, w);
      const heard = s.msg; // 銃声で化け物が増えたときの知らせ
      const z = zsHere(s);
      if(z && z.aware){
        z.n = Math.max(0, z.n - 1); z.aware = z.n > 0;
        s.msg = z.n ? `一体の頭を撃ち抜いた。だが銃声で、残りの${z.n}体もこちらへ向かってくる！` : '最後の一体を撃ち倒した。銃声が夜に響いた。';
      } else s.msg = '一発で頭を撃ち抜いた。銃声が夜に響いた。';
      if(heard) s.msg += '\n' + heard;
      return back();
    } });
  }
  list.push({ label:'走って逃げる（10分）', cost:10, run(s){ s.msg = biteRoll(s, 0.35) || 'なんとか振り切った。'; calm(50); return back(); } });
  list.push({ label:'物陰に隠れてやり過ごす（30分）', cost:30, run(s){ s.msg = biteRoll(s, 0.15) || '息を殺しているうちに、足音は遠ざかった。'; calm(20); return back(); } });
  return list;
}

function choicesOf(s, w){
  const p = paraOf(s);
  if(p.spot) return spotChoices(s, w);
  if(p.hub) return p.monster ? monsterChoices(s, w, p.hub) : hubChoices(s, w, p.hub);
  if(p.encounter) return encounterChoices(s);
  const list = typeof p.choices === 'function' ? p.choices(s, w) : (p.choices || []);
  return list.filter(ch => !ch.cond || ch.cond(s, w));
}

// ===== 進める =====
function go(s, w, target){
  s.para = target;
  const p = paraOf(s);
  if(!p) throw new Error(`段落 ${target} が見つかりません（${s.book}）`);
  if(p.time != null) s.clock = Math.max(s.clock, typeof p.time === 'function' ? p.time(s) : p.time);
  if(p.place) s.place = p.place;
  if(p.enter) p.enter(s, w);
  if(p.end) s.status = typeof p.end === 'function' ? p.end(s) : p.end;
}
function isEnd(s, target){ return !!bookOf(s).paras[target]?.end; }

// ===== その場にいる化け物（気づかれているかどうか） =====
// 場所に着いたときに数を決める。その場で過ごした時間と物音で、少しずつ気づかれていく（100で気づかれる）
const ALERT_PER_MIN = 1.5; // 化け物1体・1分あたり
const ZOMBIE_SPOT = { police:'ロビーの奥', hospital:'廊下の先', shotengai:'通りの向こう', subway:'ホームの端', gas:'給油機の陰', port:'桟橋の先', mansion:'階段の下', mall:'吹き抜けの下' };
const ZOMBIE_MAX = 4;
function arriveZombies(s, w){
  const n = Math.max(0, Math.min(ZOMBIE_MAX, Math.round(danger(s, w) * .6 - .4 + Math.random() * .8)));
  s.zs = { place:s.place, n, alert:0, aware:false };
}
function zsHere(s){ return s.zs && s.zs.place === s.place ? s.zs : null; }
function zombieLine(s){
  const z = zsHere(s);
  if(!z || !z.n) return '辺りに、化け物の姿は見えない。';
  let t = `${ZOMBIE_SPOT[s.place]}で、化け物が${z.n}体うろついている。まだこちらに気づいていない。`;
  if(z.alert >= 60) t += '\nそのうち1体が、ときどきこちらを気にしている。';
  return t;
}

// 時計が進んだあとの判定：発症・体力切れなら化け物の本へ、夜明けなら間に合わなかった結末へ（どちらでもなければ null）
function fateTarget(s){
  if(s.hp <= 0 || (s.infected && s.clock >= s.turnAt)){
    if(!(s.infected && s.clock >= s.turnAt)) s.msg = (s.msg ? s.msg + '\n' : '') + '力尽きて倒れたところを、化け物に噛まれた。';
    s.book = 'monster'; s.status = 'monster'; s.hp = 3; s.after = null; return 600;
  }
  if(s.clock >= DAWN) return BOOKS[s.char].endings.stranded;
  return null;
}

function act(choice){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  if(s.status === 'active' && behind(s).length) return;
  const wasEncounter = !!paraOf(s).encounter;
  if(choice.menu !== undefined){ // 画面の段を切り替えるだけ（時間は進まない）
    choice.run(s); store.set('player-' + current, s); render(); return;
  }
  pushUndo(w, s);
  record(s, choice.label);
  const camBefore = camFor(s), placeBefore = s.place, blindBefore = inBlindSpot(s);
  const zBefore = paraOf(s).hub && s.book !== 'monster' ? zsHere(s) : null;
  s.menu = null;
  selectedBlock = null;
  s.msg = '';
  s.clock += choice.cost || 0;
  let target = choice.run ? choice.run(s, w) : choice.to;
  if(wasEncounter) s.after = null;
  // 拠点で時間を使うと、その場の化け物に気づかれていく。その場で撃てば、すぐ気づかれる
  if(zBefore && zBefore.n && !zBefore.aware && !choice.move && s.place === zBefore.place){
    zBefore.alert += (choice.cost || 0) * zBefore.n * ALERT_PER_MIN;
    if(w.events.some(e => e.type === 'shot' && e.by === s.char && e.place === s.place && e.t === s.clock)) zBefore.alert = 100;
    if(zBefore.alert >= 100) zBefore.aware = true;
  }
  if(s.book !== 'monster' && !zsHere(s)) arriveZombies(s, w);
  const toHub = !!BOOKS[s.book].paras[target]?.hub;

  if(s.book !== 'monster' && s.status === 'active' && !isEnd(s, target)){
    const fate = fateTarget(s);
    if(fate){
      target = fate;
    } else if(zsHere(s)?.aware && (zBefore || toHub || wasEncounter)){
      s.after = target; target = BOOKS[s.char].enc;
    } else if(choice.move && Math.random() < Math.min(0.6, danger(s, w) * 0.06)){
      s.after = target; target = BOOKS[s.char].enc;
    }
  }
  if(s.book === 'monster' && s.clock >= DAWN) target = 699;
  go(s, w, target);
  if(s.book === 'monster' && target === 699) s.status = 'monster-done';
  const blindAfter = inBlindSpot(s);
  markRoom(s);
  if(!blindAfter) s.lastCam = camFor(s);
  if(videoOn && Cut.built && Cut.raf && !Cut.built.plan && !isEnd(s, target)){
    const b = Cut.built, moved = s.place !== placeBefore;
    if(camFor(s) !== camBefore){
      // 別のカメラへ：行き先の方向へ歩いて出ていく（カメラのない部屋から出てきたときは、もう映っていないので歩かない）
      Cut.exitTo = (moved && b.exits?.[s.place]) || b.door || [0, -4];
      Cut.exitStart = blindBefore ? 0 : performance.now();
      Cut.arrive = { from:moved ? placeBefore : null };
    } else if(!blindBefore && blindAfter){
      // 同じカメラのまま、カメラのない部屋へ：扉へ歩いて消える
      if(!b.open){ Cut.exitTo = b.door || [0, -4]; Cut.exitStart = performance.now(); }
    } else if(blindBefore && !blindAfter && Cut.actors){
      // カメラのない部屋から戻る：扉から現れる
      Cut.exitStart = 0; Cut.actors.enterFrom = b.enter || b.door || null; Cut.actors.enterStart = performance.now();
    }
  }

  store.set('world', w); store.set('player-' + current, s);
  render();
  window.scrollTo(0, 0);
}

function tryJump(n){
  if(!canAct()) return;
  const w = loadWorld(), s = loadPlayer(current);
  const p = paraOf(s);
  pushUndo(w, s);
  record(s, `番号 ${n} を打ち込んだ`);
  s.msg = '';
  if(p.jumps && p.jumps.includes(n)) go(s, w, n);
  else {
    s.clock += 5; s.msg = '何も起きない。（5分が過ぎた）';
    const fate = s.book !== 'monster' && s.status === 'active' ? fateTarget(s) : null;
    if(fate) go(s, w, fate);
  }
  store.set('world', w); store.set('player-' + current, s);
  render();
}

// ===== 気配（ほかの人の出来事が届く）とすれ違いの跡 =====
function collectNotices(s, w){
  const out = [];
  for(const [t, text] of TIME_NOTICES){
    if(s.clock >= t && !s.flags['notice_' + t]){ s.flags['notice_' + t] = 1; out.push(text); }
  }
  for(const e of w.events){
    if(s.seen.includes(e.id) || e.t > s.clock) continue;
    if(e.by === s.char && !e.npc) continue;
    s.seen.push(e.id);
    const where = PLACES[e.place];
    if(e.type === 'shot'){
      out.push(e.place === s.place ? 'すぐ近くで銃声がした！' : near(e.place, s.place) ? `${where}の方から銃声が響いた。化け物の群れが、そちらへ流れていく。` : '遠くで、かすかに銃声がした。');
    } else if(e.type === 'noise'){
      out.push(e.text || `${where}の方で、大きな音がした。`);
    } else if(e.type === 'horde' && near(e.place, s.place)){
      out.push(`${where}の方で、化け物の群れが騒いでいる。`);
    } else if(e.type === 'escape'){
      out.push(e.by_car ? '遠くで、車のエンジン音が橋のほうへ遠ざかっていった。' : '港のほうから、ボートのエンジン音が聞こえた。');
    } else if(e.type === 'pass' && s.book === 'monster' && near(e.place, s.place) && s.clock - e.t <= 60){
      out.push(`${where}から、生きた人間のにおいがする。`);
    } else if(e.type === 'flag' && e.notice && near(e.place, s.place)){
      out.push(e.notice);
    }
  }
  return out;
}

function traces(s, w, place){
  const kinds = new Set();
  let robbed = false;
  for(const e of w.events){
    // 一つしかない物は、実際に先に取った人のもの。取られた跡は街の時刻に関係なく残る
    if(e.took && e.place === place && e.by !== s.char) robbed = true;
    if(e.place !== place || e.t >= s.clock || (e.by === s.char && !e.npc)) continue;
    if(e.type === 'pass' && s.clock - e.t > 90) continue;
    kinds.add(e.type);
  }
  const t = [];
  if(kinds.has('shot')) t.push('床に薬莢が転がっている。誰かがここで撃ったらしい。');
  if(kinds.has('search') || robbed) t.push('棚や引き出しが荒らされている。誰かが先に探し回った後だ。');
  if(kinds.has('pass')) t.push('濡れた足跡が新しい。少し前に、誰かがここを通ったようだ。');
  if(kinds.has('horde')) t.push('壁に爪の跡。化け物の群れが通った跡だ。');
  for(const it of w.items[place]) if(!it.hidden && (it.t || 0) <= s.clock) t.push(`誰かが置いていった${it.name}がある。`);
  if(place === 'port') t.push(w.boatUsed ? '桟橋のボートは、もうない。' : '桟橋に小さなボートが一艘つながれている。燃料は空だ。');
  if(place === 'gas') t.push(flag(s, w, 'gas_dark') ? '給油機の明かりは消えていて、スタンドは闇に沈んでいる。' : s.clock < BLACKOUT ? '給油機の明かりだけが、ぽつんと夜に浮いている。' : '停電で、給油機の明かりも消えている。');
  if(place === 'subway' && flag(s, w, 'subway_lights')) t.push('ホームから線路の奥へ、非常灯が点々と灯っている。');
  return t;
}

// ===== 地図：番号付きの街区がびっしり並ぶ古い市街図。行っていない地区は白地図 =====
const MAP_W = 400, MAP_H = 320;
// 主な場所。地区ごとに通りの向き（angle）と区画の大きさ（cw, ch）を変える
const LANDMARKS = {
  mansion:{ x:200, y:38, label:'洋館', district:'N', angle:15, cw:11, ch:9 },
  police:{ x:80, y:100, label:'警察署', district:'W', angle:8, cw:13, ch:10 },
  subway:{ x:74, y:212, label:'地下鉄の駅', district:'W', angle:-12, cw:12, ch:9 },
  shotengai:{ x:196, y:156, label:'メインストリート', district:'C', angle:0, cw:14, ch:9 },

  gas:{ x:332, y:236, label:'スタンド', district:'SE', angle:32, cw:12, ch:9, below:true },
  port:{ x:186, y:280, label:'港', district:'H', angle:4, cw:17, ch:8 },
};
const DISTRICTS = {
  N:{ name:'北', x:268, y:52 }, W:{ name:'西', x:46, y:160 }, C:{ name:'中央', x:238, y:178 },
  E:{ name:'東', x:364, y:140 }, SE:{ name:'南東', x:290, y:268 }, H:{ name:'港', x:112, y:306 },
};
const coastY = x => 287 + 6 * Math.sin(x / 26) + (x > 150 && x < 225 ? 5 : 0);
const riverX = y => 28 + 4 * Math.sin(y / 34);
function mapZone(x, y){
  if(x < riverX(y)) return 'river';
  if(y > coastY(x)) return 'sea';
  if(Math.hypot((x - 200) / 58, (y - 36) / 33) < 1) return 'hill';
  if(Math.hypot((x - 136) / 20, (y - 190) / 14) < 1) return 'park';
  return 'land';
}
function nearestPlace(x, y){
  let best = null, bd = Infinity;
  for(const [k, l] of Object.entries(LANDMARKS)){ const d = Math.hypot(x - l.x, y - l.y); if(d < bd){ bd = d; best = k; } }
  return best;
}
// 毎回同じ形になるよう、決まった値で揺らす
const hash = (a, b, c) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
// 点の列を、なめらかな曲線のパスにする
function smoothPath(pts){
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
const MAP_ROADS = [
  { name:'メインストリート', cls:'main', pts:[[0,93],[40,95],[80,100],[132,126],[196,156],[256,128],[318,96],[400,78]] },
  { name:'駅前通り', cls:'sub', pts:[[80,100],[68,152],[74,212]] },
  { name:'港通り', cls:'main', pts:[[196,156],[214,196],[254,222],[228,258],[186,280]] },
  { name:'丘の坂', cls:'sub', pts:[[196,156],[232,124],[204,104],[236,80],[214,60],[200,38]] },
  { name:'海岸通り', cls:'main', pts:[[32,268],[100,272],[186,280],[262,274],[332,262],[400,250]] },
  { name:'ハイウェイ', cls:'hw', pts:[[400,186],[360,208],[332,236],[290,232],[254,222]] },
  { name:'', cls:'sub', pts:[[318,96],[338,166],[332,236]] },
  { name:'', cls:'sub', pts:[[318,96],[272,62],[200,38]] },
  { name:'', cls:'sub', pts:[[80,100],[132,62],[200,38]] },
  { name:'', cls:'sub', pts:[[74,212],[118,172],[196,156]] },
];

// 街区は一度だけ作る。番号は地区ごとに、上の列から左から右へ 1 番から振る（住所＝地区名＋番号）
const DISTRICT_ORDER = ['N', 'W', 'C', 'E', 'SE', 'H'];
const MAP_BLOCKS = (() => {
  const list = [];
  for(const [owner, l] of Object.entries(LANDMARKS)){
    const ca = Math.cos(l.angle * Math.PI / 180), sa = Math.sin(l.angle * Math.PI / 180);
    const toMap = (a, b) => [l.x + ca * a - sa * b, l.y + sa * a + ca * b];
    const R = 420;
    for(let i = -Math.ceil(R / l.cw); i <= Math.ceil(R / l.cw); i++){
      for(let j = -Math.ceil(R / l.ch); j <= Math.ceil(R / l.ch); j++){
        const wide = i % 2 === 0 && hash(i, j, l.angle) < 0.3;
        if(i % 2 !== 0 && (i - 1) % 2 === 0 && hash(i - 1, j, l.angle) < 0.3) continue; // 左隣とつながった大きな区画
        const w = wide ? 2 : 1;
        const gap = 1.5;
        const pts = [[i * l.cw + gap, j * l.ch + gap], [(i + w) * l.cw - gap, j * l.ch + gap], [(i + w) * l.cw - gap, (j + 1) * l.ch - gap], [i * l.cw + gap, (j + 1) * l.ch - gap]]
          .map(([a, b], k) => toMap(a + (hash(i, j, k) - 0.5) * 1.6, b + (hash(j, i, k) - 0.5) * 1.2));

function mapSvg(s, moves = [], tap = null){

  g += '<ellipse cx="200" cy="36" rx="58" ry="33" class="m-park"/>';
  [[44, 25], [30, 17], [16, 9]].forEach(([rx, ry]) => g += `<ellipse cx="200" cy="36" rx="${rx}" ry="${ry}" class="m-contour"/>`);

  // 街区（今いる地区の街区は、拠点の画面にいるとき押して選べる）

    hospital:(x, y) => `<path d="M${x - 5},${y - 13} h10 v8 h8 v10 h-8 v8 h-10 v-8 h-8 v-10 h8z" class="m-land"/><path d="M${x - 1.5},${y - 6} h3 v4.5 h4.5 v3 h-4.5 v4.5 h-3 v-4.5 h-4.5 v-3 h4.5z" class="m-cross"/>`,
    mansion:(x, y) => `<circle cx="${x}" cy="${y + 2}" r="14" class="m-garden"/><rect x="${x - 10}" y="${y - 6}" width="20" height="12" class="m-land"/><rect x="${x - 3}" y="${y - 10}" width="6" height="5" class="m-land"/>`,
    shotengai:(x, y) => [-24, -14, -4, 6, 16].map(dx => `<rect x="${x + dx}" y="${y - 9}" width="8" height="6" class="m-land"/><rect x="${x + dx}" y="${y + 3}" width="8" height="6" class="m-land"/>`).join(''),

function addProps(T, scene, list){
  for(const [name, x, z, r = 0, o = {}] of (list || [])){
    const g = new T.Group(); PROPS[name](T, g, o); g.position.set(x, 0, z); g.rotation.y = r; scene.add(g);
    if(name === 'door' || o.pass) g.userData.pass = true; // 通れる物（歩ける範囲から除かない）
    if(o.npc) (scene.userData.npcs = scene.userData.npcs || []).push({ g, name:o.npc, gate:name === 'gate', home:[x, z, r], exit:o.exit || null, fall:o.fall, state:null });
  }
}

// 明かり：fluo（蛍光灯）・warm（裸電球）・dim（ほぼ暗闇）。停電後は非常灯（赤）に変わる。gen:true は発電機があって停電しない
function addLights(T, scene, c, w, d, h){
  const amb = new T.AmbientLight(c.amb || 0x1c2433, c.ambI || (c.light === 'dim' ? 2.4 : 1.5)); scene.add(amb);
  const list = [];
  const spots = c.lamps || [[0, 0]];
  for(const [x, z] of spots){
    const col = c.light === 'warm' ? 0xffc880 : c.light === 'green' ? 0x40ff80 : 0xd8e4ec;
    const base = c.light === 'dim' ? 1.2 : 2.2;
    const tube = glow(T, c.light === 'warm' ? .16 : 1.2, .05, c.light === 'warm' ? .16 : .24, col, x, h - .06, z); scene.add(tube);
    const l = new T.PointLight(col, base, Math.max(w, d) * 1.3, 1.4); l.position.set(x, h - .4, z); scene.add(l);
    list.push({ tube, l, fl:flicker(l, base, c.light === 'warm' ? .02 : .06) });
  }
  const emer = new T.PointLight(0xff3020, 0, Math.max(w, d) * 1.6, 1.4); emer.position.set(-w / 2 + .4, h - .4, -d / 2 + .4); scene.add(emer);
  return (t, st) => {
    const on = c.gen || !st.blackout;
    list.forEach(({ tube, fl }) => { const f = fl(on); tube.material.color.setScalar(on ? .25 + .7 * f : .06); });
    emer.intensity = on ? 0 : 1.4 + Math.sin(t * 3) * .3;
  };
}

function buildRoom(T, scene, c){
  const [w, d, h] = c.size;
  scene.background = new T.Color(0x020304);
  scene.fog = new T.Fog(0x020304, Math.max(w, d) * .7, Math.max(w, d) * 2.4 + 6);
  const fl = FLOORS[c.floor || 'tile'];
  scene.add(flat(T, w, d, c.floorTex ? TM(T, c.floorTex, w / 2, d / 2) : psxMat(T, { map:tileTex(T, fl[0], fl[1], Math.max(1, w / 2), Math.max(1, d / 2)) }), 0, 0, 0));
  const wl = WALLS[c.wall || 'gray'];
  const wm = c.wallTex ? TM(T, c.wallTex, Math.max(w, d) / 1.6, h / 1.6, c.wallC) : psxMat(T, { map:wallTex(T, wl[0], wl[1], Math.max(1, w / 4), 1) });
  if(c.wallTex) scene.add(box(T, w, 1.3, .22, M(T, c.band || 0x2a4a7a), 0, .65, -d / 2 + .02), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), -w / 2 + .02, .65, 0), box(T, .22, 1.3, d, M(T, c.band || 0x2a4a7a), w / 2 - .02, .65, 0));
  scene.add(box(T, w, h, .2, wm, 0, h / 2, -d / 2), box(T, .2, h, d, wm, -w / 2, h / 2, 0), box(T, .2, h, d, wm, w / 2, h / 2, 0));
  scene.add(box(T, w, .1, d, M(T, 0x101214), 0, h + .05, 0));
  const side = c.camLeft ? -1 : 1;
  const camera = new T.PerspectiveCamera(c.fov || 74, RES_W / RES_H, .1, 80);
  camera.position.set(side * (w / 2 - .35), h - .25, d / 2 - .35);
  camera.lookAt(-side * w * .18, .4, -d * .22);
  addProps(T, scene, c.props);
  const lights = addLights(T, scene, c, w, d, h);
  return { camera, room:true, door:[side * (w / 2 - .6), d / 2 + 1.6], zone:[-w / 2 + .7, w / 2 - .7, -d / 2 + .7, d / 2 - .9], you:c.you || [-side * .3, d * .12], youFace:Math.PI, cross:null,
    update(t, st){ lights(t, st); } };
}

function buildOut(T, scene, c){
  const [w, d] = c.size;
  scene.background = c.day ? skyTex(T, c.night) : new T.Color(c.sky || 0x03050a);
  scene.fog = c.night ? new T.Fog(0x0b0f18, 10, 52) : new T.Fog(c.fogC || (c.day ? 0xb4b6ae : 0x05080c), c.fog ? c.fog[0] : 6, c.fog ? c.fog[1] : 26);
  const fl = FLOORS[c.floor || 'asphalt'];
  if(c.day) townGround(T, scene, c); else scene.add(flat(T, w, d, psxMat(T, { map:tileTex(T, fl[0], fl[1], w / 2, d / 2) }), 0, 0, 0));
  if(c.water){ const wt = flat(T, 80, 80, M(T, 0x0e1a20), 0, -.6, -20); scene.add(wt); }
  const camera = new T.PerspectiveCamera(c.fov || 70, RES_W / RES_H, c.day ? .8 : .1, c.day ? 140 : 90);
  camera.position.set(...(c.cam || [w / 2 - .5, 5, d / 2 - .5])); camera.lookAt(...(c.look || [0, .5, -d * .2]));
  addProps(T, scene, c.props);

  brick(g, w, h){ g.fillStyle = '#8c7868'; g.fillRect(0, 0, w, h); const cols = ['#9a4e3a', '#8c4634', '#a4573f', '#7e3f30', '#93503a']; let i = 0; for(let y = 0; y < h; y += 4) for(let x = (y / 4 % 2) * -4; x < w; x += 8){ g.fillStyle = cols[(i++ * 7 + y) % cols.length]; g.fillRect(x, y, 7, 3); } },

function townTex(T, kind, rx = 1, ry = 1){ return psxTex(T, 32, 32, (g, w, h) => TOWN_TEX[kind](g, w, h), rx, ry); }
function TM(T, kind, rx, ry, color){ return psxMat(T, { map:townTex(T, kind, rx, ry), ...(color != null ? { color } : {}) }); }
// 文字の入った板（貼り紙・看板）
function textTex(T, lines, bg, fg, w = 48, h = 32){
  return psxTex(T, w, h, (g, W, H) => { g.fillStyle = bg; g.fillRect(0, 0, W, H); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; const lh = H / lines.length; g.font = `bold ${Math.floor(Math.min(lh * .78, W / Math.max(...lines.map(l => l.length)) * 1.5))}px sans-serif`; lines.forEach((l, i) => g.fillText(l, W / 2, lh * (i + .55))); });
}
// 地面に落ちる影（朝の低い日なので、物の片側に伸びる）
function shade(T, w, d, dx = 0, dz = 0, a = .34){ const m = flat(T, w, d, new T.MeshBasicMaterial({ color:0x0a0c10, transparent:true, opacity:a, depthWrite:false }), dx, .1, dz); m.renderOrder = 1; return m; }
// 曇りがちな朝の空：上は灰青、地平線は白っぽい
function skyTex(T, night){
  const c = document.createElement('canvas'); c.width = 4; c.height = 64; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 64);
  if(night){ gr.addColorStop(0, '#05070d'); gr.addColorStop(.5, '#0b1020'); gr.addColorStop(.64, '#1a1c2a'); gr.addColorStop(1, '#0b0f18'); }
  else { gr.addColorStop(0, '#6f8194'); gr.addColorStop(.45, '#9aa6ae'); gr.addColorStop(.62, '#c4c2b4'); gr.addColorStop(1, '#b4b6ae'); }
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; return t;
}
// 地面：芝の上に、道・歩道・駐車場を帯で敷く。[種類, 中心x, 中心z, 幅, 奥行き]。遠くは木立と屋根で埋める
function townGround(T, scene, c){
  if(c.base === 'water') scene.add(flat(T, 400, 400, TM(T, 'water', 100, 100), 0, -9, 0)); else scene.add(flat(T, 260, 260, TM(T, 'grass', 130, 130), 0, -.12, 0));
  (c.ground || []).forEach(([kind, x, z, w, d], i) => {
    if(kind === 'curb') scene.add(box(T, w, .14, d, M(T, 0x8f8c84), x, .07, z));
    else scene.add(flat(T, w, d, TM(T, kind, w / 2, d / 2), x, i * .008, z));
  });
  const r = seeded(c.seed || 13), cols = [0x8a5a34, 0x9a7a3a, 0x6a4a34, 0x5a5a3c, 0x7a6038];
  for(let i = 0; i < 26; i++){
    const far = i < 18, x = far ? -62 + i * 7.2 + r() * 3 : (i % 2 ? -1 : 1) * (30 + r() * 10), z = far ? -(c.back || 30) - r() * 10 : -24 + (i - 18) * 6;
    const m = new T.Mesh(new T.IcosahedronGeometry(3.2 + r() * 2.4, 0), psxMat(T, { color:cols[i % cols.length], flatShading:true }));
    m.position.set(x, 4.4 + r() * 2, z); scene.add(m, box(T, .6, 5, .6, M(T, 0x3a3028), x, 2.5, z));
    if(far && i % 3 === 1) scene.add(box(T, 8, 3.4, 5, M(T, [0xa8a498, 0x8c949a, 0xb0a48c][i % 3]), x + 3.4, 1.7, z + 7), box(T, 8.6, 1.2, 5.6, M(T, 0x463a34), x + 3.4, 4, z + 7));
  }
}

        const l = new T.PointLight(0xffd8a0, 3, 17, 1.3); l.position.set(lx, 4.4, lz); scene.add(l);
        lamps.push({ tube:head, fl:flicker(l, 3, .04), gen:false });
        continue;
      }
      const col = r.light === 'warm' ? 0xffc880 : 0xd8e4ec, base = r.light === 'dim' ? 1 : 1.9;
      const tube = glow(T, r.light === 'warm' ? .16 : 1.2, .05, r.light === 'warm' ? .16 : .24, col, lx, h - .06, lz); scene.add(tube);
      const l = new T.PointLight(col, base, Math.max(w, d) * 1.1 + 2, 1.5); l.position.set(lx, h - .4, lz); scene.add(l);
      lamps.push({ tube, fl:flicker(l, base, r.light === 'warm' ? .02 : .05), gen:!!r.gen });
    }
  }
  scene.add(new T.AmbientLight(0x1c2433, 1.5));
  if(O){ const moon = new T.DirectionalLight(0x8fa0c0, 1.1); moon.position.set(-4, 10, 3); scene.add(moon); scene.add(new T.AmbientLight(0x2a3448, 1.2)); }
  const extra = PLAN_EXTRAS[plan] ? PLAN_EXTRAS[plan](T, scene, floor) : null;
  // 停電後は非常灯（赤）
  const fr = Object.values(P.rooms).filter(r => r.floor === floor);
  const ex = (Math.min(...fr.map(r => r.rect[0])) + Math.max(...fr.map(r => r.rect[2]))) / 2, ez = (Math.min(...fr.map(r => r.rect[1])) + Math.max(...fr.map(r => r.rect[3]))) / 2;
  const emer = new T.PointLight(0xff3020, 0, 40, 1.1); emer.position.set(ex, 2.6, ez); if(!O) scene.add(emer);
  // 正面玄関の外で回る赤色灯
  const siren = P.siren && P.siren.floor === floor ? new T.SpotLight(0xff1a10, 3, 24, .5, .6, 1.2) : null;
  if(siren){ siren.position.set(...P.siren.pos); scene.add(siren, siren.target); }
  const upd = (t, st) => {
    lamps.forEach(({ tube, fl, gen }) => { const on = gen || !st.blackout; const f = fl(on); tube.material.color.setScalar(on ? .25 + .7 * f : .06); });
    emer.intensity = st.blackout ? 1.6 + Math.sin(t * 3) * .3 : 0;
    if(water) water.position.y = -.6 + Math.sin(t * .7) * .03;
    if(extra) extra(t, st);
    for(const n of scene.userData.npcs || []) npcStep(n, t, st);
    if(siren){ const a = t * 2.6, [sx, sz] = P.siren.center; siren.target.position.set(sx + Math.cos(a) * 8, .3, sz + Math.sin(a) * 5); }
  };
  upd.walls = walls;
  return upd;
}

// 館内図（旧作ホラー風）。行った部屋だけ色が付き、今いる部屋が光る
let planFloorView = null;
function planMapSvg(s, plan, taps = null, risks = {}){
  const P = PLANS[plan], here = planOf(s);
  const floor = planFloorView && P.floors.includes(planFloorView) ? planFloorView : here ? here.floor : P.rooms[P.hub].floor;
  const seen = new Set(s.rooms || []);
  const rooms = Object.entries(P.rooms).filter(([, r]) => r.floor === floor);
  const xs = rooms.flatMap(([, r]) => [r.rect[0], r.rect[2]]), zs = rooms.flatMap(([, r]) => [r.rect[1], r.rect[3]]);
  const minX = Math.min(...xs) - 1, maxX = Math.max(...xs) + 1, minZ = Math.min(...zs) - 1, maxZ = Math.max(...zs) + 1.5;
  const S = 12, W = (maxX - minX) * S, H = (maxZ - minZ) * S;
  const X = x => ((x - minX) * S).toFixed(1), Z = z => ((z - minZ) * S).toFixed(1);
  let g = '';
  for(const [id, r] of rooms){
    const [x0, z0, x1, z1] = r.rect, key = `${plan}:${id}`;
    const isHere = here && here.room === id, known = seen.has(key);
    g += `<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1 - x0) * S}" height="${(z1 - z0) * S}" class="pm-room${known ? ' known' : ''}${isHere ? ' here' : ''}${r.cams ? '' : ' nocam'}${taps && taps[id] ? ' pick' : ''}"${taps && taps[id] ? ` data-spot="${taps[id]}"` : ''}/>`;
    if(known || isHere || (taps && taps[id]) || risks[id] || bookOf(s).spots) g += `<text x="${X((x0 + x1) / 2)}" y="${Z((z0 + z1) / 2)}" class="pm-name">${r.name}</text>`;
    if(r.cams && known) g += `<text x="${+X(x1) - 5}" y="${+Z(z0) + 11}" class="pm-cam">●</text>`;
  }
  for(const d of P.doors.map(([a, b, x, z, w = 1.2, label = '']) => ({ a, b, x, z, w, label })).filter(d => P.rooms[d.a].floor === floor)){
    const horiz = Object.values(P.rooms).some(r => r.floor === floor && (Math.abs(r.rect[1] - d.z) < .01 || Math.abs(r.rect[3] - d.z) < .01) && d.x > r.rect[0] && d.x < r.rect[2]);
    g += horiz ? `<rect x="${X(d.x - d.w / 2)}" y="${Z(d.z) - 2}" width="${d.w * S}" height="4" class="pm-door"/>` : `<rect x="${X(d.x) - 2}" y="${Z(d.z - d.w / 2)}" width="4" height="${d.w * S}" class="pm-door"/>`;
    if(d.b[0] === '@' && d.label) g += `<text x="${X(d.x)}" y="${+Z(d.z) + (horiz ? 14 : 4)}" class="pm-exit">${d.label}</text>`;
  }
  const tabs = P.floors.map(f => `<button data-floor="${f}" class="${f === floor ? 'on' : ''}">${f}</button>`).join('');
  return `<div class="planmap"><div class="pm-head"><b>${P.name}</b><span class="pm-tabs">${tabs}</span></div>`
    + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${P.name} ${floor}">${g}</svg>`
    + `<p>${taps ? '金色の枠の部屋を押すと、そこへ移る。' : ''}色の付いた部屋は行ったことのある部屋。光っているのが今いる部屋。● は監視カメラのある部屋。</p></div>`;
}

  return {

// 映っている最中に変わったら、動きを見せる（扉が開く・走って出ていく・倒れる）。
// 組み立てた直後と、手を戻したときは、動きを見せずにその状態にする
function npcStep(n, t, st){
  const want = st.npc?.[n.name] || 'in', g = n.g, f = g.userData.fig, [hx, hz, hr] = n.home;
  const dt = Math.min(.1, Math.max(0, t - (n.t ?? t))); n.t = t;
  if(want !== n.state){
    const jump = n.state === null || want === 'in';
    n.state = want; n.rest = false; n.k = jump ? 1 : 0; n.d = jump ? 1e9 : 0;
    g.visible = true; g.position.set(hx, 0, hz); g.rotation.y = hr;
    if(f){ g.userData.pose(); f.userData.shadow.visible = true; f.userData.spd = 0; }
    if(want === 'in') n.rest = true;
  }
  if(n.rest) return;
  n.k = Math.min(1, n.k + dt / .5);
  if(n.gate){ g.rotation.y = hr - (want === 'gone' ? 1.5 * n.k * n.k * (3 - 2 * n.k) : 0); n.rest = n.k >= 1; return; }
  if(want === 'down'){
    const a = 1.5 * n.k * n.k;
    if(n.fall === 'side') f.rotation.z = a; else f.rotation.x = -a;
    f.position.y = .12 * n.k; f.userData.shadow.visible = false; n.rest = n.k >= 1; return;
  }
  if(!n.exit){ g.visible = false; n.rest = true; return; }
  if(n.k < .7 || dt <= 0) return; // 扉が開くのを一拍待つ
  const pts = [[hx, hz], ...n.exit], step = 3.2 * dt;
  n.d += step;
  if(n.d >= pathLen(pts)){ g.visible = false; n.rest = true; return; }
  const [x, z, dx, dz] = pathAt(pts, n.d);
  g.position.set(x, 0, z); turnTo(g, Math.atan2(dx, dz), 14 * dt); gaitRun(f, step, dt);
}

function setCutscene(st){

  Cut.lagSt = st;
  if(!Cut.lagT) Cut.lagT = setTimeout(() => { Cut.lagT = 0; applyCutscene(Cut.lagSt); }, ms);
}
function applyCutscene(st){
  const wrap = document.getElementById('cutscene');
  if(!videoOn){ cancelAnimationFrame(Cut.raf); Cut.raf = 0; Cut.key = null; wrap.hidden = true; return; }
  wrap.hidden = false;
  const nextKey = `${st.cam}:${st.you}:${st.monster}`;
  // 別のカメラへ移るときは、いまの場面で出口まで歩ききってから切り替える
  if(Cut.key && Cut.key !== nextKey && Cut.built?.plan && !Cut.exitStart && Cut.raf && st.you === Cut.state.you) planLeave(st);
  const left = Cut.exitStart ? (Cut.exitMs || EXIT_MS) - (performance.now() - Cut.exitStart) : 0;
  if(Cut.key && Cut.key !== nextKey && left > 0){ clearTimeout(Cut.pendingT); Cut.pendingSt = st; Cut.pendingT = setTimeout(() => applyCutscene(Cut.pendingSt), left + 20); return; }
  const def = CAM_DEFS[st.cam];

  Cut.who = CHARS[st.you].osd;

  if(!st.plan){ document.getElementById('camName').textContent = Cut.mainName; document.getElementById('camTarget').textContent = Cut.mainTarget; }
  Cut.hidShown = null;

  if(st.clock !== Cut.state.clock){ Cut.clockBase = st.clock; Cut.clockAt = performance.now(); }
  Cut.state = st;
  const key = nextKey;

    if(Cut.exitStart){ clearTimeout(Cut.pendingT); Cut.exitStart = 0; Cut.exitMs = 0; if(Cut.built?.plan) Cut.built.target = null; }

// 行った部屋を覚える（館内図の色分けに使う）
function markRoom(s){
  const pl = planOf(s);
  if(!pl){ s.lastRoom = null; return; }
  s.rooms = s.rooms || [];
  const P = PLANS[pl.plan], [lp, lr] = (s.lastRoom || '').split(':');
  let path = [pl.room];
  if(lp === pl.plan && P.rooms[lr]){
    // 同じ階なら通った部屋、別の階なら両方の階段まで
    if(P.rooms[lr].floor === pl.floor) path = planRouteRooms(pl.plan, pl.floor, lr, pl.room);
    else path = [...planRouteRooms(pl.plan, P.rooms[lr].floor, lr, stairsOf(P, P.rooms[lr].floor, pl.floor)), ...planRouteRooms(pl.plan, pl.floor, stairsOf(P, pl.floor, P.rooms[lr].floor), pl.room)];
  }
  for(const r of path){ const key = `${pl.plan}:${r}`; if(!s.rooms.includes(key)) s.rooms.push(key); }
  s.lastRoom = `${pl.plan}:${pl.room}`;
}

// ===== 見取り図の建物の中の映像 =====
// 歩ける場所の地図。組み上がった場面の実物（壁・机・棚・車…）から作り、人物はこの上だけを歩く
const NAV_CELL = .2, NAV_R = .28;
function makeNav(T, scene, plan, floor, area){
  const rooms = area ? [{ rect:area }] : Object.values(PLANS[plan].rooms).filter(r => r.floor === floor), doors = area ? [] : planDoors(plan, floor);
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  for(const r of rooms){ x0 = Math.min(x0, r.rect[0], r.rect[2]); z0 = Math.min(z0, r.rect[1], r.rect[3]); x1 = Math.max(x1, r.rect[0], r.rect[2]); z1 = Math.max(z1, r.rect[1], r.rect[3]); }
  x0 -= .8; z0 -= .8; x1 += .8; z1 += .8;
  const C = NAV_CELL, W = Math.ceil((x1 - x0) / C), H = Math.ceil((z1 - z0) / C), N = W * H, cell = new Uint8Array(N);
  const cx = i => x0 + (i + .5) * C, cz = j => z0 + (j + .5) * C;
  // 床のある所（部屋の中と、扉の開口）
  for(let j = 0; j < H; j++) for(let i = 0; i < W; i++){
    const x = cx(i), z = cz(j);
    if(rooms.some(r => x >= Math.min(r.rect[0], r.rect[2]) && x <= Math.max(r.rect[0], r.rect[2]) && z >= Math.min(r.rect[1], r.rect[3]) && z <= Math.max(r.rect[1], r.rect[3]))
      || doors.some(d => Math.hypot(d.x - x, d.z - z) <= Math.max((d.w || 0) / 2, .3))) cell[j * W + i] = 1;
  }
  // 物のある所を塞ぐ（腰から頭の高さにかかる物だけ。体の幅のぶん太らせる）
  scene.updateMatrixWorld(true);
  const bx = new T.Box3();
  scene.traverse(o => {
    if(!o.isMesh) return;
    for(let p = o; p; p = p.parent) if(p.userData && p.userData.pass) return;
    bx.setFromObject(o);
    if(!(bx.max.y >= .25 && bx.min.y <= 1.5)) return;
    const i0 = Math.max(0, Math.floor((bx.min.x - NAV_R - x0) / C)), i1 = Math.min(W - 1, Math.floor((bx.max.x + NAV_R - x0) / C));
    const j0 = Math.max(0, Math.floor((bx.min.z - NAV_R - z0) / C)), j1 = Math.min(H - 1, Math.floor((bx.max.z + NAV_R - z0) / C));
    for(let j = j0; j <= j1; j++) for(let i = i0; i <= i1; i++){
      const x = cx(i), z = cz(j);
      if(x >= bx.min.x - NAV_R && x <= bx.max.x + NAV_R && z >= bx.min.z - NAV_R && z <= bx.max.z + NAV_R) cell[j * W + i] = 0;
    }
  });
  // つながっている範囲ごとに番号を振る。人が入れない小さなすき間は塞ぐ
  const comp = new Int32Array(N).fill(-1), sizes = [];
  for(let s = 0; s < N; s++){
    if(!cell[s] || comp[s] >= 0) continue;
    const id = sizes.length, q = [s]; comp[s] = id;
    for(let h = 0; h < q.length; h++){
      const c = q[h], i = c % W, j = (c / W) | 0;

// 見張り役：主人公のいる部屋のカメラに切り替える。カメラのない部屋なら、今のカメラのまま
const LOSE_MS = 700;   // 見失ってから切り替えるまで

// 主人公が物陰に隠れたら、見張り役はその裏を映すカメラに切り替える（なければ見失う）

  const b = Cut.built, cam = Cut.camera, wrap = document.getElementById('cutscene');

// 前の場面の部品と画像を片付ける（カメラを切り替えるたびに溜まらないように）
function disposeScene(sc){
  sc.traverse(o => {
    if(o.geometry) o.geometry.dispose();

    g.fillStyle = 'rgba(255,60,60,.35)'; g.fillText(text, x - 1, y); // 色のにじみ
    g.fillStyle = color; g.fillText(text, x, y);
  };
  put(txt('camName'), 6, 13, 'left', '#e8f0e0', W - 52);
  if(Math.floor(now / 500) % 2) put('● REC', W - 32, 13, 'right', '#ff4a3a', 44);
  put(txt('camTime'), W - 6, H - 6, 'right', '#e8f0e0', 110);
  put(txt('camTarget'), 6, H - 6, 'left', '#e8f0e0', W - 124);
}

// カメラを切り替えた瞬間の砂嵐：はじめは画面いっぱい、あとは帯が下へ流れて消える
function drawStatic(g, W, H, k){
  const img = g.createImageData(W, H), d = img.data;
  const full = k < .6, band = ((k - .6) / .4) * (H + 30) - 15;
  for(let y = 0; y < H; y++){
    const inBand = !full && Math.abs(y - band) < 12, streak = full && Math.random() < .08;
    if(!full && !inBand && Math.random() > .25) continue;
    for(let x = 0; x < W; x += 2){
      if(!full && !inBand && Math.random() > .12) continue;
      const v = streak ? 200 + Math.random() * 55 : Math.random() * 235, a = full ? 255 : inBand ? 220 : 150;
      for(let i = (y * W + x) * 4, e = i + 8; i < e; i += 4){ d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    }
  }
  g.putImageData(img, 0, 0);
}

// 頂点を粗い格子に吸い付かせる（ポリゴンがカクカク揺れる）材質
function psxMat(T, params){
  const m = new T.MeshLambertMaterial(params);
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * vec2(120.0, 68.0) + 0.5) / vec2(120.0, 68.0) * gl_Position.w;');
  };
  return m;
}
function psxTex(T, w, h, draw, rx = 1, ry = 1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.magFilter = t.minFilter = T.NearestFilter;
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
function box(T, w, h, d, mat, x, y, z){ const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; }
function flat(T, w, d, mat, x, y, z, rot = 0){ const m = new T.Mesh(new T.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, y, z); return m; }
function glow(T, w, h, d, color, x, y, z){ return box(T, w, h, d, new T.MeshBasicMaterial({ color }), x, y, z); }
const tileTex = (T, a, b, rx, ry) => psxTex(T, 16, 16, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h); g.fillStyle = b; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8);
  g.fillStyle = 'rgba(0,0,0,.25)'; for(let i = 0; i < 18; i++) g.fillRect((i * 7) % 16, (i * 11) % 16, 1, 1);
}, rx, ry);
const wallTex = (T, a, b, rx, ry) => psxTex(T, 16, 16, (g, w, h) => {
  g.fillStyle = a; g.fillRect(0, 0, w, h); g.fillStyle = b; g.fillRect(0, 11, w, 5);
  g.fillStyle = 'rgba(0,0,0,.22)'; for(let i = 0; i < 10; i++) g.fillRect((i * 5) % 16, (i * 3) % 11, 1, 2);
}, rx, ry);
// ちらつく明かり
function flicker(light, base, rate = .07){
  let f = 1;
  return (on = true) => {
    if(Math.random() < rate) f = Math.random() < .5 ? .05 : .45; else f += (1 - f) * .5;
    light.intensity = on ? base * f : 0;
    return f;
  };
}

// ===== 人物：旧作ホラー風の頭身（約8頭身）の、関節付きの人形。荒い映像でも誰だか分かるよう、服の柄・帽子・足元の影を付ける =====
function texCanvas(T, w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'));
  const t = new T.CanvasTexture(c); t.magFilter = t.minFilter = T.NearestFilter; return t;
}
// 面ごとに明るさが変わる（角ばって見える）材質
function fmat(T, p){ const m = psxMat(T, p); m.flatShading = true; return m; }
function faceTex(T, o){
  return texCanvas(T, 16, 16, g => {
    const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    R(o.skin, 0, 0, 16, 16);
    R('rgba(0,0,0,.16)', 0, 4, 1, 12); R('rgba(0,0,0,.16)', 15, 4, 1, 12); R('rgba(0,0,0,.14)', 0, 14, 16, 2);
    R(o.hair, 0, 0, 16, o.hairH || 4);
    if(o.zombie){
      R('#0d0606', 3, 6, 4, 4); R('#0d0606', 9, 6, 4, 4);                 // 落ちくぼんだ目
      R('#d0d0a8', 5, 8, 1, 1); R('#d0d0a8', 10, 7, 1, 1);
      R('rgba(40,50,30,.5)', 1, 5, 3, 2); R('rgba(40,50,30,.5)', 11, 10, 3, 2);
      R('#8a0c0c', 4, 12, 8, 4); R('#8a0c0c', 3, 10, 2, 5); R('#8a0c0c', 11, 13, 2, 3); // 口のまわりの血
      R('#2a0404', 5, 11, 6, 3); R('#b8b090', 6, 11, 4, 1);               // 開いた口と歯
    } else {
      R(o.hair, 3, 6, 4, 1); R(o.hair, 9, 6, 4, 1);                       // 眉
      R('#1a1010', 4, 7, 2, 2); R('#1a1010', 10, 7, 2, 2);                // 目
      R('rgba(0,0,0,.2)', 7, 8, 2, 3);                                    // 鼻の影
      R('rgba(100,30,30,.7)', 6, 12, 4, 1);                               // 口
    }
  });
}
// 頭の横。前側（flip で左右を返す）に顔、後ろ側に髪、まんなかに耳
function sideTex(T, o, flip){
  return texCanvas(T, 16, 16, g => {
    const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(flip ? 16 - x - w : x, y, w, h); };
    R(o.skin, 0, 0, 16, 16);
    R('rgba(0,0,0,.14)', 0, 14, 16, 2);
    R(o.hair, 0, 0, 16, (o.hairH || 4) + 1); R(o.hair, 9, 0, 7, 11);
    R('rgba(0,0,0,.3)', 6, 7, 2, 3);
    if(o.zombie){ R('#8a0c0c', 0, 11, 4, 4); R('rgba(40,50,30,.5)', 3, 6, 3, 3); }
  });
}
function clothTex(T, o){
  return texCanvas(T, 16, 16, g => {
    g.fillStyle = o.base; g.fillRect(0, 0, 16, 16);
    if(o.detail) o.detail(g);
    if(o.torn){ g.fillStyle = o.skin; [[1, 11, 3, 5], [12, 5, 4, 3], [7, 14, 3, 2]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h)); }
    if(o.blood){
      g.fillStyle = 'rgba(115,10,10,.9)'; [[3, 4, 4, 3], [9, 8, 5, 4], [6, 12, 3, 4], [11, 1, 3, 2]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
      g.fillStyle = 'rgba(60,0,0,.9)'; g.fillRect(4, 6, 2, 7); g.fillRect(10, 11, 1, 5);
    }
  });
}
// 胴に巻く服の絵。R(色, 横, 縦, 幅, 高さ) の「横」は胸のまんなかからの位置（＋が本人の左）。胸の正面は −4〜3、背中は ±20〜24
function wrapTex(T, h, draw){
  return texCanvas(T, 48, h, g => {
    const R = (color, x, y, w, hh) => { g.fillStyle = color; const px = ((44 + x) % 48 + 48) % 48; g.fillRect(px, y, w, hh); if(px + w > 48) g.fillRect(px - 48, y, w, hh); };
    draw(R, g);
  });
}
function limb(T, rt, rb, h, mat){ const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, 6), mat); m.position.y = -h / 2; return m; }
function at(m, x, y, z){ m.position.set(x, y, z); return m; }

function humanoid(T, o){
  const g = new T.Group();
  const hex = c => typeof c === 'string' ? parseInt(c.slice(1), 16) : c;
  const skin = fmat(T, { color:hex(o.skinColor) });
  const sleeve = fmat(T, { color:hex(o.sleeve) });
  const pants = fmat(T, { map:clothTex(T, o.pants) });
  const shoe = fmat(T, { color:hex(o.shoe ?? 0x1a1a1a) });
  const hand = o.hand ? fmat(T, { color:hex(o.hand) }) : skin;
  const six = (rt, rb, h, mats) => new T.Mesh(new T.CylinderGeometry(rt, rb, h, 6, 1, false, Math.PI / 6), mats);
  const HIP = .92;
  // 上半身は腰を軸に動く。胸は腹より広く、前後は薄い
  const body = new T.Group(); body.position.y = HIP; g.add(body);
  body.add(box(T, .34, .16, .21, pants, 0, .03, 0));
  const belly = at(six(.18, .17, .22, [fmat(T, { map:o.low }), sleeve, sleeve]), 0, .19, 0); belly.scale.z = .68; body.add(belly);
  const chest = new T.Group(); chest.position.y = .27; body.add(chest);
  const torso = at(six(.225, .18, .33, [fmat(T, { map:o.top }), sleeve, sleeve]), 0, .165, 0); torso.scale.z = .66; chest.add(torso);
  const slope = at(six(.1, .225, .06, sleeve), 0, .36, 0); slope.scale.z = .66; chest.add(slope);
  if(o.skirt){ // 白衣・病院着のすそ
    const sk = at(new T.Mesh(new T.CylinderGeometry(.19, .245, .5, 6, 1, true, Math.PI / 6), fmat(T, { map:o.skirt, side:T.DoubleSide })), 0, -.1, 0); sk.scale.z = .72; body.add(sk);
  }
  if(o.holster) body.add(box(T, .06, .17, .11, fmat(T, { color:0x0b0b0e }), -.2, 0, .01));
  // 首と頭（頭は身長の約8分の1）
  const neck = new T.Group(); neck.position.y = .385; chest.add(neck);
  neck.add(at(new T.Mesh(new T.CylinderGeometry(.055, .065, .09, 6), skin), 0, .035, 0));
  const hair = fmat(T, { color:hex(o.hairColor) });
  neck.add(at(new T.Mesh(new T.BoxGeometry(.19, .23, .21), [fmat(T, { map:sideTex(T, o.face, false) }), fmat(T, { map:sideTex(T, o.face, true) }), hair, skin, fmat(T, { map:faceTex(T, o.face) }), hair]), 0, .19, .01));
  if(o.cap){ // 制帽：上・帯・つば・記章

    neck.add(at(new T.Mesh(new T.CylinderGeometry(.128, .108, .075, 8), cap), 0, .345, 0), at(new T.Mesh(new T.CylinderGeometry(.11, .11, .03, 8), dark), 0, .3, 0));
    neck.add(box(T, .17, .016, .1, dark, 0, .29, .145), box(T, .035, .035, .012, new T.MeshBasicMaterial({ color:0xd8b84a }), 0, .34, .118));
  } else if(!o.bald) neck.add(box(T, .2, .07, .22, hair, 0, .285, 0));
  // 腕：肩・肘・手
  const arm = side => {
    const sh = new T.Group(); sh.position.set(side * .265, .3, 0); sh.rotation.z = side * .06; chest.add(sh);
    sh.add(new T.Mesh(new T.SphereGeometry(.085, 6, 4), sleeve));
    sh.add(limb(T, .07, .06, .3, o.bareArms === 'all' ? skin : sleeve));
    const el = new T.Group(); el.position.y = -.3; sh.add(el);
    el.add(limb(T, .058, .048, .26, o.bareArms ? skin : sleeve));
    el.add(at(new T.Mesh(new T.BoxGeometry(.075, .1, .06), hand), 0, -.31, 0));
    return { sh, el };
  };
  const AL = arm(-1), AR = arm(1);
  // 脚：股・膝・靴
  const leg = side => {
    const hip = new T.Group(); hip.position.set(side * .1, HIP, 0); g.add(hip);
    hip.add(limb(T, .1, .078, .44, pants));
    const kn = new T.Group(); kn.position.y = -.44; hip.add(kn);
    kn.add(limb(T, .075, .058, .42, o.bareLegs ? skin : pants));
    kn.add(box(T, .115, .1, .27, shoe, 0, -.43, .05));
    return { hip, kn };
  };
  const LL = leg(-1), LR = leg(1);
  // 足元の影
  const shadow = new T.Mesh(new T.CircleGeometry(.34, 10), new T.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.4, depthWrite:false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = .02; g.add(shadow);
  g.userData = { body, chest, neck, AL, AR, LL, LR, legL:LL.hip, legR:LR.hip, armL:AL.sh, armR:AR.sh, shadow, HIP, phase:Math.random() * 6, zombie:!!o.zombie,
    crouch(k){
      const hipY = HIP - .42 * k;
      body.position.y = hipY; body.rotation.x = .5 * k;
      [LL, LR].forEach(l => { l.hip.position.y = hipY; l.hip.rotation.x = -1.45 * k; l.kn.rotation.x = 2 * k; });
      AL.sh.rotation.x = AR.sh.rotation.x = -.75 * k; AL.el.rotation.x = AR.el.rotation.x = -.5 * k;
      neck.rotation.x = -.3 * k;
    } };
  return g;
}

let zombieN = 0;
function shambler(T){

// ===== ロックと履歴（Subversion のロックと同じ考え方） =====
// 本を進められるのは、ロックを持っている人が自分の本を開いているときだけ。相手の本は履歴として辿れる
// 本を書き換えたら番号を上げる：前の版の進み具合は、新しい本と食い違うので消す
const SAVE_VER = 15;
if(store.get('ver', 0) !== SAVE_VER){ ['world', 'undo', 'me', 'current', ...CHAR_IDS.map(id => 'player-' + id)].forEach(k => store.remove(k)); store.set('ver', SAVE_VER); }
let me = store.get('me', CHAR_IDS[0]); if(!CHARS[me]) me = CHAR_IDS[0];
let histIndex = null; // 履歴を見ているときの位置（null は最新）
let lastView = null;  // いま画面に出している内容（選んだときに履歴へ残す）
function canAct(){ return loadWorld().lock === me && current === me; }
function takeLock(){ const w = loadWorld(); if(w.lock) return; me = current; store.set('me', me); w.lock = me; store.set('world', w); store.remove('undo'); undoOpen = false; histIndex = null; render(); }
function releaseLock(){ const w = loadWorld(); if(w.lock !== me) return; w.lock = null; store.set('world', w); store.remove('undo'); undoOpen = false; render(); }
// 巻き戻し：ロックを取ってから「保存して交代」を押すまでの自分の手は、何手でも取り消せる。
// 手を打つたびに、打つ前の街と自分の状態を積んでおく（履歴は増えるだけなので、長さだけ覚える）
function undoCount(){ return store.get('undo', []).length; }
function pushUndo(w, s){ const u = store.get('undo', []), { history, ...rest } = s; u.push({ w, s:rest, h:(history || []).length }); store.set('undo', u); }
// i 番目の手を打つ前まで戻す（それより後の手は、すべてなかったことになる）
let undoOpen = false;
function undoTo(i){
  if(!canAct()) return;
  const u = store.get('undo', []), to = u[i];
  if(!to) return;
  store.set('world', to.w);
  const s = { ...to.s };
  if(to.h) s.history = loadPlayer(current).history.slice(0, to.h);
  store.set('player-' + current, s);
  store.set('undo', u.slice(0, i));
  undoOpen = false; selectedBlock = null; render(); window.scrollTo(0, 0);
}
// 戻れるところの一覧（新しい手が上）
function undoListHtml(s){
  const u = store.get('undo', []), hist = s.history || [];
  return '<div class="undolist"><b>どこまで戻しますか</b>'
    + u.map((e, i) => `<div><span>${i + 1}手目　${fmt(e.s.clock)}　${PLACES[e.s.place]}<br><b>${hist[e.h] ? `「${hist[e.h].chosen}」を選ぶ前` : 'この手を打つ前'}</b></span><button data-undo="${i}">ここへ戻す</button></div>`).reverse().join('')
    + '<button id="undoClose">閉じる</button></div>';
}
function record(s, chosen){ if(lastView && lastView.char === s.char) (s.history = s.history || []).push({ ...lastView, chosen }); }


// 今の段落の画面の中身
function buildView(s, w){
  const p = paraOf(s);
  const items = [...Object.entries(s.items).filter(([, n]) => n > 0).map(([k, n]) => `${k}×${n}`), ...(s.samples || []).map(x => x.name)].join('　') || 'なし';
  let text;
  if(p.hub){
    if(p.monster) text = `${PLACES[p.hub]}。生きた人間のにおいを探して、あなたは闇の中をさまよう。`;
    else {
      text = HUB_TEXT[p.hub];
      const line = BOOKS[s.char].hubLine?.[p.hub];
      if(line) text += '\n' + (typeof line === 'function' ? line(s, w) : line);
      text += '\n' + zombieLine(s);
      if(symptom(s)) text += '\n' + symptom(s);
    }
  } else if(p.spot){
    text = spotText(s, w);
  } else if(p.encounter){
    const z = zsHere(s);
    text = z && z.aware
      ? `${ZOMBIE_SPOT[s.place]}にいた化け物が、こちらに気づいた！${z.n > 1 ? `（${z.n}体）` : ''}\n濁った目が、まっすぐこちらを向いている。`
      : `${PLACES[s.place]}へ向かう途中で、化け物に出くわした！\n濁った目が、まっすぐこちらを向いている。`;
  } else {
    text = typeof p.text === 'function' ? p.text(s, w) : p.text;
  }
  const choices = choicesOf(s, w);
  const menuTitle = p.hub && !p.monster && s.menu ? ({ explore:'この場所を調べる', items:'持ち物', move:'ほかの場所へ移動する' }[s.menu] || s.menu.replace('explore:', 'この場所を調べる › ')) : '';
  return {
    char:s.char, para:s.para, place:s.place, cam:camFor(s), monster:s.book === 'monster', encounter:!!p.encounter,
    clock:s.clock, hp:s.hp, items, wounds:s.wounds || 0, msg:s.msg || '', text,
    radio:p.hub && !p.monster ? radio(s.clock) : '', traces:p.hub ? traces(s, w, p.hub) : [],
    menuTitle, labels:choices.map(ch => ch.label), disabled:choices.map(ch => !!ch.disabled), choices,
  };
}

function statHtml(v){
  let stat = `<span>時刻 <b>${fmt(v.clock)}</b></span>`;
  if(v.monster) return stat + '<span class="infect">化け物</span>';
  stat += `<span>体力 <b>${'●'.repeat(Math.max(0, v.hp))}${'○'.repeat(Math.max(0, 3 - v.hp))}</b></span><span>持ち物 <b>${v.items}</b></span>`;
  if(v.wounds) stat += `<span class="infect">腕の傷×${v.wounds}</span>`;
  return stat;
}
function viewHtml(v, opt){
  let html = '';
  if(opt.notices && opt.notices.length) html += `<div class="notice">${opt.notices.join('\n')}</div>`;
  if(v.msg) html += `<div class="msg">${v.msg}</div>`;
  html += `<div class="no">${v.para}</div>`;
  html += `<div class="text">${v.text}</div>`;
  if(v.radio) html += `<div class="radio">${v.radio}</div>`;
  if(v.traces.length) html += `<div class="trace">${v.traces.join('\n')}</div>`;
  if(v.menuTitle) html += `<div class="menu-title">${v.menuTitle}</div>`;
  html += '<div class="choices">' + v.labels.map((l, i) => {
    const chosen = opt.chosen === l;
    const off = !opt.interactive || v.disabled[i];
    return `<button data-i="${i}" class="${chosen ? 'chosen' : ''}" ${off ? 'disabled' : ''}>${chosen ? '▶ ' : ''}${l}</button>`;
  }).join('') + '</div>';
  return html;
}

// ===== 表示 =====
let current = store.get('current', CHAR_IDS[0]); if(!CHARS[current]) current = CHAR_IDS[0];
let showMap = false;
let mapOpen = false, helpOpen = false; // 横から出る地図・☰ の「遊び方」

function render(){
  const w = loadWorld(), s = loadPlayer(current);
  if(w.lock && CHARS[w.lock]) me = w.lock; // ロックしている本が、いま進めている本
  const histLen = (s.history || []).length;

  document.getElementById('barbtns').innerHTML = (mode === 'live' && undoCount() ? `<button class="${undoOpen ? 'on' : ''}" id="undobtn">戻す</button>` : '') + `<button class="${menuOpen ? 'on' : ''}" id="menubtn" aria-label="メニュー">☰</button>`;

    const hist = s.history || [];

    const owner = CHARS[current].name;
    const lockNote = w.lock === current ? `${owner}がロック中` : w.lock ? `${CHARS[w.lock].name}がロック中` : '誰もロックしていない';

      + `<span>${!last ? 'まだ何も選んでいない' : idx === last ? `いまここ（${last} 手のあと）` : `${idx + 1} / ${last} 手目`}</span>`
      + `<button id="histNext" ${idx >= last ? 'disabled' : ''}>次へ ▶</button><button id="histLast" ${idx >= last ? 'disabled' : ''}>⏭</button></div></div>`;
    if(idx < last){
      const v = hist[idx];
      document.getElementById('stat').innerHTML = whose + statHtml(v);
      if(showMap) html += mapSvg({ ...s, place:v.place }, [], null);
      html += viewHtml(v, { chosen:v.chosen });
      setCutscene({ place:v.place, cam:v.cam, plan:String(v.cam).startsWith('plan:') ? { plan:v.cam.split(':')[1], room:(PLAN_PARA[v.para]?.plan === v.cam.split(':')[1] && PLAN_PARA[v.para].room) || PLANS[v.cam.split(':')[1]].hub, floor:v.cam.split(':')[2] } : null, you:current, monster:v.monster, ended:false, zombies:v.encounter ? 1 : (BOOKS[s.book].paras[v.para]?.zombies || 0), hideOk:BOOKS[s.book].paras[v.para]?.zombies == null || !!BOOKS[s.book].paras[v.para]?.hide, encounter:v.encounter, other:null, blackout:v.clock >= BLACKOUT, clock:v.clock, lights:false, gasDark:false, boatGone:false, npc:npcState(v.para, { clock:v.clock }, w) });
    } else {
      document.getElementById('stat').innerHTML = whose + `<span>時刻 <b>${fmt(s.clock)}</b></span>`;
      if(showMap) html += mapSvg(s, [], null);
      html += `<div class="no">${s.para}</div><div class="text">${owner}は今、${PLACES[s.place]}にいる。\nこの先は、まだ選ばれていない。</div>`;
      setCutscene(cctvState(s, w));
    }
  } else {
    // 自分の本：ロックしていれば進められる。していなければ見るだけ
    s.visited = s.visited || [];
    if(!s.visited.includes(s.place)) s.visited.push(s.place);
    const notices = mode === 'live' ? collectNotices(s, w) : [];
    if(mode === 'live' && s.book !== 'monster' && !zsHere(s)) arriveZombies(s, w);
    if(mode === 'live') markRoom(s);
    const v = buildView(s, w);
    lastView = v;
    document.getElementById('stat').innerHTML = whose + statHtml(v);
    if(mode === 'live'){ if(undoOpen && undoCount()) html += undoListHtml(s); } // 自分が進めている間は帯を出さない（保存して交代は ☰ の中）
    else if(!w.lock) html += `<div class="lockbar"><b>${CHARS[current].name}の本</b>　ロックすると、この本を進められます<button id="lockBtn">ロックして進める</button>${histLen ? '<button id="histOpen">これまでの履歴を読む</button>' : ''}</div>`;
    else html += `<div class="lockbar other"><b>${CHARS[w.lock].name}がロック中</b>のため、この本は進められません${histLen ? '<button id="histOpen">これまでの履歴を読む</button>' : ''}</div>`;
    if(showMap && planOf(s)) html += planMapSvg(s, planOf(s).plan);
    if(showMap) html += mode === 'live' ? mapSvg(s, mapMoves(s, w), mapTap(s)) : mapSvg(s, [], null);
    const wait = s.status === 'active' ? behind(s) : [];
    if(wait.length) html += `<div class="lockbar other"><b>${PERIOD_NAMES[periodOf(s.clock)]}に入りました。</b>${wait.map(o => CHARS[o.char].name).join('と')}が${PERIOD_NAMES[periodOf(s.clock) - 1]}を終えるまで、先へは進めません${mode === 'live' ? '<button id="endSave">保存して交代</button>' : ''}</div>`;
    let vh = viewHtml(v, { notices, interactive:mode === 'live' && !wait.length });
    const spNow = s.status === 'active' ? spotOf(s) : null;
    if(spNow){

      const taps = {}, risks = {}; for(const ch of v.choices){ const rm = ch.dest && bookOf(s).spots[ch.dest].room; if(!rm) continue; if(ch.risky) risks[rm] = 1; else if(canGo) taps[rm] = ch.dest; }
      const mapHtml = planOf(s) ? planMapSvg(s, planOf(s).plan) : spNow.at ? townMapSvg(s, w, v.choices, false) : '';

    const ended = s.status !== 'active' && s.status !== 'monster';
    if(!ended && mode === 'live' && !bookOf(s).noJump){
      html += `<div class="jump"><label>番号へ進む</label><input id="jumpNo" type="number" inputmode="numeric" placeholder="段落番号"><button id="jumpGo">進む</button></div>`;
    }
    // 結末まで来たら選ぶものがないので、交代のボタンを本文の下にも出す
    if(ended && mode === 'live') html += '<div class="choices"><button id="endSave">保存して交代</button></div>';
    if(mode === 'live') store.set('player-' + current, s); // 届いた気配を既読にする
    setCutscene(cctvState(s, w));
  }
  html += resultHtml();
  if(helpOpen) html = '<p class="help">右上の ☰ で、開く本を選びます。「ロックして進める」を押すと、その本を進められます（一度に1冊）。進め終わったら ☰ の「保存して交代」。<br>上の「戻す」で、この番に打った手の前まで戻せます。<br>画面の右端の「映像」「地図」を押すと、映像と地図が出たり引っ込んだりします。<br>一日は 朝・午前・昼・午後・夕方・夜 に分かれていて、先に次の時間帯へ入った人は、ほかの人が追いつくまで待ちます。<br>☰ の「最初から」で、全員が朝からやり直します。</p>' + html;

  document.getElementById('main').innerHTML = html;
  const drawer = document.getElementById('drawer');

  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };

  });
  on('mapTab', () => { mapOpen = !mapOpen; document.getElementById('drawer').classList.toggle('open', mapOpen); document.getElementById('mapTab').classList.toggle('on', mapOpen); syncTuck(true); });
  on('helpbtn', () => { helpOpen = !helpOpen; menuOpen = false; render(); window.scrollTo(0, 0); });
  on('mapbtn', () => { showMap = !showMap; render(); window.scrollTo(0, 0); });
  on('reset', () => {
    if(!confirm('全員の進み具合を消して、最初からやり直しますか？')) return;
    store.remove('world'); store.remove('undo'); CHAR_IDS.forEach(id => store.remove('player-' + id)); histIndex = null; render();
  });
  const jumpBtn = document.getElementById('jumpGo');
  if(jumpBtn){
    const input = document.getElementById('jumpNo');
    const submit = () => { const n = parseInt(input.value, 10); if(Number.isFinite(n)) tryJump(n); };
    jumpBtn.onclick = submit;
    input.onkeydown = e => { if(e.key === 'Enter') submit(); };
  }
}

// ===== 開票 =====
// 3冊でしたことが、票の数に出る。まだ開いていない本の人は、何もしなかったものとして数える
const TALLY = {
  base:{ whitmore:1187400, carver:1186900, okafor:214300 },
  names:{ whitmore:'ホイットモア（現職）', carver:'カーヴァー', okafor:'オカフォー' },
  // 州全体の数に出るもの：[印, ホイットモア, カーヴァー, オカフォー, 起きたこと]
  moves:[
    ['gov_queued', 900, 0, 0, '知事は聖マルコ教会で、列の最後尾に並んで投票した。'],
    ['gov_cut', -1100, 400, 0, '知事は聖マルコ教会で、列を飛ばして投票した。'],
    ['gov_skipped_check', -1400, 600, 300, '知事は投票所で、腕の確認を受けずに通った。記者がそれを見ていた。'],
    ['gov_delay', 900, -500, 0, '知事は州立病院の前で、統合の時期を1年延ばして見直すと答えた。'],
    ['gov_stayed', 700, 0, 0, '知事は、演台の前まで3人が来ても、演説をやめなかった。'],
    ['gov_police_promise', 800, -300, 0, '知事はラジオで、巡回の警官の数を戻すと約束した。'],
    ['health_notice', -600, -500, -200, '保健局は昼に、投票所での確認を徹底する呼びかけをもう一度出した。'],
    ['chief_pulled_patrol', -200, -250, -50, '署長は、投票所の巡回の1台を通報の対応へ回した。'],
    ['chief_route', 0, 700, 0, '署長は、カーヴァー陣営の送迎の車が通る道に、巡回を寄せた。'],
    ['bridge_cleared', 350, 500, 100, '署長は、ケスラー橋の事故の車を路肩へ寄せた。川向こうへ出ていた人たちが、8時までに戻れた。'],
    ['dir_with_gov', 500, 0, 0, '院長は、知事の演説のあいだ、演台の横の椅子に座っていた。'],
    ['dir_with_banner', -300, 600, 0, '院長は、知事の演説のあいだ、「病院を残せ」の横断幕の側に立っていた。'],
    ['dir_spoke', -200, 400, 0, '院長は講堂で、統合の日程を読み終えたあと、その日に診た人数を自分の言葉で言い足した。'],
    ['dir_let_vote', 0, 300, 100, '院長は夕方、日勤の職員11人を投票に行かせた。'],
    ['dir_hold_report', 250, 300, 150, '院長は、噛まれた傷の届け出を、翌朝にまとめて出させた。黄色い札を嫌って帰る人が減った。'],
    ['bridge_swept', 150, 250, 50, '署長は、ケスラー橋の歩道の4人を欄干の側へつないだ。歩いて橋を渡る人が、通れるようになった。'],
  ],
  // 第14投票区（リンカーン小学校）の数
  p14:{ whitmore:412, carver:412, okafor:71 },
};
function tallyResult(){
  const w = loadWorld(), has = name => w.events.some(e => e.type === 'flag' && e.name === name);
  const st = Object.fromEntries(CHAR_IDS.map(id => [id, loadPlayer(id)]));
  const t = { ...TALLY.base }, p14 = { ...TALLY.p14 }, notes = [];
  for(const [name, a, b, c, text] of TALLY.moves) if(has(name)){ t.whitmore += a; t.carver += b; t.okafor += c; notes.push(text); }
  if(has('chief_guard_line')){ p14.whitmore += 9; p14.carver += 9; p14.okafor += 3; notes.push('署長は夜、リンカーン小学校の列を守った。8時に列にいた21人が、全員投票した。'); }
  if(has('chief_removed_voter')) notes.push('署長は朝、リンカーン小学校の列から、包帯を巻いた1人を出した。その人が誰に入れるつもりだったかは、記録にない。選挙管理人は、時刻と署長の名前を州務長官へ届けた。');
  // 自分たちの1票
  const votes = w.votes || {}, v = st.voter, prov = !!v.flags.provisional;
  if(votes.governor && t[votes.governor] != null) t[votes.governor] += 1;
  if(votes.voter && t[votes.voter] != null && !prov){ t[votes.voter] += 1; p14[votes.voter] += 1; }
  for(const k of Object.keys(p14)) t[k] += p14[k] - TALLY.p14[k] - (votes.voter === k && !prov ? 1 : 0);
  const total = t.whitmore + t.carver + t.okafor, lead = t.whitmore >= t.carver ? 'whitmore' : 'carver', margin = Math.abs(t.whitmore - t.carver);
  return { t, p14, notes, total, lead, margin, recount:margin <= total * .001, votes, prov, st };
}
function resultHtml(){
  const ps = CHAR_IDS.map(loadPlayer), ended = p => p.status !== 'active' && p.status !== 'monster';
  const started = p => ended(p) || p.status === 'monster' || p.para !== BOOKS[p.char].start;
  const me = loadPlayer(current);
  if(!ended(me)) return '';
  const open = ps.filter(p => started(p) && !ended(p));
  if(open.length) return '<div class="result">開票の結果は、' + open.map(p => CHARS[p.char].name).join('と') + 'の一日が終わると出る。</div>';
  const r = tallyResult(), n = x => x.toLocaleString('ja-JP'), pct = x => (x / r.total * 100).toFixed(2) + '%';
  const row = (k, o, sum) => '<tr><td>' + TALLY.names[k] + '</td><td class="num">' + n(o[k]) + '</td>' + (sum ? '<td class="num">' + pct(o[k]) + '</td>' : '') + '</tr>';
  const order = ['whitmore', 'carver', 'okafor'].sort((a, b) => r.t[b] - r.t[a]);
  let h = '<div class="result"><b>ウィノア州　州知事選挙　非公式集計</b><br>州務長官事務所　開票率100%（暫定投票を除く）';
  h += '<table class="tally">' + order.map(k => row(k, r.t, true)).join('') + '</table>';
  h += '1位と2位の差は、' + n(r.margin) + '票（' + (r.margin / r.total * 100).toFixed(3) + '%）。<br><br>';
  h += r.recount
    ? '差が投票総数の0.1%以下のため、州法により、自動的に再集計が行われる。各郡の開票点検委員会が集計を認証したあと、すべての票を数え直す。当選者は、まだ決まっていない。'
    : TALLY.names[r.lead].replace('（現職）', '') + 'の当選が確実になった。結果は、各郡の開票点検委員会の認証を経て、州務長官が確定する。';
  const gov = r.st.governor;
  if(gov.status === 'monster-done') h += '<br><br>ホイットモア知事は、投票日の' + (gov.clock >= 1200 ? '夜' : '午後') + 'から、公の場に出ていない。' + (r.recount || r.lead !== 'whitmore' ? '' : '州憲法は、当選者が就任の宣誓をできないときは、副知事の当選者が知事に就くと定めている。保健局の指針では、届け出のあった者は、死亡したものとは扱われない。');
  h += '<br><br><b>マーロウ郡　第14投票区（リンカーン小学校）</b><table class="tally">' + ['whitmore', 'carver', 'okafor'].sort((a, b) => r.p14[b] - r.p14[a]).map(k => row(k, r.p14)).join('') + '</table>';
  h += r.p14.whitmore === r.p14.carver ? 'この投票区では、上の2人が同数だった。' : 'この投票区では、' + TALLY.names[r.p14.whitmore > r.p14.carver ? 'whitmore' : 'carver'].replace('（現職）', '') + 'が' + Math.abs(r.p14.whitmore - r.p14.carver) + '票多かった。';
  const own = [];
  const v = r.st.voter;
  if(r.votes.voter) own.push(r.prov ? 'モーガンの票は暫定投票で、この数にはまだ入っていない。7日以内に郡の窓口へ身分のわかるものを持っていけば、数に加えられる。' + (String(v.status).startsWith('left') ? 'モーガンは、その夜のうちに州を出た。' : v.status === 'monster-done' ? 'モーガンは、窓口へは行かなかった。' : '') : 'モーガンの1票は、この数に入っている。');
  else if(started(v)) own.push('モーガンは、投票しなかった。');
  if(r.votes.governor) own.push('ホイットモア知事の1票は、第9投票区（聖マルコ教会）の数に入っている。');
  else if(started(gov)) own.push('ホイットモア知事は、投票しなかった。');
  if(started(r.st.director)) own.push('ハーラン院長は、先週のうちに期日前投票を済ませている。');
  if(started(r.st.chief)) own.push('ブレナン署長は、一日のあいだ、どの投票所でも立て札から先へは入らなかった。投票もしていない。');
  h += '<br><br>' + own.join('<br>');
  if(r.notes.length) h += '<br><br><b>この一日のうち、数に出たこと</b><br>' + r.notes.join('<br>');
  return h + '</div>';
}
