<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src wss://game-relay.game-relay-worker.workers.dev; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>席にトークンを入れる</title>
</head>
<body style="font:16px/1.7 sans-serif;max-width:560px;margin:32px auto;padding:0 16px">
<h1 style="font-size:20px">席にトークンを入れる</h1>
<p>入れたトークンは、AI との会話には出ません。このページがトークンを暗号にしてから席へ送るので、中継のサーバーには、トークンは見えません。</p>
<p>入れる所：<b id="field"></b></p>
<form id="form">
<input id="v" type="password" autocomplete="off" autofocus style="font-size:16px;width:100%;padding:8px;box-sizing:border-box">
<p><button id="go" style="font-size:16px;padding:8px 20px">入れる</button></p>
</form>
<p id="note" style="color:#666">トークンを、AI との会話に書かないでください。</p>
<script src="secret.js"></script>
</body>
</html>
